<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jobs de Marketing · Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F6;
    --surface:#FFFFFF;
    --surface-2:#F8F9FC;
    --ink:#171C28;
    --ink-soft:#414A5E;
    --muted:#838C9E;
    --faint:#AEB5C2;
    --line:#E7EAF0;
    --line-strong:#D6DAE3;

    --brand:#0E8C7F;   --brand-bg:#E4F2EF;
    --noprazo:#2F6FB2;    --noprazo-bg:#E7F0F9;
    --aguardando:#9A57A8; --aguardando-bg:#F4EBF6;
    --atrasado:#C2410C;   --atrasado-bg:#FBEDE4;
    --concluido:#159069;  --concluido-bg:#E4F3EE;
    --pausado:#838C9E;    --pausado-bg:#EEF0F4;
    --cancelado:#DA3B41;  --cancelado-bg:#FBE9EA;
    --accent:#171C28;  --accent-bg:#EBEDF2;

    --r:16px; --r-sm:11px; --r-xs:8px;
    --sh:0 1px 2px rgba(23,28,40,.04), 0 4px 16px rgba(23,28,40,.05);
    --sh-pop:0 16px 50px rgba(23,28,40,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:
      radial-gradient(1100px 520px at 15% -8%, #F3F6FB 0%, rgba(243,246,251,0) 60%),
      radial-gradient(900px 480px at 100% 0%, #EAF6F3 0%, rgba(234,246,243,0) 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"JetBrains Mono",monospace;font-feature-settings:"tnum"}
  button{font-family:inherit;cursor:pointer;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14.5px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}

  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 90px}

  /* header */
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px}
  .top .logo{display:flex;align-items:center;gap:11px}
  .top .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#1FB8A6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:"Bricolage Grotesque";font-size:17px;flex:0 0 auto}
  .top h1{font-family:"Bricolage Grotesque";font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0;line-height:1.1}
  .top .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .top .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:11px;padding:9px 14px;font-weight:700;font-size:13.5px;color:var(--ink-soft);box-shadow:var(--sh);white-space:nowrap}
  .btn:hover{background:var(--surface-2);color:var(--ink)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{background:#000}
  .btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--muted);padding:9px 10px}
  .savestat{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted)}
  .savestat .dotok{width:7px;height:7px;border-radius:50%;background:var(--concluido);flex:0 0 auto;box-shadow:0 0 0 3px var(--concluido-bg)}
  .savestat .dotwarn{width:7px;height:7px;border-radius:50%;background:#D08412;flex:0 0 auto;box-shadow:0 0 0 3px #FBF1E2}

  /* kpis */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
  .kpi .l{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;margin-top:5px;letter-spacing:-.01em}
  .kpi .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
  @media (max-width:920px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpis.secondary{margin-bottom:18px}
  .kpis.secondary .kpi .v{font-size:19px}

  /* tabs */
  .maintabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;box-shadow:var(--sh);width:max-content;margin-bottom:14px}
  .maintabs button{border:0;background:transparent;border-radius:8px;padding:8px 16px;font-weight:700;font-size:13.5px;color:var(--muted)}
  .maintabs button.on{background:var(--ink);color:#fff}

  /* toolbar / filters */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;box-shadow:var(--sh)}
  .seg button{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-weight:600;font-size:12.5px;color:var(--muted)}
  .seg button.on{background:var(--ink);color:#fff}
  .fselect,.fsearch,.fdate{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:13px;color:var(--ink-soft);box-shadow:var(--sh)}
  .fsearch{min-width:160px}

  /* breakdown / dashboard */
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:820px){.dash-grid{grid-template-columns:1fr}}
  .breakdown{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
  .breakdown h3{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
  .brow{display:grid;grid-template-columns:minmax(90px,150px) 1fr 46px 88px;align-items:center;gap:10px;padding:7px 0;font-size:13px}
  .brow+.brow{border-top:1px solid var(--line)}
  .brow .name{font-weight:700;color:var(--ink);line-height:1.25}
  .brow .bar{height:8px;border-radius:99px;background:#E3E7EE;overflow:hidden}
  .brow .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),#1FB8A6)}
  .brow .pct{font-weight:700;color:var(--ink-soft);text-align:right}
  .brow .val{color:var(--muted);text-align:right;white-space:nowrap}
  @media (max-width:640px){.brow{grid-template-columns:100px 1fr 40px}.brow .val{display:none}}
  .funnel{display:flex;gap:10px;flex-wrap:wrap}
  .funnel .fitem{flex:1;min-width:110px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .funnel .fitem .n{font-family:"Bricolage Grotesque";font-weight:800;font-size:20px}
  .funnel .fitem .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-top:2px}

  /* cadastros (settings) */
  .cfgsection+.cfgsection{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .cfgsection h4{margin:0;font-size:13px;font-weight:700;color:var(--ink-soft)}
  .chiplist{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .chip{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
  .chip button{border:0;background:var(--line);color:var(--ink-soft);width:18px;height:18px;border-radius:50%;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
  .chip button:hover{background:var(--cancelado-bg);color:var(--cancelado)}
  .addrow{display:flex;gap:8px;margin-top:9px}
  .addrow input{flex:1;border:1px solid var(--line-strong);border-radius:10px;padding:8px 11px;background:var(--surface-2)}
  .addrow button{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;white-space:nowrap}

  /* list */
  .empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted)}
  .cards{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;box-shadow:var(--sh)}
  .card .top-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
  .card .cliente{font-weight:700;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--accent-bg);color:var(--ink-soft);white-space:nowrap}
  .card .badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .status{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
  .status.noprazo{background:var(--noprazo-bg);color:var(--noprazo)}
  .status.aguardandocliente{background:var(--aguardando-bg);color:var(--aguardando)}
  .status.atrasado{background:var(--atrasado-bg);color:var(--atrasado)}
  .status.concluido{background:var(--concluido-bg);color:var(--concluido)}
  .status.pausado{background:var(--pausado-bg);color:var(--pausado)}
  .status.cancelado{background:var(--cancelado-bg);color:var(--cancelado)}
  .card .meta{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .card .meta b{color:var(--ink-soft);font-weight:600}
  .card .meta .late{color:var(--atrasado);font-weight:700}
  .card .pbar-row{display:flex;align-items:center;gap:8px;margin-top:9px}
  .card .pbar{flex:1;height:7px;border-radius:99px;background:#E3E7EE;overflow:hidden}
  .card .pbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),#1FB8A6)}
  .card .pbar-row .pctlabel{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
  .card .valorrow{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font-size:12.5px;color:var(--muted)}
  .card .valorrow b{color:var(--ink);font-family:"Bricolage Grotesque";font-weight:800;font-size:14px}
  .card .proximos{margin-top:8px;font-size:12.5px;color:var(--ink-soft);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .card .acts button{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--ink-soft)}
  .card .acts button:hover{background:var(--surface-2)}
  .card .acts button.ok{color:var(--concluido);border-color:var(--concluido-bg)}
  .card .acts button.del{color:var(--faint)}

  /* modal */
  .backdrop{position:fixed;inset:0;background:rgba(23,28,40,.42);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;z-index:80}
  .backdrop.open{display:flex}
  .modal{background:var(--surface);border-radius:18px;max-width:560px;width:100%;box-shadow:var(--sh-pop);overflow:hidden}
  .modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal header h3{margin:0;font-family:"Bricolage Grotesque";font-size:18px;font-weight:800}
  .modal header .x{border:0;background:transparent;font-size:20px;color:var(--muted);line-height:1;padding:4px}
  .modal .form{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;max-height:78vh;overflow:auto}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:9px 11px;background:var(--surface-2)}
  .field textarea{resize:vertical;min-height:56px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:480px){.row2{grid-template-columns:1fr}}
  .save{width:100%;border:0;background:var(--ink);color:#fff;border-radius:11px;padding:12px;font-weight:700;font-size:14.5px;margin-top:4px}
  .save:hover{background:#000}
  .delrow{display:flex;justify-content:center;margin-top:6px}
  .delrow button{border:0;background:transparent;color:var(--cancelado);font-weight:600;font-size:13px}
  details.more{border-top:1px dashed var(--line-strong);padding-top:10px;margin-top:2px}
  details.more summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--brand);list-style:none}
  details.more summary::-webkit-details-marker{display:none}
  details.more[open] summary{margin-bottom:12px}
  details.more .form{padding:0;max-height:none;overflow:visible}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--sh-pop);z-index:90;opacity:0;transition:.28s;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">
      <div class="mark">J</div>
      <div>
        <h1>Jobs de Marketing · Clientes</h1>
        <div class="sub">Acompanhamento de fases do projeto + fechamento comercial por analista</div>
      </div>
    </div>
    <div class="actions">
      <span class="savestat" id="saveStat"></span>
      <button class="btn ghost" data-act="settings" title="Cadastrar analistas, executivos e veículos">⚙ Cadastros</button>
      <button class="btn ghost" data-act="export" title="Baixar backup em JSON">⬇ Exportar</button>
      <label class="btn ghost" title="Importar backup em JSON">⬆ Importar<input type="file" id="fileImport" accept="application/json"></label>
      <button class="btn primary" data-act="new">+ Novo job</button>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>
  <div class="kpis secondary" id="kpisComercial"></div>

  <div class="maintabs" id="mainTabs">
    <button data-v="jobs" class="on">Jobs</button>
    <button data-v="dashboard">Dashboard</button>
  </div>

  <div class="toolbar">
    <div class="filters">
      <div class="seg" id="segStatus">
        <button data-v="todos" class="on">Todos</button>
        <button data-v="andamento">Em andamento</button>
        <button data-v="concluido">Concluídos</button>
        <button data-v="atrasado">Atrasados</button>
        <button data-v="aguardando">Aguardando cliente</button>
      </div>
      <select class="fselect" id="fPraca"><option value="todos">Todas as praças</option></select>
      <select class="fselect" id="fAnalista"><option value="todos">Todas as analistas</option></select>
      <select class="fselect" id="fExecutivo"><option value="todos">Todos os executivos</option></select>
      <select class="fselect" id="fVeiculo"><option value="todos">Todos os veículos</option></select>
      <input class="fsearch" id="fBusca" placeholder="Buscar cliente...">
      <input class="fdate" id="fDe" type="date" title="Início (briefing) de">
      <input class="fdate" id="fAte" type="date" title="Início (briefing) até">
    </div>
  </div>

  <div id="viewJobs"><div id="list"></div></div>
  <div id="viewDashboard" style="display:none"><div id="dashboard"></div></div>
</div>

<div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div>

<script>
const KEY="jobs-marketing-v2";
let data={jobs:[],config:{}};
let filters={seg:"todos",praca:"todos",analista:"todos",executivo:"todos",veiculo:"todos",q:"",de:"",ate:""};
let editId=null;
let mainView="jobs";

const PRACAS=["CAM","RIB","SCA","VAR","CE"];
const ORIGENS=["Cliente","EP Labs"];
const PRIORIDADES=["Alta","Média","Baixa"];
const FASES=["Briefing","Desenvolvimento","Validação Interna","Aprovação Cliente","Concluído","Pausado","Cancelado"];
const FASE_PCT={"Briefing":.2,"Desenvolvimento":.45,"Validação Interna":.7,"Aprovação Cliente":.9,"Concluído":1,"Pausado":.1,"Cancelado":0};
const FASE_ORDEM=["Briefing","Desenvolvimento","Validação Interna","Aprovação Cliente","Concluído"];
const FASE_AVANCO_DATA={"Desenvolvimento":"dataConclDesenvolvimento","Validação Interna":"dataConclValidacao","Aprovação Cliente":null,"Concluído":"dataAprovacaoCliente"};
const SITUACOES=["No prazo","Aguardando cliente","Atrasado","Concluído","Pausado","Cancelado"];
const MOTIVOS=["Preço","Prazo / timing","Concorrência","Cliente desistiu","Outro"];
const VEICULOS_PADRAO=["Google Ads","Meta Ads","TV / Rádio / Mídia tradicional","Influenciadores / Outros digitais","LinkedIn Ads","TikTok Ads","Outro"];
function situClass(s){return "status "+(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");}

/* ============ persistência (mesmo padrão do Painel do Leandro) ============ */
async function load(){
  try{
    if(window.storage){
      let r=await window.storage.get(KEY).catch(()=>null);
      if(r&&r.value) data=JSON.parse(r.value);
    }else if(window.localStorage){
      const v=localStorage.getItem(KEY);
      if(v) data=JSON.parse(v);
    }
  }catch(e){}
  data.jobs=data.jobs||[];
  data.config=data.config||{};
  data.config.analistas=data.config.analistas||[];
  data.config.executivos=data.config.executivos||[];
  data.config.veiculos=(data.config.veiculos&&data.config.veiculos.length)?data.config.veiculos:VEICULOS_PADRAO.slice();
  data.jobs.forEach(j=>{
    if(j.analista&&!data.config.analistas.includes(j.analista))data.config.analistas.push(j.analista);
    if(j.executivo&&!data.config.executivos.includes(j.executivo))data.config.executivos.push(j.executivo);
  });
}
async function save(){
  try{
    if(window.storage){ await window.storage.set(KEY,JSON.stringify(data)); setSaveStat("ok"); }
    else if(window.localStorage){ localStorage.setItem(KEY,JSON.stringify(data)); setSaveStat("local"); }
    else setSaveStat("none");
  }catch(e){ setSaveStat("err"); }
}
function setSaveStat(s){
  const el=document.getElementById("saveStat");if(!el)return;
  const h=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  if(s==="ok")el.innerHTML=`<span class="dotok"></span>Salvo na sua conta · ${h}`;
  else if(s==="local")el.innerHTML=`<span class="dotok"></span>Salvo neste navegador · ${h}`;
  else if(s==="none")el.innerHTML=`<span class="dotwarn"></span>Sem salvamento — exporte`;
  else el.innerHTML=`<span class="dotwarn"></span>Falha ao salvar — exporte`;
}

/* ============ helpers ============ */
function uid(){return "j"+Date.now()+Math.random().toString(36).slice(2,7);}
function d0(){const d=new Date();d.setHours(0,0,0,0);return d;}
function pd(s){if(!s)return null;const d=new Date(s+"T00:00:00");return isNaN(d)?null:d;}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(s){const d=pd(s);if(!d)return"—";return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});}
function fmtMoney(n){n=Number(n)||0;return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{t.classList.remove("show");setTimeout(()=>t.remove(),320);},2600);
}

/* ============ campos calculados (espelha as fórmulas da planilha) ============ */
function pctConcl(j){return FASE_PCT[j.faseAtual]||0;}
function diasEmAberto(j){
  const start=pd(j.dataInicioBriefing);if(!start)return null;
  const end=(j.faseAtual==="Concluído"&&j.dataAprovacaoCliente)?pd(j.dataAprovacaoCliente):d0();
  if(!end)return null;
  return Math.round((end-start)/86400000);
}
function alertaPrazo(j){
  if(j.faseAtual==="Concluído"||j.faseAtual==="Cancelado")return "—";
  const prazo=pd(j.prazoPrevisto);if(!prazo)return "";
  const diff=Math.round((prazo-d0())/86400000);
  if(diff<0)return "Atrasado";
  if(diff<=5)return "Vence em breve";
  return "No prazo";
}

/* ============ filtro ============ */
function filtered(){
  return data.jobs.filter(j=>{
    if(filters.seg==="andamento"&&!["Briefing","Desenvolvimento","Validação Interna","Aprovação Cliente"].includes(j.faseAtual))return false;
    if(filters.seg==="concluido"&&j.faseAtual!=="Concluído")return false;
    if(filters.seg==="atrasado"&&alertaPrazo(j)!=="Atrasado")return false;
    if(filters.seg==="aguardando"&&j.situacao!=="Aguardando cliente")return false;
    if(filters.praca!=="todos"&&j.praca!==filters.praca)return false;
    if(filters.analista!=="todos"&&j.analista!==filters.analista)return false;
    if(filters.executivo!=="todos"&&j.executivo!==filters.executivo)return false;
    if(filters.veiculo!=="todos"&&j.veiculo!==filters.veiculo)return false;
    if(filters.q&&!j.cliente.toLowerCase().includes(filters.q.toLowerCase()))return false;
    if(filters.de&&j.dataInicioBriefing&&j.dataInicioBriefing<filters.de)return false;
    if(filters.ate&&j.dataInicioBriefing&&j.dataInicioBriefing>filters.ate)return false;
    return true;
  }).sort((a,b)=>(b.dataInicioBriefing||"").localeCompare(a.dataInicioBriefing||""));
}

/* ============ render ============ */
function render(){
  renderFPraca();renderFAnalista();renderFExecutivo();renderFVeiculo();
  const list=filtered();
  renderKpis(list);
  document.getElementById("viewJobs").style.display=mainView==="jobs"?"block":"none";
  document.getElementById("viewDashboard").style.display=mainView==="dashboard"?"block":"none";
  if(mainView==="jobs")renderList(list);
  else renderDashboard(list);
}
function fillFilterSelect(id,label,values,cur){
  const sel=document.getElementById(id);
  const names=[...new Set((values||[]).filter(Boolean))].sort();
  sel.innerHTML=`<option value="todos">${label}</option>`+names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
  sel.value=names.includes(cur)?cur:"todos";
  return sel.value;
}
function renderFPraca(){
  const sel=document.getElementById("fPraca");
  filters.praca=fillFilterSelect("fPraca","Todas as praças",PRACAS,sel.value||filters.praca);
}
function renderFAnalista(){
  const sel=document.getElementById("fAnalista");
  filters.analista=fillFilterSelect("fAnalista","Todas as analistas",[...(data.config.analistas||[]),...data.jobs.map(j=>j.analista)],sel.value||filters.analista);
}
function renderFExecutivo(){
  const sel=document.getElementById("fExecutivo");
  filters.executivo=fillFilterSelect("fExecutivo","Todos os executivos",[...(data.config.executivos||[]),...data.jobs.map(j=>j.executivo)],sel.value||filters.executivo);
}
function renderFVeiculo(){
  const sel=document.getElementById("fVeiculo");
  filters.veiculo=fillFilterSelect("fVeiculo","Todos os veículos",[...(data.config.veiculos||[]),...data.jobs.map(j=>j.veiculo)],sel.value||filters.veiculo);
}
function renderKpis(list){
  const total=list.length;
  const andamento=list.filter(j=>["Briefing","Desenvolvimento","Validação Interna","Aprovação Cliente"].includes(j.faseAtual)).length;
  const concluidos=list.filter(j=>j.faseAtual==="Concluído").length;
  const atrasados=list.filter(j=>alertaPrazo(j)==="Atrasado").length;
  const aguardando=list.filter(j=>j.situacao==="Aguardando cliente").length;
  document.getElementById("kpis").innerHTML=`
    <div class="kpi"><div class="l">Total de projetos</div><div class="v">${total}</div></div>
    <div class="kpi"><div class="l">Em andamento</div><div class="v">${andamento}</div></div>
    <div class="kpi"><div class="l">Concluídos</div><div class="v">${concluidos}</div></div>
    <div class="kpi"><div class="l">Atrasados</div><div class="v">${atrasados}</div></div>
    <div class="kpi"><div class="l">Aguardando cliente</div><div class="v">${aguardando}</div></div>
  `;
  const valorOrcado=list.reduce((s,j)=>s+(Number(j.valorOrcado)||0),0);
  const valorFechado=list.reduce((s,j)=>s+(Number(j.valorFechado)||0),0);
  const comFechado=list.filter(j=>Number(j.valorFechado)>0).length;
  const aprovPct=valorOrcado>0?Math.round(valorFechado/valorOrcado*100):0;
  document.getElementById("kpisComercial").innerHTML=`
    <div class="kpi"><div class="l">Valor orçado</div><div class="v">${fmtMoney(valorOrcado)}</div></div>
    <div class="kpi"><div class="l">Valor fechado</div><div class="v">${fmtMoney(valorFechado)}</div></div>
    <div class="kpi"><div class="l">% aprovado do orçado</div><div class="v">${aprovPct}<small>%</small></div></div>
    <div class="kpi"><div class="l">Jobs com valor fechado</div><div class="v">${comFechado}<small>de ${total}</small></div></div>
    <div class="kpi"><div class="l">Ticket médio fechado</div><div class="v">${fmtMoney(comFechado>0?valorFechado/comFechado:0)}</div></div>
  `;
}

/* ============ dashboard ============ */
function countBreakdownHtml(title,order,list,keyFn,colorFn){
  const counts={};order.forEach(k=>counts[k]=0);
  list.forEach(j=>{const k=keyFn(j);if(k!=null)counts[k]=(counts[k]||0)+1;});
  const max=Math.max(1,...Object.values(counts));
  const rows=order.map(k=>{
    const c=counts[k]||0;const pct=Math.round(c/max*100);
    const barStyle=colorFn?`background:${colorFn(k)}`:"";
    return `<div class="brow"><div class="name">${esc(k)}</div><div class="bar"><i style="width:${pct}%;${barStyle}"></i></div><div class="pct">${c}</div></div>`;
  }).join("");
  return `<div class="breakdown"><h3>${title}</h3>${rows}</div>`;
}
function groupValor(list,keyFn){
  const map={};
  list.forEach(j=>{
    const k=keyFn(j)||"Não informado";
    map[k]=map[k]||{concluido:0,decidido:0,valor:0};
    if(j.faseAtual==="Concluído"||j.faseAtual==="Cancelado")map[k].decidido++;
    if(j.faseAtual==="Concluído"){map[k].concluido++;map[k].valor+=Number(j.valorFechado)||0;}
  });
  return map;
}
function valorBreakdownHtml(title,map,mode){
  const keys=Object.keys(map);
  if(!keys.length)return `<div class="breakdown"><h3>${title}</h3><div style="color:var(--muted);font-size:13px">Sem dados suficientes ainda.</div></div>`;
  const totalValor=keys.reduce((s,k)=>s+map[k].valor,0)||1;
  const rows=keys.sort((a,b)=>map[b].valor-map[a].valor).map(k=>{
    const d=map[k];
    const pct=mode==="conv"?(d.decidido>0?Math.round(d.concluido/d.decidido*100):0):Math.round(d.valor/totalValor*100);
    return `<div class="brow"><div class="name">${esc(k)}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="pct">${pct}%</div><div class="val">${fmtMoney(d.valor)}</div></div>`;
  }).join("");
  return `<div class="breakdown"><h3>${title}</h3>${rows}</div>`;
}
const SITU_COLOR={"No prazo":"var(--noprazo)","Aguardando cliente":"var(--aguardando)","Atrasado":"var(--atrasado)","Concluído":"var(--concluido)","Pausado":"var(--pausado)","Cancelado":"var(--cancelado)"};
function renderDashboard(list){
  if(!list.length){document.getElementById("dashboard").innerHTML=`<div class="empty">Sem jobs para exibir com esses filtros ainda.</div>`;return;}
  const html=
    countBreakdownHtml("Funil por fase",FASES,list,j=>j.faseAtual)
    +`<div class="dash-grid">`
    + countBreakdownHtml("Projetos por praça",PRACAS,list,j=>j.praca)
    + countBreakdownHtml("Projetos por situação",SITUACOES,list,j=>j.situacao,k=>SITU_COLOR[k])
    + countBreakdownHtml("Projetos por origem",ORIGENS,list,j=>j.origem)
    + countBreakdownHtml("Projetos por prioridade",PRIORIDADES,list,j=>j.prioridade)
    + valorBreakdownHtml("Valor fechado por veículo",groupValor(list,j=>j.veiculo),"share")
    + valorBreakdownHtml("Conclusão e valor por analista",groupValor(list,j=>j.analista),"conv")
    + valorBreakdownHtml("Conclusão e valor por executivo de conta",groupValor(list,j=>j.executivo),"conv")
    + `</div>`;
  document.getElementById("dashboard").innerHTML=html;
}

function openEditJobModal(id){
  const j=data.jobs.find(x=>x.id===id);if(!j)return;
  editId=id;openModal(jobForm(j));wireForm();
}
function wireForm(){
  document.getElementById("f_situacao").addEventListener("change",e=>{
    document.getElementById("campoMotivo").style.display=e.target.value==="Cancelado"?"block":"none";
  });
}
function saveJobForm(){
  const cliente=document.getElementById("f_cliente").value.trim();
  if(!cliente){toast("Informe o cliente.");return;}
  const analista=document.getElementById("f_analista").value.trim();
  const executivo=document.getElementById("f_executivo").value.trim();
  const situacao=document.getElementById("f_situacao").value;
  const j={
    id:editId||uid(),
    cliente,
    praca:document.getElementById("f_praca").value,
    origem:document.getElementById("f_origem").value,
    analista,
    executivo,
    prioridade:document.getElementById("f_prioridade").value,
    faseAtual:document.getElementById("f_fase").value,
    situacao,
    prazoPrevisto:document.getElementById("f_prazo").value,
    dataInicioBriefing:document.getElementById("f_inicio").value||today(),
    ultimoContato:document.getElementById("f_ultimoContato").value,
    motivoPerda:situacao==="Cancelado"?document.getElementById("f_motivo").value:"",
    proximosPassos:document.getElementById("f_proximos").value.trim(),
    dataConclDesenvolvimento:document.getElementById("f_conclDesenv").value,
    dataConclValidacao:document.getElementById("f_conclValidacao").value,
    dataAprovacaoCliente:document.getElementById("f_aprovacaoCliente").value,
    valorOrcado:Number(document.getElementById("f_valorOrcado").value)||0,
    valorFechado:Number(document.getElementById("f_valorFechado").value)||0,
    veiculo:document.getElementById("f_veiculo").value,
    updatedAt:Date.now()
  };
  if(analista&&!data.config.analistas.includes(analista))data.config.analistas.push(analista);
  if(executivo&&!data.config.executivos.includes(executivo))data.config.executivos.push(executivo);
  const idx=data.jobs.findIndex(x=>x.id===j.id);
  if(idx>=0)data.jobs[idx]=Object.assign({},data.jobs[idx],j);
  else{j.createdAt=Date.now();data.jobs.push(j);}
  save();closeModal();render();
  toast("Job salvo ✓");
}
function avancarFase(id){
  const j=data.jobs.find(x=>x.id===id);if(!j)return;
  const idx=FASE_ORDEM.indexOf(j.faseAtual);if(idx<0||idx>=FASE_ORDEM.length-1)return;
  const proxima=FASE_ORDEM[idx+1];
  const campoData=FASE_AVANCO_DATA[proxima];
  if(campoData)j[campoData]=today();
  j.faseAtual=proxima;
  if(proxima==="Concluído")j.situacao="Concluído";
  j.updatedAt=Date.now();
  save();render();
  toast(`Avançou para ${proxima} ✓`);
}

/* ============ exportar / importar ============ */
let pendingImport=null;
function exportData(){
  try{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="jobs-marketing-"+today()+".json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast("Backup baixado ✓");
  }catch(e){toast("Não consegui gerar o arquivo.");}
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    let obj;
    try{obj=JSON.parse(r.result);}catch(e){toast("Arquivo inválido.");return;}
    if(!obj||!Array.isArray(obj.jobs)){toast("Não parece um backup de Jobs.");return;}
    pendingImport=obj.jobs;
    openModal(`<header><h3>Importar backup</h3><button class="x" data-act="close">×</button></header>
      <div class="form"><p style="color:var(--ink-soft);font-size:14.5px;line-height:1.55;margin:8px 0 0">O arquivo contém <b>${pendingImport.length} job(s)</b>.</p>
      <button class="save" data-act="do-import-merge">Somar ao que já existe</button>
      <button class="save" data-act="do-import-replace" style="background:var(--cancelado);margin-top:9px">Substituir tudo</button>
      <div class="delrow"><button data-act="close">Cancelar</button></div></div>`);
  };
  r.readAsText(file);
}
function doImport(mode){
  if(!pendingImport)return;
  if(mode==="replace")data.jobs=pendingImport;
  else{
    const ids=new Set(data.jobs.map(j=>j.id));
    pendingImport.forEach(j=>{if(!j.id||ids.has(j.id))j.id=uid();data.jobs.push(j);});
  }
  pendingImport=null;save();closeModal();render();
  toast(mode==="replace"?"Dados substituídos ✓":"Dados somados ✓");
}

document.getElementById("fExecutivo").addEventListener("change",e=>{filters.executivo=e.target.value;render();});
document.getElementById("fVeiculo").addEventListener("change",e=>{filters.veiculo=e.target.value;render();});
document.getElementById("fBusca").addEventListener("input",e=>{filters.q=e.target.value;render();});
document.getElementById("fDe").addEventListener("change",e=>{filters.de=e.target.value;render();});
document.getElementById("fAte").addEventListener("change",e=>{filters.ate=e.target.value;render();});
document.getElementById("fileImport").addEventListener("change",e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value="";});
document.body.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches("[data-cfg-input]")){
    e.preventDefault();
    document.querySelector(`button[data-act="cfg-add"][data-key="${e.target.dataset.cfgInput}"]`).click();
  }
  if(e.key==="Escape")closeModal();
});

document.body.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]");if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;
  if(act==="new")openNewJobModal();
  else if(act==="edit")openEditJobModal(id);
  else if(act==="avancar")avancarFase(id);
  else if(act==="save-job")saveJobForm();
  else if(act==="del"){
    if(confirm("Excluir este job? Essa ação não pode ser desfeita.")){
      data.jobs=data.jobs.filter(j=>j.id!==id);
      save();closeModal();render();toast("Job excluído");
    }
  }
  else if(act==="export")exportData();
  else if(act==="do-import-merge")doImport("merge");
  else if(act==="do-import-replace")doImport("replace");
  else if(act==="settings")openSettings();
  else if(act==="cfg-add"){
    const key=b.dataset.key;
    const input=document.querySelector(`[data-cfg-input="${key}"]`);
    const v=input.value.trim();
    if(!v)return;
    data.config[key]=data.config[key]||[];
    if(!data.config[key].includes(v))data.config[key].push(v);
    save();openModal(settingsHtml());render();
  }
  else if(act==="cfg-del"){
    data.config[b.dataset.key]=(data.config[b.dataset.key]||[]).filter(n=>n!==b.dataset.name);
    save();openModal(settingsHtml());render();
  }
  else if(act==="close")closeModal();
});
document.getElementById("backdrop").addEventListener("click",e=>{if(e.target.id==="backdrop")closeModal();});

/* ============ boot ============ */
(async function(){await load();render();setSaveStat(window.storage?"ok":(window.localStorage?"local":"none"));})();
</script>
</body>
</html>
