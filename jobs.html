<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jobs de Marketing · Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F6;
    --surface:#FFFFFF;
    --surface-2:#F8F9FC;
    --ink:#171C28;
    --ink-soft:#414A5E;
    --muted:#838C9E;
    --faint:#AEB5C2;
    --line:#E7EAF0;
    --line-strong:#D6DAE3;

    --brand:#0E8C7F;   --brand-bg:#E4F2EF;
    --noprazo:#2F6FB2;    --noprazo-bg:#E7F0F9;
    --aguardando:#9A57A8; --aguardando-bg:#F4EBF6;
    --atrasado:#C2410C;   --atrasado-bg:#FBEDE4;
    --concluido:#159069;  --concluido-bg:#E4F3EE;
    --pausado:#838C9E;    --pausado-bg:#EEF0F4;
    --cancelado:#DA3B41;  --cancelado-bg:#FBE9EA;
    --accent:#171C28;  --accent-bg:#EBEDF2;
    --warn:#D08412;    --warn-bg:#FBF1E2;
    --track:#E3E7EE;   --brand-2:#1FB8A6;
    --deco1:#F3F6FB;   --deco2:#EAF6F3;
    --scrim:rgba(23,28,40,.42);
    --inverse:#171C28; --inverse-text:#FFFFFF; --inverse-hover:#000000;
    --side-bg:#12161C; --side-line:rgba(255,255,255,.08); --side-ink:#EDEFF3; --side-muted:#93A0B8; --side-hover:rgba(255,255,255,.06);

    --r:16px; --r-sm:11px; --r-xs:8px;
    --sh:0 1px 2px rgba(23,28,40,.04), 0 4px 16px rgba(23,28,40,.05);
    --sh-pop:0 16px 50px rgba(23,28,40,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101513; --surface:#181F1D; --surface-2:#1E2624;
      --ink:#EAF2F0; --ink-soft:#B7C4C1; --muted:#7E8C89; --faint:#4E5B58;
      --line:#283330; --line-strong:#37443F;
      --brand:#2FC0AA; --brand-bg:#12312C; --brand-2:#38D6BE;
      --noprazo:#6BA8E8; --noprazo-bg:#152B40;
      --aguardando:#CB98D6; --aguardando-bg:#2F2036;
      --atrasado:#F0895F; --atrasado-bg:#3A2213;
      --concluido:#3FD199; --concluido-bg:#0F3527;
      --pausado:#8FA09C; --pausado-bg:#242E2B;
      --cancelado:#F17983; --cancelado-bg:#3B171B;
      --accent:#EAF2F0; --accent-bg:#252F2C;
      --warn:#E8A23F; --warn-bg:#3A2C10;
      --track:#2A3532; --deco1:#132420; --deco2:#0F1F1C;
      --scrim:rgba(0,0,0,.55);
      --inverse:#EAF2F0; --inverse-text:#101513; --inverse-hover:#C9D6D3;
      --side-bg:#0B0F0D; --side-line:rgba(255,255,255,.07); --side-ink:#EAF2F0; --side-muted:#7E8C89; --side-hover:rgba(255,255,255,.05);
      --sh:0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
      --sh-pop:0 20px 60px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101513; --surface:#181F1D; --surface-2:#1E2624;
    --ink:#EAF2F0; --ink-soft:#B7C4C1; --muted:#7E8C89; --faint:#4E5B58;
    --line:#283330; --line-strong:#37443F;
    --brand:#2FC0AA; --brand-bg:#12312C; --brand-2:#38D6BE;
    --noprazo:#6BA8E8; --noprazo-bg:#152B40;
    --aguardando:#CB98D6; --aguardando-bg:#2F2036;
    --atrasado:#F0895F; --atrasado-bg:#3A2213;
    --concluido:#3FD199; --concluido-bg:#0F3527;
    --pausado:#8FA09C; --pausado-bg:#242E2B;
    --cancelado:#F17983; --cancelado-bg:#3B171B;
    --accent:#EAF2F0; --accent-bg:#252F2C;
    --warn:#E8A23F; --warn-bg:#3A2C10;
    --track:#2A3532; --deco1:#132420; --deco2:#0F1F1C;
    --scrim:rgba(0,0,0,.55);
    --inverse:#EAF2F0; --inverse-text:#101513; --inverse-hover:#C9D6D3;
    --side-bg:#0B0F0D; --side-line:rgba(255,255,255,.07); --side-ink:#EAF2F0; --side-muted:#7E8C89; --side-hover:rgba(255,255,255,.05);
    --sh:0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
    --sh-pop:0 20px 60px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"JetBrains Mono",monospace;font-feature-settings:"tnum"}
  button{font-family:inherit;cursor:pointer;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14.5px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}}

  /* ===== shell: sidebar + main ===== */
  .shell{display:grid;grid-template-columns:258px 1fr;min-height:100vh}
  .side{background:var(--side-bg);color:var(--side-ink);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:12px;padding:0 4px}
  .brand .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:"Bricolage Grotesque";font-size:16px;flex:0 0 auto;box-shadow:0 4px 14px -2px color-mix(in srgb, var(--brand) 60%, transparent)}
  .brand h1{font-family:"Bricolage Grotesque";font-weight:800;font-size:15.5px;letter-spacing:-.01em;margin:0;line-height:1.2;color:var(--side-ink)}
  .brand .sub{font-size:10.5px;color:var(--side-muted);margin-top:2px}
  .navlist{display:flex;flex-direction:column;gap:2px}
  .navlist button{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 11px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--side-muted);border:0;background:transparent}
  .navlist button svg{width:16px;height:16px;flex:0 0 auto}
  .navlist button:hover{background:var(--side-hover);color:var(--side-ink)}
  .navlist button.on{background:var(--brand);color:#fff}
  .side-section{display:flex;flex-direction:column;gap:7px}
  .side-label{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:0 2px}
  .side select,.side input{width:100%;border:1px solid var(--side-line);background:rgba(255,255,255,.04);color:var(--side-ink);border-radius:9px;padding:7px 9px;font-size:12.5px}
  .side select:focus,.side input:focus{background:rgba(255,255,255,.08)}
  .side input::placeholder{color:var(--side-muted)}
  .side-actions{display:flex;flex-direction:column;gap:7px}
  .sbtn{border:1px solid var(--side-line);background:rgba(255,255,255,.04);color:var(--side-ink);border-radius:10px;padding:9px 11px;font-weight:700;font-size:13px;text-align:left;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .sbtn:hover{background:var(--side-hover)}
  .sbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .sbtn.primary:hover{filter:brightness(1.08)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--side-line)}
  .savestat{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--side-muted)}
  .savestat .dotok{width:7px;height:7px;border-radius:50%;background:var(--brand-2);flex:0 0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
  .savestat .dotwarn{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:0 0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
  .badge-ro{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#F0895F;background:rgba(240,137,95,.14);border-radius:99px;padding:4px 10px;width:max-content}

  .main{min-width:0;padding:26px 30px 90px}
  .mainhead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .mainhead h2{font-family:"Bricolage Grotesque";font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0;text-wrap:balance}
  .seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;box-shadow:var(--sh);flex-wrap:wrap}
  .seg button{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .seg button.on{background:var(--inverse);color:var(--inverse-text)}

  /* kpis */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,background .15s}
  .kpi .icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--accent-bg);color:var(--ink-soft)}
  .kpi .icon svg{width:17px;height:17px}
  .kpi .body{min-width:0}
  .kpi .l{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.35;min-height:28px;display:flex;align-items:flex-start}
  .kpi .v{font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;margin-top:4px;letter-spacing:-.01em;font-feature-settings:"tnum"}
  .kpi .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
  .kpi.k-andamento .icon{background:var(--noprazo-bg);color:var(--noprazo)}
  .kpi.k-concluido .icon{background:var(--concluido-bg);color:var(--concluido)}
  .kpi.k-atrasado .icon{background:var(--atrasado-bg);color:var(--atrasado)}
  .kpi.k-aguardando .icon{background:var(--aguardando-bg);color:var(--aguardando)}
  .kpi.k-total .icon{background:var(--brand-bg);color:var(--brand)}
  .kpi.k-alert{border-color:var(--atrasado);background:var(--atrasado-bg)}
  .kpi.k-alert .l{color:var(--atrasado)}
  .kpi.k-alert .icon{background:var(--surface);color:var(--atrasado)}
  @media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpis.secondary{margin-bottom:22px}
  .kpis.secondary .kpi .v{font-size:19px}

  /* ===== kanban board ===== */
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:280px;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
  .col{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
  .col[data-fase="Fechado"]{background:var(--concluido-bg)}
  .col[data-fase="Declinado"]{background:var(--cancelado-bg)}
  .col h3{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 10px;padding:0 2px}
  .col h3 .cnt{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--muted);font-weight:700}
  .colstack{display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding-right:2px}
  .colempty{color:var(--faint);font-size:12px;text-align:center;padding:16px 6px;border:1px dashed var(--line-strong);border-radius:10px}
  .mcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--card-accent,var(--line-strong));border-radius:10px;padding:10px 11px;box-shadow:var(--sh);cursor:pointer;animation:cardin .25s ease backwards}
  @keyframes cardin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .mcard:hover{border-color:var(--line-strong)}
  .mcard .jobnum{font-family:"JetBrains Mono",monospace;font-size:9px;font-weight:700;color:var(--faint);letter-spacing:.03em;margin-bottom:2px}
  .mcard .cliente{font-weight:800;font-size:13.5px;font-family:"Bricolage Grotesque";color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mcard .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .mcard .tag-sm{font-size:9.5px;font-weight:700;padding:1.5px 7px;border-radius:99px;background:var(--accent-bg);color:var(--ink-soft);white-space:nowrap}
  .mcard .tag-sm.warn{background:var(--warn-bg);color:var(--warn)}
  .mcard .situ-sm{font-size:9.5px;font-weight:700;padding:1.5px 7px;border-radius:99px;white-space:nowrap}
  .mcard .pbar{height:5px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:8px}
  .mcard .pbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
  .mcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:10.5px;color:var(--muted)}
  .mcard .foot .late{color:var(--atrasado);font-weight:700}
  .mcard .advance{border:0;background:var(--brand-bg);color:var(--brand);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto}
  .mcard .advance:hover{filter:brightness(.95)}
  .mcard .valorline{margin-top:6px;font-size:10.5px;color:var(--muted)}
  .mcard .valorline b{color:var(--ink)}
  .mcard .joblinks{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .mcard .joblink{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-bg);color:var(--ink-soft);text-decoration:none;white-space:nowrap}
  .mcard .joblink:hover{background:var(--line-strong)}
  .mcard .cardactions{display:flex;gap:5px;margin-top:8px;justify-content:flex-end;align-items:center}
  .mcard .cbtn{border:0;width:22px;height:22px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
  .mcard .cbtn.ok{background:var(--brand-bg);color:var(--brand)}
  .mcard .cbtn.no{background:var(--cancelado-bg);color:var(--cancelado)}
  .mcard .cbtn.warn{background:var(--warn-bg);color:var(--warn)}

  /* header: seletor de visão (praça / gestão) */
  .headerscope{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 12px;box-shadow:var(--sh)}
  .headerscope button{border:0;background:var(--accent-bg);color:var(--ink-soft);border-radius:99px;padding:4px 10px;font-weight:700;font-size:11px}
  .headerscope button:hover{background:var(--line-strong)}

  /* seletor de visão: tela inicial */
  .scopepick p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.5}
  .scopepick .save{margin-top:0}
  .scope-pracas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
  .scope-praca-btn{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);border-radius:11px;padding:11px;font-weight:700;font-size:13.5px}
  .scope-praca-btn:hover{background:var(--line)}

  /* linhas de veículo mini-lista dentro do card (só leitura: nome + valor orçado) */
  .linhaslist{margin-top:7px;display:flex;flex-direction:column;gap:3px;border-top:1px dashed var(--line-strong);padding-top:6px}
  .mcard .linhamini{display:flex;align-items:center;gap:5px;font-size:10px}
  .mcard .lm-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft);font-weight:600}
  .mcard .lm-val{font-size:9.5px;font-weight:700;color:var(--ink);white-space:nowrap;flex:0 0 auto}

  /* status pill */
  .status{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
  .status.noprazo{background:var(--noprazo-bg);color:var(--noprazo)}
  .status.aguardandocliente{background:var(--aguardando-bg);color:var(--aguardando)}
  .status.atrasado{background:var(--atrasado-bg);color:var(--atrasado)}
  .status.pausado{background:var(--pausado-bg);color:var(--pausado)}

  /* ===== breakdown / dashboard ===== */
  .dash-top{display:grid;grid-template-columns:280px 1fr;gap:14px;margin-bottom:14px}
  @media (max-width:900px){.dash-top{grid-template-columns:1fr}}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:820px){.dash-grid{grid-template-columns:1fr}}
  .breakdown{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
  .breakdown h3{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
  .brow{display:grid;grid-template-columns:minmax(90px,150px) 1fr 46px 88px;align-items:center;gap:10px;padding:8px 0;font-size:13px}
  .brow+.brow{border-top:1px solid var(--line)}
  .brow .name{font-weight:700;color:var(--ink);line-height:1.25}
  .brow .bar{height:9px;border-radius:99px;background:var(--track);overflow:hidden}
  .brow .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
  .brow .pct{font-weight:700;color:var(--ink-soft);text-align:right}
  .brow .val{color:var(--muted);text-align:right;white-space:nowrap}
  @media (max-width:640px){.brow{grid-template-columns:100px 1fr 40px}.brow .val{display:none}}

  .convrow{display:grid;grid-template-columns:minmax(90px,150px) 70px 70px 90px;align-items:center;gap:10px;padding:8px 0;font-size:13px}
  .convrow+.convrow{border-top:1px solid var(--line)}
  .convrow .name{font-weight:700;color:var(--ink)}
  .convrow .pct{font-weight:700;color:var(--ink-soft);text-align:center}
  .convrow .pct small{display:block;font-size:8.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
  .convrow .val{color:var(--muted);text-align:right;white-space:nowrap}
  @media (max-width:640px){.convrow{grid-template-columns:90px 1fr 1fr}.convrow .val{display:none}}

  .donutcard{display:flex;flex-direction:column;align-items:center;text-align:center}
  .donut{width:172px;height:172px;border-radius:50%;position:relative;flex:0 0 auto}
  .donut .hole{position:absolute;inset:24px;background:var(--surface);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .donut .hole b{font-family:"Bricolage Grotesque";font-size:26px;font-weight:800}
  .donut .hole span{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .donut-legend{display:flex;flex-direction:column;gap:6px;width:100%;margin-top:14px;text-align:left}
  .donut-legend .li{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .donut-legend .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .donut-legend .li b{margin-left:auto;font-weight:700;font-feature-settings:"tnum"}

  /* ===== objetivos estratégicos ===== */
  .obj-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
  @media (max-width:1100px){.obj-grid{grid-template-columns:repeat(2,1fr)}}
  .obj-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
  .obj-card .obj-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--brand)}
  .obj-card .obj-value{font-family:"Bricolage Grotesque";font-weight:800;font-size:26px;letter-spacing:-.01em}
  .obj-card .obj-desc{font-size:11.5px;color:var(--muted);line-height:1.4}

  /* ===== comparativo anual ===== */
  .yr-table{width:100%;border-collapse:collapse;font-size:13px}
  .yr-table th,.yr-table td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  .yr-table th:first-child,.yr-table td:first-child{text-align:left;font-weight:700;color:var(--ink)}
  .yr-table th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  .yr-table tr:last-child td{border-bottom:0}

  /* ===== dinheiro na mesa ===== */
  .moneyrow{display:grid;grid-template-columns:1fr 120px 90px 70px auto;align-items:center;gap:10px;padding:8px 0;font-size:12.5px}
  .moneyrow+.moneyrow{border-top:1px solid var(--line)}
  .moneyrow .nm{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .moneyrow .sub{color:var(--muted);font-size:11px}
  .moneyrow .val{text-align:right;color:var(--ink-soft);font-weight:700}
  .moneyrow .dbadge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;justify-self:end}
  .moneyrow .dbadge.warn{background:var(--warn-bg);color:var(--warn)}
  .moneyrow .dbadge.rec{background:var(--aguardando-bg);color:var(--aguardando)}
  .moneyrow .mbtn{border:0;background:var(--brand-bg);color:var(--brand);border-radius:8px;padding:5px 9px;font-weight:700;font-size:11px;white-space:nowrap}
  @media (max-width:700px){.moneyrow{grid-template-columns:1fr auto}.moneyrow .val,.moneyrow .sub{display:none}}

  /* ===== evolução mensal (mini gráfico de barras) ===== */
  .tschart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
  .tsbar{display:flex;flex-direction:column;align-items:center;flex:1;height:100%;justify-content:flex-end}
  .tsbar-col{width:100%;max-width:32px;height:96px;display:flex;align-items:flex-end;background:var(--track);border-radius:6px 6px 0 0;overflow:hidden}
  .tsbar-fill{width:100%;background:linear-gradient(180deg,var(--brand-2),var(--brand));border-radius:6px 6px 0 0;min-height:2px}
  .tsbar-val{font-size:10px;font-weight:700;color:var(--ink-soft);margin-top:5px;white-space:nowrap}
  .tsbar-label{font-size:9.5px;color:var(--muted);margin-top:2px;text-transform:uppercase}

  /* cadastros (settings) */
  .cfgsection+.cfgsection{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .cfgsection h4{margin:0;font-size:13px;font-weight:700;color:var(--ink-soft)}
  .chiplist{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .chip{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
  .chip button{border:0;background:var(--line);color:var(--ink-soft);width:18px;height:18px;border-radius:50%;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
  .chip button:hover{background:var(--cancelado-bg);color:var(--cancelado)}
  .addrow{display:flex;gap:8px;margin-top:9px}
  .addrow input{flex:1;border:1px solid var(--line-strong);border-radius:10px;padding:8px 11px;background:var(--surface-2)}
  .addrow button{border:0;background:var(--inverse);color:var(--inverse-text);border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;white-space:nowrap}

  .empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted)}

  /* modal */
  .backdrop{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;z-index:80}
  .backdrop.open{display:flex}
  .modal{background:var(--surface);border-radius:18px;max-width:560px;width:100%;box-shadow:var(--sh-pop);overflow:hidden}
  .modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal header h3{margin:0;font-family:"Bricolage Grotesque";font-size:18px;font-weight:800}
  .modal header .x{border:0;background:transparent;font-size:20px;color:var(--muted);line-height:1;padding:4px}
  .modal .form{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;max-height:78vh;overflow:auto}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:9px 11px;background:var(--surface-2)}
  .field textarea{resize:vertical;min-height:56px}
  .checkfield{display:flex;align-items:center}
  .checkfield label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;margin:0}
  .checkfield input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:480px){.row2{grid-template-columns:1fr}}
  .save{width:100%;border:0;background:var(--inverse);color:var(--inverse-text);border-radius:11px;padding:12px;font-weight:700;font-size:14.5px;margin-top:4px}
  .save:hover{background:var(--inverse-hover)}
  .delrow{display:flex;justify-content:center;margin-top:6px}
  .delrow button{border:0;background:transparent;color:var(--cancelado);font-weight:600;font-size:13px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);background:var(--inverse);color:var(--inverse-text);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--sh-pop);z-index:90;opacity:0;transition:.28s;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  input[type=file]{display:none}

  /* ===== linhas de veículo (dentro do modal do job) ===== */
  .linhas-section{border-top:1px dashed var(--line-strong);padding-top:10px;margin-top:2px}
  .linhas-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .linhas-head label{font-size:12px;font-weight:700;color:var(--ink-soft)}
  .linha-add-btn{border:0;background:var(--brand-bg);color:var(--brand);border-radius:8px;padding:6px 10px;font-weight:700;font-size:12px}
  .linha-add-btn:hover{filter:brightness(.97)}
  #linhasWrap{display:flex;flex-direction:column;gap:12px}
  .linharow{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
  .linharow-head{display:flex;align-items:center;justify-content:space-between}
  .linharow-n{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .linharow-del{border:0;background:transparent;color:var(--cancelado);font-weight:600;font-size:11.5px;padding:2px}
  .linharow .field{margin:0}

  /* ===== responsive: sidebar becomes top bar ===== */
  @media (max-width:920px){
    .shell{grid-template-columns:1fr}
    .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;gap:12px}
    .brand{flex:0 0 auto}
    .navlist{flex-direction:row;flex:0 0 auto}
    .side-section{flex-direction:row;flex-wrap:wrap;flex:1 1 260px}
    .side-section .side-label{display:none}
    .side-section select,.side-section input{width:auto;flex:1 1 120px}
    .side-actions{flex-direction:row;flex-wrap:wrap;flex:1 1 100%}
    .sbtn{padding:8px 10px}
    .side-foot{flex-direction:row;margin-top:0;border-top:0;padding-top:0;flex:0 0 auto}
    .main{padding:20px 16px 90px}
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="mark">J</div>
      <div>
        <h1>Jobs de Marketing</h1>
        <div class="sub">Acompanhamento por fase</div>
      </div>
    </div>

    <nav class="navlist" id="mainTabs" data-hide-executivo>
      <button data-v="jobs" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>Jobs</button>
      <button data-v="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M12 19V5M20 19v-7"/></svg>Dashboard</button>
    </nav>

    <div class="side-section" data-hide-executivo>
      <div class="side-label">Filtros</div>
      <select id="fPraca"><option value="todos">Todas as praças</option></select>
      <select id="fAnalista"><option value="todos">Todas as analistas</option></select>
      <select id="fExecutivo"><option value="todos">Todos os executivos</option></select>
      <select id="fVeiculo"><option value="todos">Todos os veículos</option></select>
      <input id="fBusca" placeholder="Buscar cliente...">
      <input id="fDe" type="date" title="Data de recebimento de">
      <input id="fAte" type="date" title="Data de recebimento até">
    </div>

    <div class="side-actions" data-hide-executivo>
      <button class="sbtn primary" data-act="new" data-writeonly>＋ Novo job</button>
      <button class="sbtn" data-act="settings" data-writeonly>⚙ Cadastros</button>
      <button class="sbtn" data-act="eplabs">📋 EP Labs</button>
      <button class="sbtn" data-act="export">⬇ Exportar</button>
      <label class="sbtn" data-writeonly>⬆ Importar<input type="file" id="fileImport" accept="application/json"></label>
    </div>

    <div class="side-foot">
      <span class="badge-ro" id="roBadge" style="display:none">🔒 Somente leitura</span>
      <span class="savestat" id="saveStat"></span>
    </div>
  </aside>

  <main class="main">
    <div class="mainhead">
      <h2 id="pageTitle">Jobs</h2>
      <span class="headerscope" id="scopeBadge"></span>
      <div class="seg" id="segStatus" data-hide-executivo>
        <button data-v="todos" class="on">Todos</button>
        <button data-v="andamento">Em andamento</button>
        <button data-v="concluido">Fechados</button>
        <button data-v="atrasado">Atrasados</button>
        <button data-v="aguardando">Aguardando cliente</button>
      </div>
    </div>

    <div class="kpis" id="kpis" data-hide-executivo></div>
    <div class="kpis secondary" id="kpisComercial" data-hide-executivo></div>

    <div id="viewJobs"><div id="board"></div></div>
    <div id="viewDashboard" style="display:none"><div id="dashboard"></div></div>
    <div id="viewExecutivo" style="display:none"></div>
  </main>
</div>

<div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div>
<div class="backdrop" id="scopeBackdrop"><div class="modal scopepick" id="scopeModal" style="max-width:420px"></div></div>

<script>
const KEY="jobs-marketing-v2";
let data={jobs:[],config:{}};
let filters={seg:"todos",praca:"todos",analista:"todos",executivo:"todos",veiculo:"todos",q:"",de:"",ate:""};
let editId=null;
let mainView="jobs";

const PRACAS=["CAM","RIB","SCA","VAR","CE"];
const ORIGENS=["Solicitação interna","Proativo"];
const PRIORIDADES=["Alta","Média","Baixa"];
const FASES=["Recebido","Em desenvolvimento","Entregue","Fechado","Declinado"];
const FASE_PCT={"Recebido":.15,"Em desenvolvimento":.5,"Entregue":.85,"Fechado":1,"Declinado":1};
const FASE_ORDEM=["Recebido","Em desenvolvimento","Entregue"];
const FASE_AVANCO_DATA={"Em desenvolvimento":null,"Entregue":"dataEntrega"};
const FASE_COLOR={"Recebido":"var(--noprazo)","Em desenvolvimento":"var(--brand)","Entregue":"var(--aguardando)","Fechado":"var(--concluido)","Declinado":"var(--cancelado)"};
const SITUACOES=["No prazo","Aguardando cliente","Atrasado","Pausado"];
const MOTIVO_SEM_RETORNO="Sem retorno (automático)";
const MOTIVOS=["Preço","Prazo / timing","Concorrência","Cliente desistiu",MOTIVO_SEM_RETORNO,"Outro"];
const VEICULOS_PADRAO=["Google Ads","Meta Ads","TV / Rádio / Mídia tradicional","Influenciadores / Outros digitais","LinkedIn Ads","TikTok Ads","Outro"];
const DIAS_LEMBRETE=7;
const DIAS_AUTO_DECLINIO=21;
function situClass(s){return "status "+(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");}

/* ============ visão por praça (convenção de navegação, não é segurança) ============ */
const SCOPE_KEY="jobs-viewer-scope-v1";
let viewerScope=null;
function loadScope(){
  try{ const v=localStorage.getItem(SCOPE_KEY); if(v)viewerScope=JSON.parse(v); }catch(e){}
}
function saveScope(s){
  viewerScope=s;
  try{ localStorage.setItem(SCOPE_KEY,JSON.stringify(s)); }catch(e){}
}
function scopePickerHtml(){
  return `<header><h3>Quem está vendo?</h3></header>
    <div class="form">
      <p>Isso só filtra o que aparece pra você neste navegador — não é uma trava de segurança, os dados continuam os mesmos para todo mundo.</p>
      <button class="save" data-act="scope-pick" data-scope-mode="todos">👁 Ver tudo (gestão)</button>
      <button class="save" style="background:var(--brand)" data-act="scope-pick" data-scope-mode="executivo">📝 Sou executivo (criar briefing)</button>
      <button class="save" style="background:var(--aguardando)" data-act="scope-pick" data-scope-mode="contas-especiais">⭐ Contas especiais</button>
      <div class="scope-pracas">${PRACAS.filter(p=>p!=="CE").map(p=>`<button class="scope-praca-btn" data-act="scope-pick" data-scope-mode="praca" data-scope-praca="${esc(p)}">Praça ${esc(p)}</button>`).join("")}</div>
    </div>`;
}
function openScopePicker(){
  document.getElementById("scopeModal").innerHTML=scopePickerHtml();
  document.getElementById("scopeBackdrop").classList.add("open");
}
function closeScopePicker(){document.getElementById("scopeBackdrop").classList.remove("open");}
function renderScopeBadge(){
  const el=document.getElementById("scopeBadge");if(!el)return;
  const label=viewerScope&&viewerScope.mode==="praca"?`Praça ${esc(viewerScope.praca)}`:viewerScope&&viewerScope.mode==="executivo"?"Executivo":viewerScope&&viewerScope.mode==="contas-especiais"?"Contas especiais":"Visão geral";
  el.innerHTML=`👤 ${label} <button data-act="scope-change">trocar</button>`;
}
let sampleApi=null;
async function initSample(){
  if(!window.claude||!window.claude.use)return;
  try{ sampleApi=await window.claude.use("sample"); }catch(e){ sampleApi=null; }
}

/* ============ visão do executivo: só cria o briefing ============ */
function executivoFormHtml(){
  return `<div style="max-width:640px">
    <h2 style="font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;margin:0 0 4px">Novo briefing</h2>
    <p style="color:var(--muted);font-size:13.5px;margin:0 0 18px">Preencha o briefing do job. Assim que enviar, ele aparece pronto pra um analista assumir.</p>
    <div class="field"><label>Cliente</label><input id="ex_cliente" placeholder="Nome do cliente"></div>
    <div class="row2">
      <div class="field"><label>Praça</label><select id="ex_praca">${pracaOptionsHtml("CAM")}</select></div>
      <div class="field"><label>Origem</label><select id="ex_origem">${optionsHtml(ORIGENS,ORIGENS[0])}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Prioridade</label><select id="ex_prioridade">${optionsHtml(PRIORIDADES,"Média")}</select></div>
      <div class="field"><label>Data do prazo</label><input id="ex_prazo" type="date"></div>
    </div>
    <div class="field"><label>Seu nome (executivo)</label><input id="ex_executivo" list="dl_executivos_exec" placeholder="Selecione ou digite um nome">${datalistHtml("dl_executivos_exec",data.config.executivos)}</div>
    <div class="field"><label>Briefing</label><textarea id="ex_briefing" style="min-height:160px" placeholder="Cole aqui o briefing completo: o que o cliente pediu, contexto, verba se souber, prazo, tudo que o analista precisa saber..."></textarea></div>
    <button class="save" data-act="exec-submit">Enviar briefing</button>
    <div id="execFeedback" style="margin-top:12px"></div>
  </div>`;
}
function submitExecutivoBriefing(){
  const cliente=document.getElementById("ex_cliente").value.trim();
  const briefing=document.getElementById("ex_briefing").value.trim();
  if(!cliente){toast("Informe o cliente.");return;}
  if(!briefing){toast("Cole o briefing.");return;}
  const executivo=document.getElementById("ex_executivo").value.trim();
  const j={
    id:uid(),
    numero:nextNumero(cliente),
    cliente,
    praca:document.getElementById("ex_praca").value,
    origem:document.getElementById("ex_origem").value,
    analista:"",
    executivo,
    prioridade:document.getElementById("ex_prioridade").value,
    situacao:"No prazo",
    faseAtual:"Recebido",
    prazoPrevisto:document.getElementById("ex_prazo").value,
    dataRecebimento:today(),
    dataEntrega:"",
    contaEspecial:false,
    briefing,
    checklist:[],
    proximosPassos:"",
    planoMidia:"",
    planilhas:[],
    linhas:[],
    ultimoContatoEm:Date.now(),
    valorFechado:0,
    motivoPerda:"",
    dataFechamento:"",
    recuperavel:false,
    declinioAutomatico:false,
    faseAntesFechamento:null,
    createdAt:Date.now(),
    updatedAt:Date.now()
  };
  if(executivo&&!data.config.executivos.includes(executivo))data.config.executivos.push(executivo);
  data.jobs.push(j);
  save();
  document.getElementById("execFeedback").innerHTML=`<div style="background:var(--brand-bg);color:var(--brand);padding:12px 14px;border-radius:10px;font-weight:700;font-size:13.5px">Briefing enviado ✓ Número do job: ${esc(j.numero)}. Um analista vai assumir a partir daqui.</div>`;
  document.getElementById("ex_cliente").value="";
  document.getElementById("ex_briefing").value="";
  document.getElementById("ex_prazo").value="";
  toast("Briefing enviado ✓");
}

/* ============ visão de contas especiais (poucos clientes, acompanhamento individual) ============ */
function renderBoardPorCliente(jobs){
  const el=document.getElementById("board");
  if(!jobs.length){el.innerHTML=`<div class="empty">Nenhum job de conta especial ainda.<br>Selecione a praça "CE (Contas Especiais)" num job pra ele aparecer aqui.</div>`;return;}
  const clientes=[...new Set(jobs.map(j=>j.cliente))].sort();
  el.innerHTML=clientes.map(cliente=>{
    const jobsCliente=jobs.filter(j=>j.cliente===cliente);
    return `<div style="margin-bottom:22px">
      <h3 style="font-family:'Bricolage Grotesque';font-weight:800;font-size:15px;margin:0 0 10px;color:var(--ink)">${esc(cliente)}</h3>
      <div class="board">${FASES.map(fase=>{
        const items=jobsCliente.filter(j=>j.faseAtual===fase);
        return `<div class="col" data-fase="${esc(fase)}">
          <h3>${esc(fase)}<span class="cnt">${items.length}</span></h3>
          <div class="colstack">${items.length?items.map(mcardHtml).join(""):`<div class="colempty">Vazio</div>`}</div>
        </div>`;
      }).join("")}</div>
    </div>`;
  }).join("");
}
function desempenhoPorClienteHtml(jobs){
  const clientes=[...new Set(jobs.map(j=>j.cliente))].sort();
  if(!clientes.length)return `<div class="breakdown"><h3>Desempenho por cliente</h3><div style="color:var(--muted);font-size:13px">Nenhum cliente ainda.</div></div>`;
  const rows=clientes.map(cliente=>{
    const jc=jobs.filter(j=>j.cliente===cliente);
    const fechados=jc.filter(j=>j.faseAtual==="Fechado");
    const decididos=jc.filter(j=>isTerminal(j.faseAtual));
    const valorOrcado=jc.flatMap(j=>j.linhas||[]).reduce((s,l)=>s+(Number(l.valorOrcado)||0),0);
    const valorFechado=fechados.reduce((s,j)=>s+(Number(j.valorFechado)||0),0);
    const conv=decididos.length?Math.round(fechados.length/decididos.length*100):0;
    return `<tr>
      <td>${esc(cliente)}</td>
      <td style="text-align:center">${jc.length}</td>
      <td style="text-align:center">${fechados.length}</td>
      <td style="text-align:right">${fmtMoney(valorOrcado)}</td>
      <td style="text-align:right">${fmtMoney(valorFechado)}</td>
      <td style="text-align:right">${fmtMoney(fechados.length?valorFechado/fechados.length:0)}</td>
      <td style="text-align:center">${conv}%</td>
    </tr>`;
  }).join("");
  return `<div class="breakdown">
    <h3>Desempenho por cliente</h3>
    <div style="overflow-x:auto"><table class="yr-table">
      <tr><th>Cliente</th><th>Jobs</th><th>Fechados</th><th>Orçado</th><th>Fechado</th><th>Ticket médio</th><th>Conversão</th></tr>
      ${rows}
    </table></div>
  </div>`;
}
function metaCEHtml(jobs){
  const curYear=new Date().getFullYear(),prevYear=curYear-1;
  const meta=Number(data.config.metaCEMensal)||0;
  const meses=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const valoresAno={[prevYear]:Array(12).fill(0),[curYear]:Array(12).fill(0)};
  jobs.forEach(j=>{
    if(j.faseAtual!=="Fechado"||!j.dataFechamento)return;
    const ano=Number(j.dataFechamento.slice(0,4)),mes=Number(j.dataFechamento.slice(5,7))-1;
    if(valoresAno[ano])valoresAno[ano][mes]+=Number(j.valorFechado)||0;
  });
  const rows=meses.map((m,i)=>{
    const v25=valoresAno[prevYear][i],v26=valoresAno[curYear][i];
    const deltaAno=v25>0?Math.round((v26-v25)/v25*100):(v26>0?100:0);
    const atingimento=meta>0?Math.round(v26/meta*100):null;
    return `<tr>
      <td>${m}</td>
      <td style="text-align:right">${fmtMoney(v26)}</td>
      <td style="text-align:right;color:${(v25||v26)?(deltaAno>=0?"var(--concluido)":"var(--cancelado)"):"var(--faint)"}">${(v25||v26)?(deltaAno>=0?"+":"")+deltaAno+"%":"—"}</td>
      <td style="text-align:right">${atingimento!=null?atingimento+"%":"—"}</td>
    </tr>`;
  }).join("");
  return `<div class="breakdown">
    <h3>Meta de Contas Especiais — mês a mês</h3>
    ${meta>0?`<p style="color:var(--muted);font-size:12px;margin:0 0 10px">Meta mensal: <b>${fmtMoney(meta)}</b> (ajustável em ⚙ Cadastros)</p>`:`<p style="color:var(--warn);font-size:12px;margin:0 0 10px">Nenhuma meta mensal definida ainda — configure em ⚙ Cadastros pra ver o % de atingimento.</p>`}
    <div style="overflow-x:auto"><table class="yr-table">
      <tr><th>Mês</th><th>${curYear}</th><th>vs ${prevYear}</th><th>Atingimento</th></tr>
      ${rows}
    </table></div>
  </div>`;
}
function clienteVeiculoHtml(jobs){
  const clientes=[...new Set(jobs.map(j=>j.cliente))].sort();
  const veiculos=[...new Set(jobs.flatMap(j=>(j.linhas||[]).map(l=>l.veiculo)).filter(Boolean))].sort();
  if(!clientes.length||!veiculos.length)return `<div class="breakdown"><h3>Cliente × veículo (fechado)</h3><div style="color:var(--muted);font-size:13px">Sem dados suficientes ainda.</div></div>`;
  const map={};
  jobs.forEach(j=>{
    if(j.faseAtual!=="Fechado")return;
    (j.linhas||[]).forEach(l=>{
      if(!l.veiculo)return;
      map[j.cliente]=map[j.cliente]||{};
      map[j.cliente][l.veiculo]=(map[j.cliente][l.veiculo]||0)+(Number(l.valorFechado)||0);
    });
  });
  const rows=clientes.map(c=>{
    const cells=veiculos.map(v=>`<td style="text-align:right">${(map[c]&&map[c][v])?fmtMoney(map[c][v]):"—"}</td>`).join("");
    return `<tr><td>${esc(c)}</td>${cells}</tr>`;
  }).join("");
  return `<div class="breakdown">
    <h3>Cliente × veículo (fechado)</h3>
    <div style="overflow-x:auto"><table class="yr-table"><tr><th>Cliente</th>${veiculos.map(v=>`<th>${esc(v)}</th>`).join("")}</tr>${rows}</table></div>
  </div>`;
}

  data.config.veiculos=(data.config.veiculos&&data.config.veiculos.length)?data.config.veiculos:VEICULOS_PADRAO.slice();
  data.config.metaCEMensal=Number(data.config.metaCEMensal)||0;
  data.jobs=data.jobs.map(migrateJob);
  data.jobs.forEach(j=>{

function migrateJob(j){
  if(!j.linhas){
    j.linhas=[{
      id:uid(),
      veiculo:j.veiculo||"",
      status:j.faseAtual==="Fechado"?"Fechado":j.faseAtual==="Declinado"?"Declinado":"Em aberto",
      valorOrcado:Number(j.valorOrcado)||0,
      valorFechado:Number(j.valorFechado)||0,
      dataFechamento:j.dataFechamento||"",
      motivoPerda:j.motivoPerda||"",
      updatedAt:j.updatedAt||Date.now()
    }];
    delete j.veiculo;delete j.valorOrcado;delete j.valorFechado;
  }
  // fases antigas (por linha) mapeadas para o quanto o desenvolvimento do job já avançou
  const oldDevRank={"Briefing":0,"Recebido":0,"Desenvolvimento":1,"Em desenvolvimento":1,"Validação Interna":2,"Entregue":2,"Aprovação Cliente":2,"Concluído":2,"Pausado":1,"Cancelado":2,"Fechado":2,"Declinado":2};
  let minRank=null;
  j.linhas.forEach(l=>{
    const r=oldDevRank[l.faseAtual];
    if(r!=null&&(minRank===null||r<minRank))minRank=r;
  });
  if(!j.dataEntrega){
    const datasEntrega=j.linhas.map(l=>l.dataEntrega).filter(Boolean).sort();
    if(datasEntrega.length)j.dataEntrega=datasEntrega[datasEntrega.length-1];
  }
  const devFaseAntes=["Recebido","Em desenvolvimento","Entregue"].includes(j.faseAtual)
    ?j.faseAtual
    :(minRank!=null?["Recebido","Em desenvolvimento","Entregue"][minRank]:"Recebido");
  // fechamento por linha (modelo antigo): vira uma decisão única do job — se qualquer linha
  // fechou, o job inteiro é considerado fechado (com a soma do que foi fechado); senão, se
  // alguma foi declinada, o job é declinado; sem nenhuma decisão, o job segue em desenvolvimento.
  const linhasComStatus=j.linhas.filter(l=>l.status!==undefined);
  if(linhasComStatus.length){
    const fechadas=linhasComStatus.filter(l=>l.status==="Fechado");
    const declinadas=linhasComStatus.filter(l=>l.status==="Declinado");
    if(fechadas.length){
      j.faseAtual="Fechado";
      j.dataFechamento=fechadas.map(l=>l.dataFechamento).filter(Boolean).sort().pop()||today();
    }else if(declinadas.length){
      j.faseAtual="Declinado";
      j.motivoPerda=declinadas[0].motivoPerda||"";
      j.dataFechamento=declinadas.map(l=>l.dataFechamento).filter(Boolean).sort().pop()||today();
      j.linhas.forEach(l=>{l.valorFechado=0;});
    }else{
      j.faseAtual=(j.faseAtual==="Concluído"||!j.faseAtual)?devFaseAntes:j.faseAtual;
    }
    j.recuperavel=!!linhasComStatus.some(l=>l.recuperavel);
    j.declinioAutomatico=!!linhasComStatus.some(l=>l.declinioAutomatico);
    const contatos=linhasComStatus.map(l=>l.ultimoContatoEm).filter(Boolean);
    j.ultimoContatoEm=contatos.length?Math.max(...contatos):(j.updatedAt||Date.now());
    j.faseAntesFechamento=devFaseAntes;
  }
  j.linhas=j.linhas.map(l=>({
    id:l.id||uid(),
    veiculo:l.veiculo||"",
    valorOrcado:Number(l.valorOrcado)||0,
    valorFechado:Number(l.valorFechado)||0
  }));
  if(!j.faseAtual||!FASES.includes(j.faseAtual)){
    j.faseAtual=j.faseAtual==="Concluído"?"Entregue":devFaseAntes;
  }
  // valor fechado do job é sempre a soma do valor fechado de cada veículo (data é a única coisa única do job)
  j.valorFechado=j.linhas.reduce((s,l)=>s+(Number(l.valorFechado)||0),0);
  j.motivoPerda=j.motivoPerda||"";
  j.dataFechamento=j.dataFechamento||"";
  j.recuperavel=!!j.recuperavel;
  j.declinioAutomatico=!!j.declinioAutomatico;
  j.ultimoContatoEm=j.ultimoContatoEm||j.updatedAt||Date.now();
  j.faseAntesFechamento=j.faseAntesFechamento||(FASE_ORDEM.includes(j.faseAtual)?j.faseAtual:"Entregue");
  delete j.dataConclusao;delete j.ultimoContato;
  if(j.origem==="EP Labs")j.origem="Solicitação interna";
  j.contaEspecial=!!j.contaEspecial;
  if(!j.numero)j.numero=nextNumero(j.cliente);
  j.briefing=j.briefing||"";
  j.checklist=(j.checklist||[]).map(c=>({id:c.id||uid(),texto:c.texto||"",feito:!!c.feito}));
  if(j.linkCanva!==undefined){ j.planoMidia=j.linkCanva; delete j.linkCanva; }
  j.planoMidia=j.planoMidia||"";
  if(!j.planilhas){
    j.planilhas=j.linkPlanilha?[{id:uid(),nome:"Planilha",url:j.linkPlanilha}]:[];
  }
  delete j.linkPlanilha;
  j.planilhas=j.planilhas.map(p=>({id:p.id||uid(),nome:p.nome||"",url:p.url||""}));
  return j;
}
function diasParadoJob(job){
  if(isTerminal(job.faseAtual))return null;
  return Math.floor((Date.now()-(job.ultimoContatoEm||Date.now()))/86400000);
}
function precisaLembreteJob(job){
  const d=diasParadoJob(job);
  return d!=null&&d>=DIAS_LEMBRETE;
}
function applyAgingRules(){
  let changed=false;
  data.jobs.forEach(job=>{
    if(!isTerminal(job.faseAtual)){
      const dias=diasParadoJob(job);
      if(dias!=null&&dias>=DIAS_AUTO_DECLINIO){
        job.faseAntesFechamento=job.faseAtual;
        job.faseAtual="Declinado";
        job.motivoPerda=MOTIVO_SEM_RETORNO;
        job.dataFechamento=today();
        job.recuperavel=true;
        job.declinioAutomatico=true;
        job.updatedAt=Date.now();
        changed=true;
      }
    }
  });
  return changed;
}
function marcarContatoJob(id){
  const job=data.jobs.find(x=>x.id===id);if(!job)return;
  job.ultimoContatoEm=Date.now();

function reabrirJob(id){
  const job=data.jobs.find(x=>x.id===id);if(!job)return;
  if(!isTerminal(job.faseAtual))return;
  job.faseAtual=job.faseAntesFechamento||"Entregue";

/* ============ helpers ============ */
function uid(){return "j"+Date.now()+Math.random().toString(36).slice(2,7);}
function d0(){const d=new Date();d.setHours(0,0,0,0);return d;}
function pd(s){if(!s)return null;const d=new Date(s+"T00:00:00");return isNaN(d)?null:d;}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(s){const d=pd(s);if(!d)return"—";return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});}
function fmtMoney(n){n=Number(n)||0;return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{t.classList.remove("show");setTimeout(()=>t.remove(),320);},2600);
}

/* ============ campos calculados ============ */
function isTerminal(fase){return fase==="Fechado"||fase==="Declinado";}
function pctConcl(job){return FASE_PCT[job.faseAtual]||0;}
function diasEmAberto(job){
  const start=pd(job.dataRecebimento);if(!start)return null;
  const end=(isTerminal(job.faseAtual)&&job.dataFechamento)?pd(job.dataFechamento):d0();
  if(!end)return null;
  return Math.round((end-start)/86400000);
}
function alertaPrazo(job){
  if(isTerminal(job.faseAtual))return "—";
  const prazo=pd(job.prazoPrevisto);if(!prazo)return "";
  const diff=Math.round((prazo-d0())/86400000);
  if(diff<0)return "Atrasado";
  if(diff<=5)return "Vence em breve";
  return "No prazo";
}
function inicialesCliente(cliente){
  const letras=(cliente||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z]/g,"").toUpperCase();
  return letras.slice(0,3)||"JOB";
}
function nextNumero(cliente){
  const ini=inicialesCliente(cliente);
  const seqCliente=data.jobs.filter(j=>inicialesCliente(j.cliente)===ini).length+1;
  const seqGlobal=data.jobs.length+1;
  return `${ini}_${String(seqCliente).padStart(3,"0")}_${String(seqGlobal).padStart(2,"0")}`;
}
function pairsFor(jobs){
  const out=[];
  jobs.forEach(job=>(job.linhas||[]).forEach(linha=>out.push({job,linha})));
  return out;
}

/* ============ filtro ============ */
function filtered(){
  return data.jobs.filter(job=>{
    if(viewerScope&&viewerScope.mode==="praca"&&job.praca!==viewerScope.praca)return false;
    if(viewerScope&&viewerScope.mode==="contas-especiais"&&job.praca!=="CE")return false;
    if(filters.seg==="andamento"&&!["Recebido","Em desenvolvimento","Entregue"].includes(job.faseAtual))return false;
    if(filters.seg==="concluido"&&job.faseAtual!=="Fechado")return false;
    if(filters.seg==="atrasado"&&alertaPrazo(job)!=="Atrasado")return false;
    if(filters.seg==="aguardando"&&job.situacao!=="Aguardando cliente")return false;
    if(filters.praca!=="todos"&&job.praca!==filters.praca)return false;
    if(filters.analista!=="todos"&&job.analista!==filters.analista)return false;
    if(filters.executivo!=="todos"&&job.executivo!==filters.executivo)return false;
    if(filters.veiculo!=="todos"&&!(job.linhas||[]).some(l=>l.veiculo===filters.veiculo))return false;
    if(filters.q&&!job.cliente.toLowerCase().includes(filters.q.toLowerCase()))return false;
    if(filters.de&&job.dataRecebimento&&job.dataRecebimento<filters.de)return false;
    if(filters.ate&&job.dataRecebimento&&job.dataRecebimento>filters.ate)return false;
    return true;
  }).sort((a,b)=>(b.dataRecebimento||"").localeCompare(a.dataRecebimento||""));
}

  document.querySelectorAll("[data-hide-executivo]").forEach(el=>{ el.style.display=isExec?"none":""; });

  fPracaEl.style.display=(viewerScope&&(viewerScope.mode==="praca"||isCE))?"none":"";

function renderKpis(jobs,pairs){
  const total=jobs.length;
  const andamento=jobs.filter(j=>["Recebido","Em desenvolvimento","Entregue"].includes(j.faseAtual)).length;
  const fechados=jobs.filter(j=>j.faseAtual==="Fechado").length;
  const atrasados=jobs.filter(j=>alertaPrazo(j)==="Atrasado").length;
  const aguardando=jobs.filter(j=>j.situacao==="Aguardando cliente").length;
  const kpi=(cls,icon,label,value)=>`<div class="kpi ${cls}"><div class="icon">${icon}</div><div class="body"><div class="l">${label}</div><div class="v">${value}</div></div></div>`;
  document.getElementById("kpis").innerHTML=
    kpi("k-total",KPI_ICONS.total,"Total de jobs",total)
    +kpi("k-andamento",KPI_ICONS.andamento,"Em andamento",andamento)
    +kpi("k-concluido",KPI_ICONS.concluido,"Fechados",fechados)
    +kpi("k-atrasado"+(atrasados>0?" k-alert":""),KPI_ICONS.atrasado,"Atrasados",atrasados)
    +kpi("k-aguardando",KPI_ICONS.aguardando,"Aguardando cliente",aguardando);
  const valorOrcado=pairs.reduce((s,p)=>s+(Number(p.linha.valorOrcado)||0),0);
  const valorFechado=jobs.reduce((s,j)=>s+(j.faseAtual==="Fechado"?Number(j.valorFechado)||0:0),0);
  const decididas=jobs.filter(j=>isTerminal(j.faseAtual)).length;
  const fechadas=fechados;
  const pctValor=valorOrcado>0?Math.round(valorFechado/valorOrcado*100):0;
  const pctQtd=decididas>0?Math.round(fechadas/decididas*100):0;
  const kpi2=(label,value)=>`<div class="kpi"><div class="body"><div class="l">${label}</div><div class="v">${value}</div></div></div>`;
  document.getElementById("kpisComercial").innerHTML=
    kpi2("Valor orçado",fmtMoney(valorOrcado))
    +kpi2("Valor fechado",fmtMoney(valorFechado))
    +kpi2("% fechado (por valor ofertado)",`${pctValor}<small>%</small>`)
    +kpi2("% fechado (por qtd. de jobs)",`${pctQtd}<small>%</small>`)
    +kpi2("Ticket médio fechado",fmtMoney(fechadas>0?valorFechado/fechadas:0));
}

function countBreakdownHtml(title,order,list,keyFn,colorFn){
  const counts={};order.forEach(k=>counts[k]=0);
  list.forEach(j=>{const k=keyFn(j);if(k!=null)counts[k]=(counts[k]||0)+1;});
  const max=Math.max(1,...Object.values(counts));
  const rows=order.map(k=>{
    const c=counts[k]||0;const pct=Math.round(c/max*100);
    const barStyle=colorFn?`background:${colorFn(k)}`:"";
    return `<div class="brow"><div class="name">${esc(k)}</div><div class="bar"><i style="width:${pct}%;${barStyle}"></i></div><div class="pct">${c}</div></div>`;
  }).join("");
  return `<div class="breakdown"><h3>${title}</h3>${rows}</div>`;
}
function groupValorPorJob(jobs,keyFn){
  const map={};

    const k=keyFn(job)||"Não informado";
    map[k]=map[k]||{concluido:0,decidido:0,valor:0,valorOrcado:0};
    map[k].valorOrcado+=(job.linhas||[]).reduce((s,l)=>s+(Number(l.valorOrcado)||0),0);

    if(job.faseAtual==="Fechado"){map[k].concluido++;map[k].valor+=Number(job.valorFechado)||0;}
  });
  return map;
}

function last6Months(){
  const out=[];
  const now=new Date();
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    const label=d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","");
    out.push({key,label});
  }
  return out;
}

  return String(new Date().getFullYear());

  const curYear=new Date().getFullYear();
  const years=new Set([String(curYear-1),String(curYear)]);

  const byYear={};
  yearsSorted.forEach(y=>byYear[y]={jobs:0,valorOrcado:0,valorFechado:0,decididas:0,fechadas:0,epLabs:0});
  jobs.forEach(j=>{
    const y=yearOf(j);
    byYear[y].jobs++;
    if(isTerminal(j.faseAtual))byYear[y].decididas++;

    if(byYear[y])byYear[y].epLabs++;
  });
  const metricRow=(label,fn)=>`<tr><td>${label}</td>${yearsSorted.map(y=>`<td>${fn(byYear[y])}</td>`).join("")}</tr>`;

function segmentacaoMensalHtml(jobs){
  const clientes=[...new Set(jobs.filter(j=>j.contaEspecial&&j.praca==="VAR").map(j=>j.cliente))].sort();
  const curYear=new Date().getFullYear(),prevYear=curYear-1;
  if(!clientes.length)return `<div class="breakdown"><h3>Segmentação — varejo mês a mês (${curYear} vs ${prevYear})</h3><div style="color:var(--muted);font-size:13px">Nenhuma conta especial de varejo ainda.</div></div>`;
  const meses=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const valores={};
  clientes.forEach(c=>{valores[c]={[prevYear]:Array(12).fill(0),[curYear]:Array(12).fill(0)};});
  jobs.forEach(j=>{
    if(!j.contaEspecial||j.praca!=="VAR"||j.faseAtual!=="Fechado"||!j.dataFechamento)return;
    const ano=Number(j.dataFechamento.slice(0,4)),mes=Number(j.dataFechamento.slice(5,7))-1;
    if(valores[j.cliente]&&valores[j.cliente][ano])valores[j.cliente][ano][mes]+=Number(j.valorFechado)||0;
  });
  const rows=clientes.map(c=>{
    const cells=meses.map((m,i)=>{
      const v25=valores[c][prevYear][i],v26=valores[c][curYear][i];
      const delta=v25>0?Math.round((v26-v25)/v25*100):(v26>0?100:0);
      const cor=v26===0&&v25===0?"var(--faint)":(delta>=0?"var(--concluido)":"var(--cancelado)");
      return `<td style="text-align:center;padding:6px 4px"><div style="font-size:10px;font-weight:700">${v26?fmtMoney(v26):"—"}</div>${(v25||v26)?`<div style="font-size:9px;color:${cor}">${delta>=0?"+":""}${delta}%</div>`:""}</td>`;
    }).join("");
    return `<tr><td style="white-space:nowrap">${esc(c)}</td>${cells}</tr>`;
  }).join("");
  return `<div class="breakdown">
    <h3>Segmentação — varejo mês a mês (${curYear} vs ${prevYear})</h3>
    <p style="color:var(--muted);font-size:12px;margin:0 0 10px">Cada célula mostra o valor fechado em ${curYear} e a variação vs o mesmo mês de ${prevYear}.</p>
    <div style="overflow-x:auto"><table class="yr-table"><tr><th>Cliente</th>${meses.map(m=>`<th>${m}</th>`).join("")}</tr>${rows}</table></div>
  </div>`;
}
function funilHtml(jobs){
  const labels=["Recebido","Em desenvolvimento","Entregue","Fechado"];
  const rankMap={"Recebido":0,"Em desenvolvimento":1,"Entregue":2};
  const reached=[0,0,0,0];
  jobs.forEach(j=>{
    const devRank=isTerminal(j.faseAtual)?(rankMap[j.faseAntesFechamento]??2):(rankMap[j.faseAtual]??0);
    for(let i=0;i<=devRank;i++)reached[i]++;
    if(j.faseAtual==="Fechado")reached[3]++;
  });
  const max=reached[0]||1;
  const bars=labels.map((l,i)=>{
    const pct=Math.max(16,Math.round(reached[i]/max*100));
    return `<div style="width:${pct}%;margin:0 auto;background:${FASE_COLOR[l]};color:#fff;border-radius:6px;padding:10px 8px;text-align:center;font-size:12px;font-weight:700">${esc(l)}<div style="font-size:16px;font-family:'Bricolage Grotesque'">${reached[i]}</div></div>`;
  }).join(`<div style="height:4px"></div>`);
  const declinados=jobs.filter(j=>j.faseAtual==="Declinado").length;
  return `<div class="breakdown">
    <h3>Funil por fase</h3>
    <div style="display:flex;flex-direction:column;gap:0;padding:6px 0">${bars}</div>
    ${declinados?`<div style="text-align:center;margin-top:10px;font-size:12px;color:var(--cancelado)">✕ ${declinados} declinado(s) fora do funil</div>`:""}
  </div>`;
}
function renderDashboard(jobs,pairs){
  if(!jobs.length){document.getElementById("dashboard").innerHTML=`<div class="empty">Sem jobs para exibir com esses filtros ainda.</div>`;return;}
  const isCE=viewerScope&&viewerScope.mode==="contas-especiais";
  const html=
    objetivosHtml(jobs,pairs)
    + (isCE?desempenhoPorClienteHtml(jobs)+metaCEHtml(jobs)+clienteVeiculoHtml(jobs):"")
    + dinheiroMesaHtml(jobs)
    + riscoHtml()
    + evolucaoHtml(jobs,pairs)
    + resumoSemanalHtml()
    + segmentacaoMensalHtml(jobs)
    + comparativoAnualHtml(jobs,pairs)
    + `<div class="dash-top">`
    + donutHtml(jobs)
    + funilHtml(jobs)
    + `</div>`
    +`<div class="dash-grid">`
    + countBreakdownHtml("Jobs por praça",PRACAS,jobs,j=>j.praca)
    + countBreakdownHtml("Jobs por origem",ORIGENS,jobs,j=>j.origem)
    + countBreakdownHtml("Jobs por prioridade",PRIORIDADES,jobs,j=>j.prioridade)
    + valorBreakdownHtml("Valor fechado por veículo",valorPorVeiculoMap(jobs),"share")
    + conversaoDuplaHtml("Conversão e valor por analista",groupValorPorJob(jobs,j=>j.analista))
    + conversaoDuplaHtml("Conversão e valor por executivo de conta",groupValorPorJob(jobs,j=>j.executivo))
    + `</div>`;
  document.getElementById("dashboard").innerHTML=html;
}

function saveJobForm(){
  const cliente=document.getElementById("f_cliente").value.trim();
  if(!cliente){toast("Informe o cliente.");return;}
  const rows=[...document.querySelectorAll("#linhasWrap .linharow")];
  if(!rows.length){toast("Adicione pelo menos um veículo.");return;}
  const linhas=rows.map(row=>{
    const fEl=row.querySelector(".li-valorFechado");
    return {
      id:row.dataset.linhaId,
      veiculo:row.querySelector(".li-veiculo").value,
      valorOrcado:Number(row.querySelector(".li-valorOrcado").value)||0,
      valorFechado:fEl?Number(fEl.value)||0:0
    };
  });
  const planilhas=[...document.querySelectorAll("#planilhasWrap .linharow")].map(row=>({
    id:row.dataset.planilhaId,
    nome:row.querySelector(".pl-nome").value.trim(),
    url:row.querySelector(".pl-url").value.trim()
  })).filter(p=>p.url);
  const checklist=[...document.querySelectorAll("#checklistWrap [data-checklist-id]")].map(row=>({
    id:row.dataset.checklistId,
    texto:row.querySelector("span").textContent,
    feito:row.querySelector(".cl-feito").checked
  }));
  const analista=document.getElementById("f_analista").value.trim();
  const executivo=document.getElementById("f_executivo").value.trim();
  const existing=editId?data.jobs.find(x=>x.id===editId):null;
  const j={
    id:editId||uid(),
    numero:existing?existing.numero:nextNumero(cliente),
    cliente,
    praca:document.getElementById("f_praca").value,
    origem:document.getElementById("f_origem").value,
    analista,
    executivo,
    prioridade:document.getElementById("f_prioridade").value,
    situacao:document.getElementById("f_situacao").value,
    faseAtual:existing?existing.faseAtual:"Recebido",
    prazoPrevisto:document.getElementById("f_prazo").value,
    dataRecebimento:document.getElementById("f_recebimento").value||today(),
    dataEntrega:document.getElementById("f_entrega").value,
    contaEspecial:document.getElementById("f_contaEspecial").checked,
    briefing:document.getElementById("f_briefing").value.trim(),
    checklist,
    proximosPassos:document.getElementById("f_proximos").value.trim(),
    planoMidia:document.getElementById("f_planoMidia").value.trim(),
    planilhas,
    linhas,
    ultimoContatoEm:existing?existing.ultimoContatoEm:Date.now(),
    valorFechado:existing?existing.valorFechado:0,
    motivoPerda:existing?existing.motivoPerda:"",
    dataFechamento:existing?existing.dataFechamento:"",
    recuperavel:existing?existing.recuperavel:false,
    declinioAutomatico:existing?existing.declinioAutomatico:false,
    faseAntesFechamento:existing?existing.faseAntesFechamento:null,
    updatedAt:Date.now()
  };
  if(j.faseAtual==="Fechado")j.valorFechado=linhas.reduce((s,l)=>s+(Number(l.valorFechado)||0),0);
  const fMotivo=document.getElementById("f_motivoPerda");
  if(fMotivo)j.motivoPerda=fMotivo.value;
  const fDataFechamento=document.getElementById("f_dataFechamento");
  if(fDataFechamento)j.dataFechamento=fDataFechamento.value;
  if(analista&&!data.config.analistas.includes(analista))data.config.analistas.push(analista);
  if(executivo&&!data.config.executivos.includes(executivo))data.config.executivos.push(executivo);
  const idx=data.jobs.findIndex(x=>x.id===j.id);
  if(idx>=0)data.jobs[idx]=Object.assign({},data.jobs[idx],j);
  else{j.createdAt=Date.now();data.jobs.push(j);}
  save();closeModal();render();
  toast("Job salvo ✓");
}
function avancarJob(id){
  const job=data.jobs.find(x=>x.id===id);if(!job)return;
  if(isTerminal(job.faseAtual))return;
  const idx=FASE_ORDEM.indexOf(job.faseAtual);if(idx<0||idx>=FASE_ORDEM.length-1)return;
  const proxima=FASE_ORDEM[idx+1];
  const campoData=FASE_AVANCO_DATA[proxima];
  if(campoData)job[campoData]=today();
  job.faseAtual=proxima;
  job.updatedAt=Date.now();
  save();render();
  toast(`Avançou para ${proxima} ✓`);
}
function fecharJob(id){
  const job=data.jobs.find(x=>x.id===id);if(!job)return;
  if(isTerminal(job.faseAtual))return;
  job.faseAntesFechamento=job.faseAtual;
  job.faseAtual="Fechado";
  job.dataFechamento=today();
  (job.linhas||[]).forEach(l=>{ if(!l.valorFechado)l.valorFechado=l.valorOrcado; });
  job.valorFechado=(job.linhas||[]).reduce((s,l)=>s+(Number(l.valorFechado)||0),0);
  job.recuperavel=false;job.declinioAutomatico=false;
  job.updatedAt=Date.now();
  save();render();
  toast("Job fechado ✓");
}
function declinarJob(id){
  const job=data.jobs.find(x=>x.id===id);if(!job)return;
  if(isTerminal(job.faseAtual))return;
  job.faseAntesFechamento=job.faseAtual;
  job.faseAtual="Declinado";
  job.dataFechamento=today();
  job.recuperavel=false;job.declinioAutomatico=false;
  job.updatedAt=Date.now();
  save();render();
  toast("Job declinado");
}

        <h4>Meta mensal de Contas Especiais (CE)</h4>
        <p style="margin:6px 0 0;color:var(--muted);font-size:12.5px">Usada pra calcular o % de atingimento no Dashboard da visão de Contas especiais.</p>
        <div class="addrow"><input id="cfg_metaCE" type="number" step="0.01" min="0" value="${data.config.metaCEMensal||""}" placeholder="Ex: 50000"><button data-act="cfg-meta-ce">Salvar</button></div>
      </div>
    </div>`;
}
function openSettings(){openModal(settingsHtml());}

/* ============ EP Labs (registro separado, alimenta a meta 1) ============ */
function epLabsListHtml(){
  const rows=[...(data.epLabs||[])].sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  if(!rows.length)return `<div style="color:var(--muted);font-size:12.5px;padding:8px 0">Nenhum EP Labs registrado ainda.</div>`;
  return rows.map(e=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px">
    <span><b>${fmtDate(e.data)}</b> ${esc(e.horario||"")} · ${esc(e.local||"—")}${e.gerouProposta?' · <span style="color:var(--brand);font-weight:700">gerou proposta</span>':''}</span>
    <button type="button" class="linharow-del" data-act="eplabs-del" data-id="${e.id}">✕</button>
  </div>`).join("");
}
function epLabsModalHtml(){
  return `<header><h3>EP Labs realizados</h3><button class="x" data-act="close">×</button></header>
    <div class="form">
      <p style="margin:0 0 4px;color:var(--muted);font-size:13px">Cada registro aqui conta automaticamente pra meta "EP Labs realizados" no Dashboard.</p>
      <div class="row2">
        <div class="field"><label>Data</label><input id="ep_data" type="date" value="${today()}"></div>
        <div class="field"><label>Horário</label><input id="ep_horario" type="time"></div>
      </div>
      <div class="field"><label>Local</label><input id="ep_local" placeholder="Ex: Sede do cliente, showroom, online..."></div>
      <div class="field checkfield"><label><input type="checkbox" id="ep_gerouProposta"> Gerou proposta</label></div>
      <button class="save" data-act="eplabs-add" data-writeonly>+ Registrar EP Labs</button>
      <div class="cfgsection" style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line)">
        <h4>Histórico</h4>
        <div id="epLabsListWrap" style="margin-top:9px">${epLabsListHtml()}</div>
      </div>
    </div>`;
}
function openEpLabs(){openModal(epLabsModalHtml());}
function addEpLabs(){
  const dataInput=document.getElementById("ep_data").value||today();
  const horario=document.getElementById("ep_horario").value;
  const local=document.getElementById("ep_local").value.trim();
  data.epLabs.push({id:uid(),data:dataInput,horario,local,gerouProposta:document.getElementById("ep_gerouProposta").checked,createdAt:Date.now()});
  save();openModal(epLabsModalHtml());render();
  toast("EP Labs registrado ✓");
}
function delEpLabs(id){
  data.epLabs=data.epLabs.filter(e=>e.id!==id);
  save();openModal(epLabsModalHtml());render();
}

/* ============ exportar / importar ============ */
let pendingImport=null;
function exportData(){
  try{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="jobs-marketing-"+today()+".json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast("Backup baixado ✓");
  }catch(e){toast("Não consegui gerar o arquivo.");}
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    let obj;
    try{obj=JSON.parse(r.result);}catch(e){toast("Arquivo inválido.");return;}
    if(!obj||!Array.isArray(obj.jobs)){toast("Não parece um backup de Jobs.");return;}
    pendingImport=obj.jobs;
    openModal(`<header><h3>Importar backup</h3><button class="x" data-act="close">×</button></header>
      <div class="form"><p style="color:var(--ink-soft);font-size:14.5px;line-height:1.55;margin:8px 0 0">O arquivo contém <b>${pendingImport.length} job(s)</b>.</p>
      <button class="save" data-act="do-import-merge">Somar ao que já existe</button>
      <button class="save" data-act="do-import-replace" style="background:var(--cancelado);margin-top:9px">Substituir tudo</button>
      <div class="delrow"><button data-act="close">Cancelar</button></div></div>`);
  };
  r.readAsText(file);
}
function doImport(mode){
  if(!pendingImport)return;
  const migrated=pendingImport.map(migrateJob);
  if(mode==="replace")data.jobs=migrated;
  else{
    const ids=new Set(data.jobs.map(j=>j.id));
    migrated.forEach(j=>{if(!j.id||ids.has(j.id))j.id=uid();data.jobs.push(j);});
  }
  pendingImport=null;save();closeModal();render();
  toast(mode==="replace"?"Dados substituídos ✓":"Dados somados ✓");
}

/* ============ eventos ============ */
document.getElementById("mainTabs").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#mainTabs button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");mainView=b.dataset.v;render();
});
document.getElementById("segStatus").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#segStatus button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");filters.seg=b.dataset.v;render();
});
document.getElementById("fPraca").addEventListener("change",e=>{filters.praca=e.target.value;render();});
document.getElementById("fAnalista").addEventListener("change",e=>{filters.analista=e.target.value;render();});
document.getElementById("fExecutivo").addEventListener("change",e=>{filters.executivo=e.target.value;render();});
document.getElementById("fVeiculo").addEventListener("change",e=>{filters.veiculo=e.target.value;render();});
document.getElementById("fBusca").addEventListener("input",e=>{filters.q=e.target.value;render();});
document.getElementById("fDe").addEventListener("change",e=>{filters.de=e.target.value;render();});
document.getElementById("fAte").addEventListener("change",e=>{filters.ate=e.target.value;render();});
document.getElementById("fileImport").addEventListener("change",e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value="";});
document.body.addEventListener("change",e=>{
  if(e.target.classList.contains("cl-feito")){
    const span=e.target.closest("label").querySelector("span");
    span.style.textDecoration=e.target.checked?"line-through":"";
    span.style.color=e.target.checked?"var(--muted)":"";
  }
});
document.body.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches("[data-cfg-input]")){
    e.preventDefault();
    document.querySelector(`button[data-act="cfg-add"][data-key="${e.target.dataset.cfgInput}"]`).click();
  }
  if(e.key==="Escape")closeModal();
});

document.body.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;
  if(act==="new")openNewJobModal();
  else if(act==="edit")openEditJobModal(id);
  else if(act==="avancar")avancarJob(id);
  else if(act==="job-fechar")fecharJob(id);
  else if(act==="job-declinar")declinarJob(id);
  else if(act==="job-contato")marcarContatoJob(id);
  else if(act==="job-reabrir")reabrirJob(id);
  else if(act==="save-job")saveJobForm();
  else if(act==="linha-add"){
    const wrap=document.getElementById("linhasWrap");
    const job=editId?data.jobs.find(x=>x.id===editId):null;
    const div=document.createElement("div");
    div.innerHTML=linhaRowHtml(null,wrap.children.length,job&&job.faseAtual==="Fechado");
    wrap.appendChild(div.firstElementChild);
  }
  else if(act==="linha-del"){
    b.closest(".linharow").remove();
  }
  else if(act==="planilha-add"){
    const wrap=document.getElementById("planilhasWrap");
    const div=document.createElement("div");
    div.innerHTML=planilhaRowHtml(null,wrap.children.length);
    wrap.appendChild(div.firstElementChild);
  }
  else if(act==="planilha-del"){
    b.closest(".linharow").remove();
  }
  else if(act==="checklist-add"){
    const input=document.getElementById("checklistNovoInput");
    const v=input.value.trim();if(!v)return;
    const wrap=document.getElementById("checklistWrap");
    if(wrap.children.length===1&&wrap.children[0].tagName==="DIV"&&!wrap.children[0].dataset.checklistId)wrap.innerHTML="";
    const div=document.createElement("div");
    div.innerHTML=checklistItemHtml({id:uid(),texto:v,feito:false});
    wrap.appendChild(div.firstElementChild);
    input.value="";
  }
  else if(act==="checklist-del"){
    b.closest("[data-checklist-id]").remove();
  }
  else if(act==="ai-checklist")gerarChecklistIA();
  else if(act==="ai-sugerir-veiculos")sugerirVeiculosIA();
  else if(act==="ai-add-veiculo"){
    const v=b.dataset.veiculo;
    if(v&&!data.config.veiculos.includes(v))data.config.veiculos.push(v);
    const wrap=document.getElementById("linhasWrap");
    const job=editId?data.jobs.find(x=>x.id===editId):null;
    const div=document.createElement("div");
    div.innerHTML=linhaRowHtml({id:uid(),veiculo:v,valorOrcado:0},wrap.children.length,job&&job.faseAtual==="Fechado");
    wrap.appendChild(div.firstElementChild);
    b.remove();
  }
  else if(act==="ai-risco")analisarRiscosIA();
  else if(act==="ai-resumo")gerarResumoIA();
  else if(act==="copiar-resumo"){
    const el=document.getElementById("resumoTexto");
    if(el)navigator.clipboard.writeText(el.value).then(()=>toast("Copiado ✓")).catch(()=>toast("Não consegui copiar."));
  }
  else if(act==="exec-submit")submitExecutivoBriefing();
  else if(act==="scope-pick"){
    const mode=b.dataset.scopeMode;
    saveScope(mode==="praca"?{mode:"praca",praca:b.dataset.scopePraca}:{mode});
    closeScopePicker();render();
  }
  else if(act==="scope-change")openScopePicker();
  else if(act==="del"){
    if(confirm("Excluir este job? Essa ação não pode ser desfeita.")){
      data.jobs=data.jobs.filter(j=>j.id!==id);
      save();closeModal();render();toast("Job excluído");
    }
  }
  else if(act==="export")exportData();
  else if(act==="do-import-merge")doImport("merge");
  else if(act==="do-import-replace")doImport("replace");
  else if(act==="settings")openSettings();
  else if(act==="eplabs")openEpLabs();
  else if(act==="eplabs-add")addEpLabs();
  else if(act==="eplabs-del")delEpLabs(id);
  else if(act==="cfg-add"){
    const key=b.dataset.key;
    const input=document.querySelector(`[data-cfg-input="${key}"]`);
    const v=input.value.trim();
    if(!v)return;
    data.config[key]=data.config[key]||[];
    if(!data.config[key].includes(v))data.config[key].push(v);
    save();openModal(settingsHtml());render();
  }
  else if(act==="cfg-meta-ce"){
    data.config.metaCEMensal=Number(document.getElementById("cfg_metaCE").value)||0;
    save();openModal(settingsHtml());render();
    toast("Meta salva ✓");
  }
  else if(act==="cfg-del"){
    data.config[b.dataset.key]=(data.config[b.dataset.key]||[]).filter(n=>n!==b.dataset.name);
    save();openModal(settingsHtml());render();
  }
  else if(act==="close")closeModal();
});
document.getElementById("backdrop").addEventListener("click",e=>{if(e.target.id==="backdrop")closeModal();});

/* ============ boot ============ */
(async function(){loadScope();await load();render();setSaveStat(window.storage?"ok":(window.localStorage?"local":"none"));if(!viewerScope)openScopePicker();await initSample();render();})();
</script>
</body>
