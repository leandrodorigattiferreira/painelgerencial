<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plano de Mídia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --surface-2:#F6F7FA; --ink:#1B1D26; --ink-soft:#424457; --muted:#7A7D93; --faint:#AEB0C2;
  --grid:#DCDEE7; --grid-strong:#C7C9DA;
  --brand:#3F6BF0; --brand-bg:#E8EEFE; --brand-soft:#EDF2FE;
  --off:#B96A22; --off-bg:#FBF0E6;
  --dig:#0E8C7F; --dig-bg:#E4F2EF;
  --topo:#5759D1; --meio:#0E8C7F; --fundo:#B0496B; --ret:#B9820C;
  --danger:#D33B3B; --danger-bg:#FCEBEB;
  --head-bg:#F3F4F8;
  --sh:0 1px 2px rgba(20,22,35,.04), 0 4px 14px rgba(20,22,35,.05);
  --sh-pop:0 16px 50px rgba(20,22,35,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161E; --surface:#1C1D28; --surface-2:#22232F; --ink:#ECEDF4; --ink-soft:#C3C5D6; --muted:#8B8DA3; --faint:#5A5C74;
    --grid:#33344A; --grid-strong:#42435C;
    --brand:#7C9AFF; --brand-bg:#232A4A; --brand-soft:#1E2440;
    --off:#E0995C; --off-bg:#382B1B; --dig:#4FC2AE; --dig-bg:#1A332F;
    --danger:#F0666B; --danger-bg:#3A2029;
    --head-bg:#20212D;
    --sh:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.4);
    --sh-pop:0 16px 50px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#15161E; --surface:#1C1D28; --surface-2:#22232F; --ink:#ECEDF4; --ink-soft:#C3C5D6; --muted:#8B8DA3; --faint:#5A5C74;
  --grid:#33344A; --grid-strong:#42435C;
  --brand:#7C9AFF; --brand-bg:#232A4A; --brand-soft:#1E2440;
  --off:#E0995C; --off-bg:#382B1B; --dig:#4FC2AE; --dig-bg:#1A332F;
  --danger:#F0666B; --danger-bg:#3A2029;
  --head-bg:#20212D;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.4);
  --sh-pop:0 16px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;font-size:13.5px;line-height:1.4;-webkit-font-smoothing:antialiased}
.disp{font-family:"Manrope",system-ui,sans-serif}
.mono,.num,input[type=number],input[type=date]{font-family:"JetBrains Mono",monospace;font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--grid-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

/* ===== shell ===== */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--grid);flex:0 0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.brand .mark{width:22px;height:22px;flex:0 0 auto}
.brand b{font-family:"Manrope";font-weight:800;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap}
.planname{font-family:"Manrope";font-weight:700;font-size:14.5px;border:1px solid transparent;border-radius:7px;padding:4px 8px;background:transparent;min-width:80px;max-width:280px}
.planname:hover{border-color:var(--grid-strong)}
.planname:focus{border-color:var(--brand);background:var(--surface-2)}
.savestat{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.savestat .dot{width:6px;height:6px;border-radius:50%;background:var(--dig)}
.spacer{flex:1}
.tbtn{border:1px solid var(--grid-strong);background:var(--surface);border-radius:8px;padding:6px 11px;font-weight:600;font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn:hover{background:var(--surface-2)}
.tbtn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.tbtn.pri:hover{filter:brightness(1.08)}
.tbtn.danger{color:var(--danger);border-color:var(--danger-bg)}
.tbtn.danger:hover{background:var(--danger-bg)}
.tbtn svg{width:13px;height:13px}
.toolgrp{display:flex;gap:6px;align-items:center}

/* ===== step tabs (Critérios / Alocação / Coerência) ===== */
.stepbar{display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--grid);flex:0 0 auto;padding:0 12px}
.step{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:11px 16px;font-weight:700;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.step.on{color:var(--ink);border-bottom-color:var(--brand)}
.step:hover{color:var(--ink)}
.step .n{width:18px;height:18px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:10.5px;display:grid;place-items:center;flex:0 0 auto}
.step.on .n{background:var(--brand);color:#fff}
.step .warncount{background:var(--danger);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1px 6px}
.step .okcheck{color:var(--dig);font-size:13px}

/* ===== visão de critérios / coerência ===== */
.stepview{flex:1;overflow:auto;background:var(--surface);padding:22px 26px 60px;display:none}
.stepview.show{display:block}
.stepview .wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.critcard{border:1px solid var(--grid);border-radius:12px;padding:16px 18px;background:var(--surface-2)}
.critcard h3{margin:0 0 4px;font-family:"Manrope";font-size:14.5px;font-weight:800}
.critcard .desc{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.funilrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.funilfield{background:var(--surface);border:1px solid var(--grid-strong);border-radius:9px;padding:8px 10px}
.funilfield label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.funilfield input{width:100%;border:0;background:transparent;font-size:16px;font-weight:800;color:var(--ink);font-family:"JetBrains Mono",monospace}
.funilsum{margin-top:9px;font-size:12px;font-weight:700}
.funilsum.ok{color:var(--dig)} .funilsum.bad{color:var(--danger)}
.chiprow{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--grid-strong);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.chip.on{border-color:var(--brand);background:var(--brand-bg);color:var(--brand)}
.radiorow{display:flex;flex-direction:column;gap:8px}
.radiocard{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--grid-strong);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.radiocard.on{border-color:var(--brand);background:var(--brand-bg)}
.radiocard input{margin-top:3px}
.radiocard .rt{font-weight:700;font-size:13px}
.radiocard .rd{font-size:11.5px;color:var(--muted);margin-top:2px}
.critrow2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.critselect{width:100%;border:1px solid var(--grid-strong);border-radius:9px;padding:9px 11px;font-size:13.5px;background:var(--surface);color:var(--ink)}
.critdate{width:100%;border:1px solid var(--grid-strong);border-radius:9px;padding:8px 10px;font-size:13px;background:var(--surface);color:var(--ink);font-family:"JetBrains Mono",monospace}

.checkcard{border:1px solid var(--grid);border-radius:12px;overflow:hidden}
.checkhead{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;background:var(--surface-2)}
.checkicon{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.checkicon.ok{background:var(--dig)} .checkicon.warn{background:var(--danger)} .checkicon.na{background:var(--faint)}
.checkbody h4{margin:0 0 3px;font-family:"Manrope";font-size:14px;font-weight:800}
.checkbody p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.justif{padding:0 16px 14px}
.justif label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:10px 0 6px}
.justif textarea{width:100%;border:1px solid var(--grid-strong);border-radius:9px;padding:9px 11px;font-size:13px;background:var(--surface);color:var(--ink);min-height:56px;resize:vertical}
.incomplete{text-align:center;color:var(--muted);padding:60px 20px}
.incomplete b{display:block;font-family:"Manrope";color:var(--ink);font-size:15px;margin-bottom:6px}

/* ===== info strip (briefing como cabeçalho de planilha) ===== */
.infostrip{display:grid;grid-template-columns:1.1fr 1fr 1fr .8fr .8fr 1.4fr 1.4fr;border-bottom:1px solid var(--grid);background:var(--head-bg);flex:0 0 auto}
.icell{border-right:1px solid var(--grid);padding:6px 10px;min-width:0}
.icell:last-child{border-right:0}
.icell label{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.icell input,.icell textarea{width:100%;border:0;background:transparent;padding:1px 0;font-size:13px;color:var(--ink);font-weight:600;resize:none}
.icell textarea{font-weight:500;font-size:12.5px;height:34px;line-height:1.35;font-family:inherit}
.icell input:focus,.icell textarea:focus{outline:0;background:var(--surface)}
.icell.money input{font-family:"JetBrains Mono",monospace}

/* ===== grid principal ===== */
.gridwrap{flex:1;overflow:auto;background:var(--surface);padding:0 0 24px}
.sheetsummary{padding:12px 16px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--grid)}
.sheetsummary b{color:var(--ink);font-family:"JetBrains Mono",monospace}
.sheetgroup{margin-top:18px}
.sheetgroup:first-of-type{margin-top:8px}
.sheetgrouphead{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:12px;color:var(--muted);font-weight:600}
.sheetgrouphead .sp{flex:1}
.sheetgrouphead b{font-family:"JetBrains Mono",monospace;color:var(--ink);font-size:13px}
.addcatrow{display:flex;align-items:center;gap:9px;padding:16px;flex-wrap:wrap}
.addcatrow label{font-size:12px;color:var(--muted);font-weight:600}
.addcatrow select{border:1px solid var(--grid-strong);border-radius:8px;padding:7px 10px;font-size:13px;background:var(--surface);color:var(--ink)}
table.sheet{border-collapse:collapse;width:100%;min-width:1180px}
table.sheet thead th{position:sticky;top:0;background:var(--head-bg);z-index:2;border-bottom:1px solid var(--grid-strong);border-right:1px solid var(--grid);padding:7px 9px;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
table.sheet thead th.num{text-align:right}
table.sheet thead th.rownum{width:34px;text-align:center;background:var(--head-bg)}
table.sheet tbody td{border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);padding:0;vertical-align:middle;height:34px}
table.sheet tbody tr:hover td{background:var(--surface-2)}
table.sheet tbody tr.late td{background:var(--danger-bg)}
td.rownum{text-align:center;color:var(--faint);font-size:11px;background:var(--head-bg);user-select:none}
.cellsel{width:100%;height:100%;border:0;background:transparent;padding:0 8px;font-size:13px;color:var(--ink);cursor:pointer;appearance:none;font-weight:500}
.cellsel:focus{outline:2px solid var(--brand);outline-offset:-2px;background:var(--surface)}
.cellinput{width:100%;height:100%;border:0;background:transparent;padding:0 8px;font-size:13px;color:var(--ink);text-align:right}
.cellinput.left{text-align:left}
.cellinput:focus{outline:2px solid var(--brand);outline-offset:-2px;background:var(--surface)}
td.result{padding:0 9px;text-align:right;font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
td.catcell{padding:0 8px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.badge .d{width:5px;height:5px;border-radius:50%}
.badge.topo{background:var(--brand-bg);color:var(--topo)} .badge.topo .d{background:var(--topo)}
.badge.meio{background:var(--dig-bg);color:var(--meio)} .badge.meio .d{background:var(--meio)}
.badge.fundo{background:#FAEAEF;color:var(--fundo)} .badge.fundo .d{background:var(--fundo)}
.badge.retencao{background:#FBF1E2;color:var(--ret)} .badge.retencao .d{background:var(--ret)}
.badge.off{background:var(--off-bg);color:var(--off)}
.badge.dig{background:var(--dig-bg);color:var(--dig)}
td.benchcell{padding:0 8px}
.benchbtn{border:1px dashed var(--grid-strong);background:transparent;border-radius:7px;padding:3px 8px;font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace;white-space:nowrap}
.benchbtn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
td.delcell{width:32px;text-align:center}
.rmbtn{border:0;background:transparent;color:var(--faint);width:26px;height:26px;border-radius:6px;font-size:15px;line-height:1;visibility:hidden}
tr:hover .rmbtn{visibility:visible}
.rmbtn:hover{background:var(--danger-bg);color:var(--danger)}
tr.addrow td{border-right:0;padding:0}
.addrowbtn{width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--brand)}
.addrowbtn:hover{background:var(--brand-soft)}
tfoot td{position:sticky;bottom:0;background:var(--head-bg);border-top:1px solid var(--grid-strong);border-right:1px solid var(--grid);padding:8px 9px;font-size:11.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
tfoot td.num{text-align:right}

/* ===== barra de status (rodapé estilo planilha) ===== */
.statusbar{flex:0 0 auto;display:flex;align-items:center;gap:0;background:var(--surface);border-top:1px solid var(--grid);overflow-x:auto}
.stat{padding:8px 16px;border-right:1px solid var(--grid);font-size:11.5px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.stat b{font-family:"JetBrains Mono",monospace;color:var(--ink);font-size:12.5px;font-weight:700}

/* ===== abas de planos (sheet tabs) ===== */
.tabs{flex:0 0 auto;display:flex;align-items:stretch;background:var(--head-bg);border-top:1px solid var(--grid);overflow-x:auto}
.tab{display:flex;align-items:center;gap:7px;padding:8px 10px 8px 14px;border-right:1px solid var(--grid);font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;background:transparent;position:relative}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 2px 0 var(--brand)}
.tab:hover{background:var(--surface)}
.tab input{border:0;background:transparent;font:inherit;font-weight:700;color:inherit;width:auto;min-width:20px}
.tab input:focus{outline:0}
.tabx{border:0;background:transparent;color:var(--faint);width:18px;height:18px;border-radius:5px;font-size:13px;line-height:1;flex:0 0 auto}
.tabx:hover{background:var(--danger-bg);color:var(--danger)}
.addtab{border:0;background:transparent;color:var(--brand);font-weight:800;font-size:16px;padding:8px 14px;flex:0 0 auto}
.addtab:hover{background:var(--brand-soft)}

/* ===== painel de análise (slide-over) ===== */
.panelback{position:fixed;inset:0;background:rgba(20,22,35,.4);display:none;z-index:70}
.panelback.open{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--surface);box-shadow:var(--sh-pop);z-index:71;transform:translateX(100%);transition:.22s ease;display:flex;flex-direction:column}
.panel.open{transform:none}
.panel header{padding:16px 18px;border-bottom:1px solid var(--grid);display:flex;justify-content:space-between;align-items:center;flex:0 0 auto}
.panel header h3{margin:0;font-family:"Manrope";font-size:16px;font-weight:800}
.panel .x{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:19px}
.panel .x:hover{background:var(--surface-2)}
.panelbody{padding:16px 18px;overflow:auto;flex:1}
.panelbody h4{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 0 9px}
.panelbody h4:first-child{margin-top:0}
.barlist{display:flex;flex-direction:column;gap:9px}
.barrow .bl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.bl b{font-weight:700}
.bl span{color:var(--muted)}
.bartrack{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bartrack > i{display:block;height:100%;border-radius:99px}
.stack{height:20px;border-radius:99px;overflow:hidden;display:flex;background:var(--surface-2)}
.stack span{height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--ink-soft)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.tlrow{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;padding:5px 0}
.tlname{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tltrack{position:relative;height:16px;background:var(--surface-2);border-radius:99px}
.tlbar{position:absolute;top:2px;bottom:2px;border-radius:99px}
.hint{font-size:12px;color:var(--muted);line-height:1.5}

/* ===== modal glossário ===== */
.backdrop{position:fixed;inset:0;background:rgba(20,22,35,.45);display:none;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:80;overflow:auto}
.backdrop.open{display:flex}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:640px;box-shadow:var(--sh-pop)}
.modal header{padding:16px 20px 2px;display:flex;justify-content:space-between;align-items:center}
.modal header h3{margin:0;font-family:"Manrope";font-size:17px;font-weight:800}
.modal .x{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:20px;line-height:1}
.modal .x:hover{background:var(--surface-2)}
.gsearch{padding:12px 20px 0}
.gsearch input{width:100%;border:1px solid var(--grid-strong);border-radius:9px;padding:9px 12px;font-size:13.5px;background:var(--surface-2);color:var(--ink)}
.glossary{max-height:60vh;overflow:auto;padding:4px 20px 20px}
.gitem{padding:10px 0;border-bottom:1px solid var(--grid)}
.gitem:last-child{border-bottom:0}
.gitem b{font-family:"Manrope";font-size:13.5px}
.gitem p{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.5}

.toast{position:fixed;left:50%;bottom:70px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--sh-pop);z-index:90;opacity:0;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{margin:40px auto;max-width:420px;text-align:center;color:var(--muted)}
.empty .em{font-family:"Manrope";color:var(--ink);font-weight:800;font-size:18px;margin-bottom:6px}
.empty button{margin-top:14px;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:9px 16px;font-weight:700;font-size:13.5px}

@media print{
  .topbar,.tabs,.statusbar,.addrowbtn,.rmbtn,.panelback,.panel{display:none!important}
  .app{height:auto;overflow:visible}
  .gridwrap{overflow:visible}
  body{background:#fff}
}
@media (max-width:860px){
  .infostrip{grid-template-columns:1fr 1fr;grid-auto-rows:auto}
  .icell{border-bottom:1px solid var(--grid)}
  .panel{width:100%}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" fill="none">
        <rect x="4" y="20" width="7" height="16" rx="2" fill="#3F6BF0"/>
        <rect x="16.5" y="10" width="7" height="26" rx="2" fill="#0E8C7F"/>
        <rect x="29" y="4" width="7" height="32" rx="2" fill="#B0496B"/>
      </svg>
      <b>Plano de Mídia</b>
    </div>
    <input class="planname" id="planNameInput" placeholder="Nome do plano">
    <div class="savestat" id="saveStat"><span class="dot"></span>salvo</div>
    <div class="spacer"></div>

function ensurePlanShape(p){
  if(!p.criteria) p.criteria=defaultCriteria();
  const dc=defaultCriteria();
  Object.keys(dc).forEach(k=>{ if(p.criteria[k]===undefined) p.criteria[k]=dc[k]; });
  if(!p.justificativas) p.justificativas={};
  (p.lines||[]).forEach(l=>{
    if(!l.papel) l.papel=PAPEL_POR_FUNIL[l.funil]||"alcance";
    if(!l.regiao) l.regiao="nacional";
    if(l.titulo===undefined) l.titulo="";
    if(!l.extra) l.extra={};
  });
  return p;
}

async function load(){
  try{
    if(window.storage){
      const r=await window.storage.get(KEY).catch(()=>null);
      if(r&&r.value) data=JSON.parse(r.value);
    }else if(window.localStorage){
      const v=localStorage.getItem(KEY);
      if(v) data=JSON.parse(v);
    }
  }catch(e){}
  data.plans=data.plans||[];
  if(!data.plans.length) data.plans.push(samplePlan());
  data.plans.forEach(ensurePlanShape);
  activePlanId=data.plans[0].id;
}
async function save(){
  try{
    if(window.storage){ await window.storage.set(KEY,JSON.stringify(data)); setSaveStat("ok"); }
    else if(window.localStorage){ localStorage.setItem(KEY,JSON.stringify(data)); setSaveStat("local"); }
    else setSaveStat("none");
  }catch(e){ setSaveStat("err"); }
}

  const h=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  if(s==="ok")el.innerHTML=`<span class="dot"></span>salvo na sua conta · ${h}`;
  else if(s==="local")el.innerHTML=`<span class="dot"></span>salvo neste navegador · ${h}`;
  else if(s==="none")el.innerHTML=`<span class="dot" style="background:var(--ret)"></span>sem salvamento — exporte`;
  else el.innerHTML=`<span class="dot" style="background:var(--danger)"></span>falha ao salvar`;
}

function newPlan(){
  const p={id:uid(),nome:"Novo plano",cliente:"",objetivo:"",publico:"",inicio:"",fim:"",verba:0,lines:[],criteria:defaultCriteria(),justificativas:{}};
  data.plans.push(p); activePlanId=p.id; viewMode="criterios"; save(); render();
}
function delPlan(id){
  if(data.plans.length<=1){ toast("Mantenha ao menos um plano."); return; }
  data.plans=data.plans.filter(x=>x.id!==id);
  if(activePlanId===id) activePlanId=data.plans[0].id;
  save(); render();
}
function curPlan(){return data.plans.find(p=>p.id===activePlanId)||data.plans[0];}
function vehicle(k){return VEHICLES.find(v=>v.k===k);}
function catInfo(k){return CATS.find(c=>c.key===k);}
function money(n){return (n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function num(n){return Math.round(n||0).toLocaleString("pt-BR");}
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmtd(s){ if(!s) return ""; const d=new Date(s+"T00:00:00"); if(isNaN(d)) return s; return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"}); }

function lineResult(l){
  const custo=parseFloat(l.custo)||0, verba=parseFloat(l.verba)||0;
  if(!custo || l.modelo==="FIXO") return {qty:null,label:RESLABEL[l.modelo]||""};
  const qty = l.modelo==="CPM" ? verba/custo*1000 : verba/custo;
  return {qty, label:RESLABEL[l.modelo]||""};
}
function planTotals(p){
  const totalVerba=p.lines.reduce((s,l)=>s+(parseFloat(l.verba)||0),0);
  const byCat={}, byFunil={}, byClass={off:0,dig:0}, byRegiao={};
  let impressoes=0, cliques=0, views=0, conversoes=0;
  p.lines.forEach(l=>{
    const v=vehicle(l.veiculo); if(!v) return;
    const c=catInfo(v.cat);
    const verba=parseFloat(l.verba)||0;
    byCat[v.cat]=(byCat[v.cat]||0)+verba;
    byFunil[l.funil]=(byFunil[l.funil]||0)+verba;
    byClass[c.cls]=(byClass[c.cls]||0)+verba;
    byRegiao[l.regiao||"nacional"]=(byRegiao[l.regiao||"nacional"]||0)+verba;
    const r=lineResult(l);
    if(r.qty){
      if(l.modelo==="CPM") impressoes+=r.qty;
      else if(l.modelo==="CPC") cliques+=r.qty;
      else if(l.modelo==="CPV") views+=r.qty;
      else if(["CPA","CPL","CPI"].includes(l.modelo)) conversoes+=r.qty;
    }
  });
  return {totalVerba,byCat,byFunil,byClass,byRegiao,impressoes,cliques,views,conversoes};
}

/* ===================== critérios: validação e checagens ===================== */
function criteriaComplete(p){
  const c=p.criteria||{};
  const sum=Object.values(c.funil||{}).reduce((s,v)=>s+(parseFloat(v)||0),0);
  return Math.abs(sum-100)<0.5 && c.publico&&c.publico.length && c.postura && c.competitiva && c.kpi
    && (c.timing==="continuo" || (c.picoInicio&&c.picoFim))
    && parseFloat(c.publicoTamanho)>0 && parseFloat(c.coberturaAlvo)>0 && parseFloat(c.freqMin)>0 && parseFloat(c.freqMax)>0;
}

// modelo simplificado de alcance/frequência para fins didáticos: assume distribuição de exposição
// tipo Poisson por linha (reach = 1 - e^-impressões/população) e combina canais por independência estatística.
// Não substitui pesquisa de audiência real — é uma aproximação para discutir o conceito em sala.
function reachFreq(p){
  const pop=parseFloat(p.criteria.publicoTamanho)||0;
  if(!pop) return null;
  let complement=1, totalImpEquiv=0;
  p.lines.forEach(l=>{
    let impEquiv=0;
    if(l.modelo==="CPM"){ const r=lineResult(l); if(r.qty) impEquiv=r.qty; }
    else if(l.modelo==="CPP"){ const r=lineResult(l); if(r.qty) impEquiv=r.qty/100*pop; }
    if(impEquiv>0){ totalImpEquiv+=impEquiv; complement*=(1-Math.min(1,1-Math.exp(-impEquiv/pop))); }
  });
  const reachPct=(1-complement)*100;
  const reachPeople=pop*(1-complement);
  const avgFreq=reachPeople>0? totalImpEquiv/reachPeople : 0;
  return {reachPct,reachPeople,avgFreq,totalImpEquiv,pop};
}
function computeChecks(p){
  const t=planTotals(p); const c=p.criteria||{};
  const checks=[];

  // 1) funil declarado x alocado
  if(t.totalVerba<=0 || !c.funil) checks.push({id:"funil",status:"na",title:"Distribuição por funil",detail:"Aloque verba nas linhas para comparar com o funil declarado."});
  else{
    const offenders=[];
    Object.keys(FUNIL).forEach(k=>{
      const declarado=parseFloat(c.funil[k])||0;
      const real=Math.round((t.byFunil[k]||0)/t.totalVerba*100);
      if(Math.abs(declarado-real)>15) offenders.push(`${FUNIL[k]}: declarou ${declarado}%, alocou ${real}%`);
    });
    checks.push(offenders.length
      ? {id:"funil",status:"warn",title:"Distribuição por funil",detail:"Divergência acima de 15 pontos percentuais entre o declarado e o alocado — "+offenders.join("; ")+"."}
      : {id:"funil",status:"ok",title:"Distribuição por funil",detail:"A alocação por etapa do funil está coerente com o que você planejou."});
  }

  // 2) canais aderentes ao público
  if(!c.publico||!c.publico.length || t.totalVerba<=0) checks.push({id:"publico",status:"na",title:"Aderência ao público",detail:"Selecione os canais de consumo do público e aloque verba para checar."});
  else{
    let foraVerba=0; const foraCats=new Set();
    p.lines.forEach(l=>{ const v=vehicle(l.veiculo); if(!v) return; if(!c.publico.includes(v.cat)){ foraVerba+=parseFloat(l.verba)||0; foraCats.add(catInfo(v.cat).label); } });
    const pctFora=Math.round(foraVerba/t.totalVerba*100);
    checks.push(pctFora>30
      ? {id:"publico",status:"warn",title:"Aderência ao público",detail:`${pctFora}% da verba está em categorias que você não marcou como consumidas pelo público (${[...foraCats].join(", ")}).`}
      : {id:"publico",status:"ok",title:"Aderência ao público",detail:"A maior parte da verba está nos canais que você indicou como consumidos pelo público-alvo."});
  }

  // 3) postura de custo x benchmarks
  if(!c.postura) checks.push({id:"custo",status:"na",title:"Postura de custo",detail:"Defina se busca eficiência de mercado ou está disposto a pagar premium."});
  else{
    const acima=[], nenhumPremium=[];
    let existePremium=false;
    p.lines.forEach(l=>{
      const v=vehicle(l.veiculo); const range=v&&BENCHNUM[v.k]; const custo=parseFloat(l.custo);
      if(!v||!range||!custo) return;
      if(custo>range[1]*1.05) acima.push(v.label);
      if(custo>(range[0]+range[1])/2) existePremium=true;
    });
    if(c.postura==="padrao" && acima.length) checks.push({id:"custo",status:"warn",title:"Postura de custo",detail:`Você definiu buscar eficiência de mercado, mas paga acima da faixa de referência em: ${acima.join(", ")}.`});
    else if(c.postura==="premium" && !existePremium && p.lines.length) checks.push({id:"custo",status:"warn",title:"Postura de custo",detail:"Você priorizou qualidade/alcance premium, mas nenhuma linha paga acima da média de mercado — reveja se o mix reflete essa escolha."});
    else checks.push({id:"custo",status:"ok",title:"Postura de custo",detail:"Os custos unitários das linhas são coerentes com a postura declarada."});
  }

  // 4) timing / flighting
  if(c.timing==="continuo") checks.push({id:"timing",status:"ok",title:"Timing de veiculação",detail:"Veiculação contínua não exige concentração de verba em um período específico."});
  else if(!c.picoInicio||!c.picoFim) checks.push({id:"timing",status:"warn",title:"Timing de veiculação",detail:"Você escolheu um cronograma pulsado/concentrado, mas não definiu o período de pico."});
  else{
    const pi=new Date(c.picoInicio+"T00:00:00"), pf=new Date(c.picoFim+"T00:00:00");
    let dentro=0;
    p.lines.forEach(l=>{
      if(!l.inicio||!l.fim) return;
      const li=new Date(l.inicio+"T00:00:00"), lf=new Date(l.fim+"T00:00:00");
      if(li<=pf && lf>=pi) dentro+=parseFloat(l.verba)||0;
    });
    const pct = t.totalVerba? Math.round(dentro/t.totalVerba*100):0;
    checks.push(pct<45
      ? {id:"timing",status:"warn",title:"Timing de veiculação",detail:`Só ${pct}% da verba está concentrada no período de pico que você definiu (${fmtd(c.picoInicio)}–${fmtd(c.picoFim)}).`}
      : {id:"timing",status:"ok",title:"Timing de veiculação",detail:`${pct}% da verba está concentrada no período de pico declarado.`});
  }

  // 5) postura competitiva
  const massCats=["tv","ooh","cinema","video"];
  const massPct = t.totalVerba? Math.round(Object.entries(t.byCat).filter(([k])=>massCats.includes(k)).reduce((s,[,v])=>s+v,0)/t.totalVerba*100):0;
  if(!c.competitiva || t.totalVerba<=0) checks.push({id:"competitiva",status:"na",title:"Postura competitiva",detail:"Defina a postura frente à concorrência e aloque verba para checar."});
  else if(c.competitiva==="agressivo") checks.push(massPct<20
    ? {id:"competitiva",status:"warn",title:"Postura competitiva",detail:`Postura agressiva declarada, mas só ${massPct}% da verba está em canais de alcance de massa (TV/OOH/cinema/vídeo).`}
    : {id:"competitiva",status:"ok",title:"Postura competitiva",detail:`${massPct}% da verba está em canais de massa, coerente com uma postura agressiva.`});
  else if(c.competitiva==="nicho") checks.push(massPct>20
    ? {id:"competitiva",status:"warn",title:"Postura competitiva",detail:`Postura de nicho declarada, mas ${massPct}% da verba está em canais de massa (TV/OOH) — pode ser verba desperdiçada em audiência não segmentada.`}
    : {id:"competitiva",status:"ok",title:"Postura competitiva",detail:"O mix evita concentração em canais de massa, coerente com uma postura de nicho."});
  else checks.push({id:"competitiva",status:"ok",title:"Postura competitiva",detail:"Presença moderada não exige um padrão específico de canais."});

  // 6) kpi de sucesso x modelo de compra dominante
  if(!c.kpi || t.totalVerba<=0) checks.push({id:"kpi",status:"na",title:"KPI de sucesso",detail:"Defina a métrica que vai julgar o plano e aloque verba para checar."});
  else{
    const byModelo={};
    p.lines.forEach(l=>{ byModelo[l.modelo]=(byModelo[l.modelo]||0)+(parseFloat(l.verba)||0); });
    const dominante=Object.entries(byModelo).sort((a,b)=>b[1]-a[1])[0];
    const esperado=KPI_OPTS[c.kpi].modelos;
    checks.push(dominante && !esperado.includes(dominante[0])
      ? {id:"kpi",status:"warn",title:"KPI de sucesso",detail:`O KPI escolhido é "${KPI_OPTS[c.kpi].label}", mas o modelo de compra dominante do mix é ${MODELO[dominante[0]]}, pouco ligado a esse resultado.`}
      : {id:"kpi",status:"ok",title:"KPI de sucesso",detail:`O modelo de compra dominante do mix é coerente com "${KPI_OPTS[c.kpi].label}".`});
  }

  // 7) cobertura do target
  const rf=reachFreq(p);
  if(!rf || t.totalVerba<=0 || !c.coberturaAlvo) checks.push({id:"cobertura",status:"na",title:"Cobertura do target",detail:"Informe o tamanho do público-alvo e a cobertura desejada, e aloque verba em linhas de CPM/CPP para estimar."});
  else{
    const declarado=parseFloat(c.coberturaAlvo);
    const diff=rf.reachPct-declarado;
    checks.push(Math.abs(diff)>10
      ? {id:"cobertura",status:"warn",title:"Cobertura do target",detail:`Cobertura estimada de ${rf.reachPct.toFixed(1)}% do público (${num(rf.reachPeople)} pessoas), contra os ${declarado}% desejados — estimativa simplificada por sobreposição estatística entre canais de CPM/CPP.`}
      : {id:"cobertura",status:"ok",title:"Cobertura do target",detail:`Cobertura estimada de ${rf.reachPct.toFixed(1)}% do público, próxima da meta de ${declarado}%.`});
  }

  // 8) frequência média efetiva
  if(!rf || t.totalVerba<=0 || !c.freqMin || !c.freqMax) checks.push({id:"frequencia",status:"na",title:"Frequência efetiva média",detail:"Informe a faixa de frequência desejada e aloque verba em linhas de CPM/CPP para estimar."});
  else{
    const min=parseFloat(c.freqMin), max=parseFloat(c.freqMax);
    checks.push(rf.avgFreq<min*0.8 || rf.avgFreq>max*1.2
      ? {id:"frequencia",status:"warn",title:"Frequência efetiva média",detail:`Frequência média estimada de ${rf.avgFreq.toFixed(1)}x, fora da faixa desejada de ${min}x–${max}x. Muito abaixo pode não gerar lembrança; muito acima costuma indicar saturação/desperdício de verba.`}
      : {id:"frequencia",status:"ok",title:"Frequência efetiva média",detail:`Frequência média estimada de ${rf.avgFreq.toFixed(1)}x, dentro da faixa desejada de ${min}x–${max}x.`});
  }

  // 9) papel dos veículos x etapa do funil — gaps de jornada
  if(t.totalVerba<=0) checks.push({id:"jornada",status:"na",title:"Jornada e papel dos veículos",detail:"Adicione linhas para checar se a jornada do público está coberta ponta a ponta."});
  else{
    const semConversao = (t.byFunil.fundo||0)>0 && !p.lines.some(l=>l.funil==="fundo" && l.papel==="conversao");
    const semAlcance = (t.byFunil.topo||0)>0 && !p.lines.some(l=>l.funil==="topo" && l.papel==="alcance");
    const gaps=[];
    if(semConversao) gaps.push("há verba no fundo de funil mas nenhuma linha com papel de Conversão/Resposta direta");
    if(semAlcance) gaps.push("há verba no topo de funil mas nenhuma linha com papel de Alcance/Cobertura");
    checks.push(gaps.length
      ? {id:"jornada",status:"warn",title:"Jornada e papel dos veículos",detail:"A jornada do público tem lacunas: "+gaps.join("; ")+"."}
      : {id:"jornada",status:"ok",title:"Jornada e papel dos veículos",detail:"Cada etapa do funil com verba alocada tem ao menos um veículo cumprindo o papel tático esperado."});
  }

  return checks;
}

/* ===================== render ===================== */
function render(){
  const p=curPlan();
  document.getElementById("planNameInput").value=p.nome;
  renderStepbar(p);
  document.getElementById("infostrip").style.display = viewMode==="alocacao" ? "grid" : "none";
  document.getElementById("gridwrap").style.display = viewMode==="alocacao" ? "block" : "none";
  document.getElementById("statusbar").style.display = viewMode==="alocacao" ? "flex" : "none";
  const sv=document.getElementById("stepview");
  if(viewMode==="alocacao"){
    sv.classList.remove("show");
    renderInfostrip(p); renderGrid(p); renderStatusbar(p);
  }else{
    sv.classList.add("show");
    if(viewMode==="criterios") renderCriterios(p);
    else if(viewMode==="jornada") renderJornada(p);
    else renderCoerencia(p);
  }
  renderTabs();
}

function renderStepbar(p){
  const complete=criteriaComplete(p);
  const warnCount = complete ? computeChecks(p).filter(c=>c.status==="warn").length : null;
  const steps=[
    {k:"criterios",n:"1",label:"Critérios de planejamento",extra: complete?`<span class="okcheck">✓</span>`:""},
    {k:"alocacao",n:"2",label:"Alocação de verba"},
    {k:"jornada",n:"3",label:"Jornada e multicanalidade"},
    {k:"coerencia",n:"4",label:"Coerência do plano",extra: warnCount?`<span class="warncount">${warnCount}</span>`:(complete?`<span class="okcheck">✓</span>`:"")},
  ];
  document.getElementById("stepbar").innerHTML=steps.map(s=>`
    <button class="step ${viewMode===s.k?"on":""}" data-act="set-view" data-view="${s.k}"><span class="n">${s.n}</span>${s.label}${s.extra||""}</button>
  `).join("");
}

function renderInfostrip(p){

    <div class="icell"><label>Objetivo</label><input data-field="objetivo" value="${esc(p.objetivo)}" placeholder="—"></div>
    <div class="icell"><label>Público-alvo</label><input data-field="publico" value="${esc(p.publico)}" placeholder="—"></div>
    <div class="icell"><label>Início</label><input type="date" data-field="inicio" value="${p.inicio||""}"></div>
    <div class="icell"><label>Fim</label><input type="date" data-field="fim" value="${p.fim||""}"></div>
    <div class="icell money"><label>Verba total (R$)</label><input type="number" min="0" step="100" data-field="verba" value="${p.verba||0}"></div>

function renderMiniTimeline(p){
  const el=document.getElementById("tlmini"); if(!el) return;
  const dated=p.lines.filter(l=>l.inicio&&l.fim);
  if(!dated.length){ el.innerHTML=`<span style="font-size:11px;color:var(--faint)">sem datas nas linhas</span>`; return; }
  el.innerHTML=`<button class="tbtn" style="padding:3px 9px;font-size:11px" data-act="analytics">Ver cronograma →</button>`;
}

}

function monthlyMap(p){
  const dated=p.lines.filter(l=>l.inicio&&l.fim);
  if(!dated.length) return null;
  let min=null,max=null;
  dated.forEach(l=>{ const di=new Date(l.inicio+"T00:00:00"), df=new Date(l.fim+"T00:00:00"); if(!min||di<min) min=di; if(!max||df>max) max=df; });
  const months=[];
  let cur=new Date(min.getFullYear(),min.getMonth(),1);
  const last=new Date(max.getFullYear(),max.getMonth(),1);
  while(cur<=last){
    const start=new Date(cur), end=new Date(cur.getFullYear(),cur.getMonth()+1,0);
    months.push({key:cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0"), label:cur.toLocaleDateString("pt-BR",{month:"short",year:"2-digit"}), start, end});
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  const rows=dated.slice().sort((a,b)=>{ const va=vehicle(a.veiculo), vb=vehicle(b.veiculo); return (va?va.cat:"").localeCompare(vb?vb.cat:""); }).map(l=>{
    const li=new Date(l.inicio+"T00:00:00"), lf=new Date(l.fim+"T00:00:00");
    const totalLineDays=Math.max(1,Math.round((lf-li)/86400000)+1);
    const verba=parseFloat(l.verba)||0;
    const values={};
    months.forEach(m=>{
      const overlapStart=li>m.start?li:m.start;
      const overlapEnd=lf<m.end?lf:m.end;
      const overlapDays=Math.max(0,Math.round((overlapEnd-overlapStart)/86400000)+1);
      values[m.key]=verba*(overlapDays/totalLineDays);
    });
    return {line:l, values};
  });
  const totals={}; months.forEach(m=>{ totals[m.key]=rows.reduce((s,r)=>s+r.values[m.key],0); });
  return {months,rows,totals};
}

      const line=p.lines.find(x=>x.id===input.dataset.line);
      if(!line) return;
      const k=input.dataset.k;
      let v=input.value;
      if(k==="custo"||k==="verba") v=parseFloat(v)||0;
      if(k.startsWith("extra.")){
        if(!line.extra) line.extra={};
        line.extra[k.split(".")[1]]=v;
      }else{
        line[k]=v;
      }
      if(k==="veiculo"){
        const veh=vehicle(v); const oldVeh=vehicle(line.veiculo);
        if(veh){
          const oldCat=oldVeh?oldVeh.cat:null;
          line.funil=veh.funil; line.modelo=veh.modelo; line.papel=PAPEL_POR_FUNIL[veh.funil];
          if(oldCat!==veh.cat) line.extra={};
        }
      }
      if(k==="funil" && !line._papelManual){ line.papel=PAPEL_POR_FUNIL[v]; }
      if(k==="papel"){ line._papelManual=true; }
      save();
      render();
    });
  });
  const addSel=document.getElementById("addCatSelect");
  const addBtn=el.querySelector('[data-act="add-line-select"]');
  if(addBtn) addBtn.addEventListener("click",()=>{
    const p2=curPlan(); const veh=vehicle(addSel.value);
    p2.lines.push({id:uid(),veiculo:veh.k,funil:veh.funil,papel:PAPEL_POR_FUNIL[veh.funil],regiao:"nacional",titulo:"",modelo:veh.modelo,custo:"",verba:"",inicio:"",fim:"",extra:{}});
    save(); render();
  });
}

function renderStatusbar(p){
  const t=planTotals(p);
  const pct = p.verba? Math.round(t.totalVerba/parseFloat(p.verba)*100) : null;
  document.getElementById("statusbar").innerHTML=`
    <div class="stat">Verba alocada <b>${money(t.totalVerba)}</b>${pct!==null?` <span style="color:var(--faint)">(${pct}% da verba total)</span>`:""}</div>
    <div class="stat">Impressões <b>${num(t.impressoes)}</b></div>
    <div class="stat">Cliques <b>${num(t.cliques)}</b>${t.impressoes?` <span style="color:var(--faint)">CTR ${((t.cliques/t.impressoes*100)||0).toFixed(2)}%</span>`:""}</div>
    <div class="stat">Views <b>${num(t.views)}</b></div>
    <div class="stat">Conversões <b>${num(t.conversoes)}</b></div>
  `;
}

function renderTabs(){
  document.getElementById("tabs").innerHTML = data.plans.map(p=>`
    <div class="tab ${p.id===activePlanId?"on":""}" data-act="select-plan" data-id="${p.id}">
      <span>${esc(p.nome)}</span>
      <button class="tabx" data-act="del-plan" data-id="${p.id}" title="Excluir plano">×</button>
    </div>
  `).join("") + `<button class="addtab" data-act="new-plan" title="Novo plano">+</button>`;
}

/* ===================== painel de análises ===================== */
function catColor(catKey){
  const palette={tv:"#3F6BF0",radio:"#2F6FB2",ooh:"#B96A22",cinema:"#9A57A8",impresso:"#7A7D93",audio:"#B0496B",busca:"#D33B3B",social:"#0E8C7F",display:"#4C9A51",video:"#0E8C7F",retail:"#C2410C",influ:"#B9820C",afiliados:"#5759D1",crm:"#159069",app:"#2F6FB2",gaming:"#B0496B"};
  return palette[catKey]||"#3F6BF0";
}
function funilColor(k){return {topo:"var(--topo)",meio:"var(--meio)",fundo:"var(--fundo)",retencao:"var(--ret)"}[k]||"var(--brand)";}
function barList(byKey, labels, total, colorFn){
  const rows=Object.entries(byKey).sort((a,b)=>b[1]-a[1]);
  if(!rows.length) return `<div class="hint">Sem verba alocada ainda.</div>`;
  return `<div class="barlist">${rows.map(([k,v])=>{
    const pct=total? Math.round(v/total*100):0;
    return `<div class="barrow"><div class="bl"><b>${esc(labels[k]||k)}</b><span>${money(v)} · ${pct}%</span></div>
      <div class="bartrack"><i style="width:${pct}%;background:${colorFn(k)}"></i></div></div>`;
  }).join("")}</div>`;
}
function stackBar(byKey, labels, total, colorFn){
  const keys=Object.keys(labels).filter(k=>byKey[k]);
  if(!keys.length) return `<div class="hint">Sem verba alocada ainda.</div>`;
  const stack=`<div class="stack">${keys.map(k=>{
    const pct=total? (byKey[k]/total*100):0;
    return `<span style="width:${pct}%;background:${colorFn(k)}"></span>`;
  }).join("")}</div>`;
  const legend=`<div class="legend">${keys.map(k=>{
    const pct=total? Math.round(byKey[k]/total*100):0;
    return `<span><i style="background:${colorFn(k)}"></i>${esc(labels[k])} — ${pct}%</span>`;
  }).join("")}</div>`;
  return stack+legend;
}
function timelineHTML(p){
  const dated=p.lines.filter(l=>l.inicio&&l.fim);
  if(!dated.length) return `<div class="hint">Defina início e fim nas linhas para ver o cronograma.</div>`;
  let min=null,max=null;
  dated.forEach(l=>{
    const di=new Date(l.inicio+"T00:00:00"), df=new Date(l.fim+"T00:00:00");
    if(!min||di<min) min=di; if(!max||df>max) max=df;
  });
  const totalDays=Math.max(1, Math.round((max-min)/86400000)+1);
  const rows=dated.map(l=>{
    const v=vehicle(l.veiculo);
    const di=new Date(l.inicio+"T00:00:00"), df=new Date(l.fim+"T00:00:00");
    const startPct=Math.max(0,(di-min)/86400000)/totalDays*100;
    const widthPct=Math.max(2,(df-di)/86400000+1)/totalDays*100;
    return `<div class="tlrow"><div class="tlname">${esc(v?v.label:l.veiculo)}</div>
      <div class="tltrack"><div class="tlbar" style="left:${startPct}%;width:${widthPct}%;background:${catColor(v?v.cat:"")}"></div></div></div>`;
  }).join("");
  return rows;
}
function openAnalytics(){
  const p=curPlan(); const t=planTotals(p);
  document.getElementById("panel").innerHTML=`
    <header><h3>Análises do plano</h3><button class="x" data-act="close-panel">×</button></header>
    <div class="panelbody">
      <h4>Verba por veículo</h4>
      ${barList(t.byCat, CATS.reduce((o,c)=>{o[c.key]=c.label;return o;},{}), t.totalVerba, catColor)}
      <h4>Verba por etapa do funil</h4>
      ${stackBar(t.byFunil, FUNILFULL, t.totalVerba, funilColor)}
      <h4>Offline × Digital</h4>
      ${stackBar(t.byClass, {off:"Offline",dig:"Digital"}, t.totalVerba, c=>c==="off"?"var(--off)":"var(--dig)")}
      <h4>Verba por região</h4>
      ${barList(t.byRegiao, REGIOES, t.totalVerba, ()=>"var(--brand)")}
      <h4>Cronograma de veiculação</h4>
      ${timelineHTML(p)}
    </div>`;
  document.getElementById("panel").classList.add("open");
  document.getElementById("panelback").classList.add("open");
}
function closeAnalytics(){
  document.getElementById("panel").classList.remove("open");
  document.getElementById("panelback").classList.remove("open");
}

/* ===================== glossário ===================== */
function openGlossary(){
  document.getElementById("modal").innerHTML=`
    <header><h3>Glossário de mídia</h3><button class="x" data-act="close-modal">×</button></header>
    <div class="gsearch"><input id="gSearch" placeholder="Buscar termo (ex.: CPM, alcance, ROAS)..."></div>
    <div class="glossary" id="gList"></div>`;
  document.getElementById("backdrop").classList.add("open");
  function renderList(q){
    q=(q||"").toLowerCase();
    const items=GLOSSARY.filter(g=>!q||g.t.toLowerCase().includes(q)||g.d.toLowerCase().includes(q));
    document.getElementById("gList").innerHTML=items.map(g=>`<div class="gitem"><b>${esc(g.t)}</b><p>${esc(g.d)}</p></div>`).join("")||`<div class="hint" style="padding:20px 0">Nenhum termo encontrado.</div>`;
  }
  document.getElementById("gSearch").addEventListener("input",e=>renderList(e.target.value));
  renderList("");
}
function closeModal(){ document.getElementById("backdrop").classList.remove("open"); }

/* ===================== import/export ===================== */
async function exportJSON(){
  const filename="plano-de-midia-backup-"+new Date().toISOString().slice(0,10)+".json";
  const json=JSON.stringify(data,null,2);
  try{
    const downloads=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(downloads){ await downloads.save({filename,data:json}); return; }
  }catch(e){}
  const blob=new Blob([json],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
}
function importJSON(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const incoming=JSON.parse(reader.result);
      if(incoming&&Array.isArray(incoming.plans)){
        incoming.plans.forEach(p=>{ if(!p.id) p.id=uid(); });
        data.plans=data.plans.concat(incoming.plans);
        activePlanId=incoming.plans.length?incoming.plans[incoming.plans.length-1].id:activePlanId;
        save(); render(); toast("Planos importados com sucesso.");
      }else toast("Arquivo inválido.");
    }catch(e){ toast("Erro ao ler o arquivo."); }
  };
  reader.readAsText(file);
}
function toast(msg){
  let t=document.querySelector(".toast");
  if(!t){ t=document.createElement("div"); t.className="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600);
}

/* ===================== eventos globais ===================== */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==="new-plan") newPlan();
  else if(act==="select-plan"){ activePlanId=id; viewMode=criteriaComplete(curPlan())?"alocacao":"criterios"; render(); }
  else if(act==="set-view"){ viewMode=b.dataset.view; render(); }
  else if(act==="toggle-cat"){
    const p=curPlan(); const key=b.dataset.key; const i=p.criteria.publico.indexOf(key);
    if(i>=0) p.criteria.publico.splice(i,1); else p.criteria.publico.push(key);
    save(); render();
  }
  else if(act==="del-plan"){ e.stopPropagation(); if(confirm("Excluir este plano de mídia?")) delPlan(id); }
  else if(act==="add-line"){
    const p=curPlan();
    const veh = b.dataset.veiculo ? vehicle(b.dataset.veiculo) : VEHICLES[0];
    p.lines.push({id:uid(),veiculo:veh.k,funil:veh.funil,papel:PAPEL_POR_FUNIL[veh.funil],regiao:"nacional",titulo:"",modelo:veh.modelo,custo:"",verba:"",inicio:"",fim:"",extra:{}});
    save(); render();
  }
  else if(act==="del-line"){ const p=curPlan(); p.lines=p.lines.filter(x=>x.id!==id); save(); render(); }
  else if(act==="usar-bench"){
    const p=curPlan(); const line=p.lines.find(x=>x.id===id); const v=line&&vehicle(line.veiculo); const range=v&&BENCHNUM[v.k];
    if(line&&range){ line.custo=Math.round(((range[0]+range[1])/2)*100)/100; save(); render(); }
  }
  else if(act==="usar-insercoes"){
    const p=curPlan(); const line=p.lines.find(x=>x.id===id);
    if(line&&line.extra&&line.extra.insercoes&&line.custo){ line.verba=Math.round(parseFloat(line.custo)*parseFloat(line.extra.insercoes)*100)/100; save(); render(); }
  }
  else if(act==="glossary") openGlossary();
  else if(act==="close-modal") closeModal();
  else if(act==="analytics") openAnalytics();
  else if(act==="close-panel") closeAnalytics();
  else if(act==="print") window.print();
  else if(act==="export") exportJSON();
  else if(act==="import") document.getElementById("importFile").click();
});
document.getElementById("backdrop").addEventListener("click",e=>{ if(e.target.id==="backdrop") closeModal(); });
document.getElementById("panelback").addEventListener("click",closeAnalytics);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeModal(); closeAnalytics(); } });
document.getElementById("importFile").addEventListener("change",e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=""; });
document.getElementById("planNameInput").addEventListener("change",e=>{ const p=curPlan(); p.nome=e.target.value||"Sem nome"; save(); renderTabs(); });

/* ===================== boot ===================== */
(async function(){ await load(); viewMode=criteriaComplete(curPlan())?"alocacao":"criterios"; render(); })();
</script>
