<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plano de Mídia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --surface-2:#F6F7FA; --ink:#1B1D26; --ink-soft:#424457; --muted:#7A7D93; --faint:#AEB0C2;
  --grid:#DCDEE7; --grid-strong:#C7C9DA;
  --brand:#3F6BF0; --brand-bg:#E8EEFE; --brand-soft:#EDF2FE;
  --off:#B96A22; --off-bg:#FBF0E6;
  --dig:#0E8C7F; --dig-bg:#E4F2EF;
  --topo:#5759D1; --meio:#0E8C7F; --fundo:#B0496B; --ret:#B9820C;
  --danger:#D33B3B; --danger-bg:#FCEBEB;
  --head-bg:#F3F4F8;
  --sh:0 1px 2px rgba(20,22,35,.04), 0 4px 14px rgba(20,22,35,.05);
  --sh-pop:0 16px 50px rgba(20,22,35,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161E; --surface:#1C1D28; --surface-2:#22232F; --ink:#ECEDF4; --ink-soft:#C3C5D6; --muted:#8B8DA3; --faint:#5A5C74;
    --grid:#33344A; --grid-strong:#42435C;
    --brand:#7C9AFF; --brand-bg:#232A4A; --brand-soft:#1E2440;
    --off:#E0995C; --off-bg:#382B1B; --dig:#4FC2AE; --dig-bg:#1A332F;
    --danger:#F0666B; --danger-bg:#3A2029;
    --head-bg:#20212D;
    --sh:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.4);
    --sh-pop:0 16px 50px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#15161E; --surface:#1C1D28; --surface-2:#22232F; --ink:#ECEDF4; --ink-soft:#C3C5D6; --muted:#8B8DA3; --faint:#5A5C74;
  --grid:#33344A; --grid-strong:#42435C;
  --brand:#7C9AFF; --brand-bg:#232A4A; --brand-soft:#1E2440;
  --off:#E0995C; --off-bg:#382B1B; --dig:#4FC2AE; --dig-bg:#1A332F;
  --danger:#F0666B; --danger-bg:#3A2029;
  --head-bg:#20212D;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.4);
  --sh-pop:0 16px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;font-size:13.5px;line-height:1.4;-webkit-font-smoothing:antialiased}
.disp{font-family:"Manrope",system-ui,sans-serif}
.mono,.num,input[type=number],input[type=date]{font-family:"JetBrains Mono",monospace;font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--grid-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

/* ===== shell ===== */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--grid);flex:0 0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.brand .mark{width:22px;height:22px;flex:0 0 auto}
.brand b{font-family:"Manrope";font-weight:800;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap}
.planname{font-family:"Manrope";font-weight:700;font-size:14.5px;border:1px solid transparent;border-radius:7px;padding:4px 8px;background:transparent;min-width:80px;max-width:280px}
.planname:hover{border-color:var(--grid-strong)}
.planname:focus{border-color:var(--brand);background:var(--surface-2)}
.savestat{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.savestat .dot{width:6px;height:6px;border-radius:50%;background:var(--dig)}
.spacer{flex:1}
.tbtn{border:1px solid var(--grid-strong);background:var(--surface);border-radius:8px;padding:6px 11px;font-weight:600;font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn:hover{background:var(--surface-2)}
.tbtn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.tbtn.pri:hover{filter:brightness(1.08)}
.tbtn.danger{color:var(--danger);border-color:var(--danger-bg)}
.tbtn.danger:hover{background:var(--danger-bg)}
.tbtn svg{width:13px;height:13px}
.toolgrp{display:flex;gap:6px;align-items:center}

/* ===== step tabs (Critérios / Alocação / Coerência) ===== */
.stepbar{display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--grid);flex:0 0 auto;padding:0 12px}
.step{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:11px 16px;font-weight:700;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.step.on{color:var(--ink);border-bottom-color:var(--brand)}
.step:hover{color:var(--ink)}
.step .n{width:18px;height:18px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:10.5px;display:grid;place-items:center;flex:0 0 auto}
.step.on .n{background:var(--brand);color:#fff}
.step .warncount{background:var(--danger);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1px 6px}
.step .okcheck{color:var(--dig);font-size:13px}

/* ===== visão de critérios / coerência ===== */
.stepview{flex:1;overflow:auto;background:var(--surface);padding:22px 26px 60px;display:none}
.stepview.show{display:block}
.stepview .wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.critcard{border:1px solid var(--grid);border-radius:12px;padding:16px 18px;background:var(--surface-2)}
.critcard h3{margin:0 0 4px;font-family:"Manrope";font-size:14.5px;font-weight:800}
.critcard .f{margin-top:12px}
.critcard .f:first-child{margin-top:0}
.critcard .f label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
.critcard .f input[type=text],.critcard .f input:not([type]){width:100%;border:1px solid var(--grid-strong);border-radius:9px;padding:9px 11px;font-size:13.5px;background:var(--surface);color:var(--ink)}
.ib{border:1px solid var(--grid-strong);background:var(--surface);color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:15px;line-height:1;flex:0 0 auto}
.ib:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bg)}
.critcard .desc{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.funilrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.funilfield{background:var(--surface);border:1px solid var(--grid-strong);border-radius:9px;padding:8px 10px}
.funilfield label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.funilfield input{width:100%;border:0;background:transparent;font-size:16px;font-weight:800;color:var(--ink);font-family:"JetBrains Mono",monospace}
.funilsum{margin-top:9px;font-size:12px;font-weight:700}
.funilsum.ok{color:var(--dig)} .funilsum.bad{color:var(--danger)}
.chiprow{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--grid-strong);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.chip.on{border-color:var(--brand);background:var(--brand-bg);color:var(--brand)}
.radiorow{display:flex;flex-direction:column;gap:8px}
.radiocard{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--grid-strong);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.radiocard.on{border-color:var(--brand);background:var(--brand-bg)}
.radiocard input{margin-top:3px}
.radiocard .rt{font-weight:700;font-size:13px}
.radiocard .rd{font-size:11.5px;color:var(--muted);margin-top:2px}
.critrow2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.critselect{width:100%;border:1px solid var(--grid-strong);border-radius:9px;padding:9px 11px;font-size:13.5px;background:var(--surface);color:var(--ink)}
.critdate{width:100%;border:1px solid var(--grid-strong);border-radius:9px;padding:8px 10px;font-size:13px;background:var(--surface);color:var(--ink);font-family:"JetBrains Mono",monospace}

.checkcard{border:1px solid var(--grid);border-radius:12px;overflow:hidden}
.checkhead{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;background:var(--surface-2)}
.checkicon{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.checkicon.ok{background:var(--dig)} .checkicon.warn{background:var(--danger)} .checkicon.na{background:var(--faint)}
.checkbody h4{margin:0 0 3px;font-family:"Manrope";font-size:14px;font-weight:800}
.checkbody p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.justif{padding:0 16px 14px}
.justif label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:10px 0 6px}
.justif textarea{width:100%;border:1px solid var(--grid-strong);border-radius:9px;padding:9px 11px;font-size:13px;background:var(--surface);color:var(--ink);min-height:56px;resize:vertical}
.incomplete{text-align:center;color:var(--muted);padding:60px 20px}
.incomplete b{display:block;font-family:"Manrope";color:var(--ink);font-size:15px;margin-bottom:6px}

/* ===== info strip (briefing como cabeçalho de planilha) ===== */
.infostrip{display:grid;grid-template-columns:1.1fr 1fr 1fr .8fr .8fr 1.4fr 1.4fr;border-bottom:1px solid var(--grid);background:var(--head-bg);flex:0 0 auto}
.icell{border-right:1px solid var(--grid);padding:6px 10px;min-width:0}
.icell:last-child{border-right:0}
.icell label{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.icell input,.icell textarea{width:100%;border:0;background:transparent;padding:1px 0;font-size:13px;color:var(--ink);font-weight:600;resize:none}
.icell textarea{font-weight:500;font-size:12.5px;height:34px;line-height:1.35;font-family:inherit}
.icell input:focus,.icell textarea:focus{outline:0;background:var(--surface)}
.icell.money input{font-family:"JetBrains Mono",monospace}

/* ===== grid principal ===== */
.gridwrap{flex:1;overflow:auto;background:var(--surface);padding:0 0 24px}
.sheetsummary{padding:12px 16px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--grid)}
.sheetsummary b{color:var(--ink);font-family:"JetBrains Mono",monospace}
.sheetgroup{margin-top:18px}
.sheetgroup:first-of-type{margin-top:8px}
.sheetgrouphead{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:12px;color:var(--muted);font-weight:600}
.sheetgrouphead .sp{flex:1}
.sheetgrouphead b{font-family:"JetBrains Mono",monospace;color:var(--ink);font-size:13px}
.addcatrow{display:flex;align-items:center;gap:9px;padding:16px;flex-wrap:wrap}
.addcatrow label{font-size:12px;color:var(--muted);font-weight:600}
.addcatrow select{border:1px solid var(--grid-strong);border-radius:8px;padding:7px 10px;font-size:13px;background:var(--surface);color:var(--ink)}
table.sheet{border-collapse:collapse;width:100%;min-width:1180px}
table.sheet thead th{position:sticky;top:0;background:var(--head-bg);z-index:2;border-bottom:1px solid var(--grid-strong);border-right:1px solid var(--grid);padding:7px 9px;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
table.sheet thead th.num{text-align:right}
table.sheet thead th.rownum{width:34px;text-align:center;background:var(--head-bg)}
table.sheet tbody td{border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);padding:0;vertical-align:middle;height:34px}
table.sheet tbody tr:hover td{background:var(--surface-2)}
table.sheet tbody tr.late td{background:var(--danger-bg)}
td.rownum{text-align:center;color:var(--faint);font-size:11px;background:var(--head-bg);user-select:none}
.cellsel{width:100%;height:100%;border:0;background:transparent;padding:0 8px;font-size:13px;color:var(--ink);cursor:pointer;appearance:none;font-weight:500}
.cellsel:focus{outline:2px solid var(--brand);outline-offset:-2px;background:var(--surface)}
.cellinput{width:100%;height:100%;border:0;background:transparent;padding:0 8px;font-size:13px;color:var(--ink);text-align:right}
.cellinput.left{text-align:left}
.cellinput:focus{outline:2px solid var(--brand);outline-offset:-2px;background:var(--surface)}
td.result{padding:0 9px;text-align:right;font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
td.catcell{padding:0 8px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.badge .d{width:5px;height:5px;border-radius:50%}
.badge.topo{background:var(--brand-bg);color:var(--topo)} .badge.topo .d{background:var(--topo)}
.badge.meio{background:var(--dig-bg);color:var(--meio)} .badge.meio .d{background:var(--meio)}
.badge.fundo{background:#FAEAEF;color:var(--fundo)} .badge.fundo .d{background:var(--fundo)}
.badge.retencao{background:#FBF1E2;color:var(--ret)} .badge.retencao .d{background:var(--ret)}
.badge.off{background:var(--off-bg);color:var(--off)}
.badge.dig{background:var(--dig-bg);color:var(--dig)}
td.benchcell{padding:0 8px}
.benchbtn{border:1px dashed var(--grid-strong);background:transparent;border-radius:7px;padding:3px 8px;font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace;white-space:nowrap}
.benchbtn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
td.delcell{width:64px;text-align:center;white-space:nowrap}
.rmbtn:disabled{opacity:.3;cursor:not-allowed}
.rmbtn{border:0;background:transparent;color:var(--faint);width:26px;height:26px;border-radius:6px;font-size:15px;line-height:1;visibility:hidden}
tr:hover .rmbtn{visibility:visible}
.rmbtn:hover{background:var(--danger-bg);color:var(--danger)}
tr.addrow td{border-right:0;padding:0}
.addrowbtn{width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--brand)}
.addrowbtn:hover{background:var(--brand-soft)}
tfoot td{position:sticky;bottom:0;background:var(--head-bg);border-top:1px solid var(--grid-strong);border-right:1px solid var(--grid);padding:8px 9px;font-size:11.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
tfoot td.num{text-align:right}

/* ===== barra de status (rodapé estilo planilha) ===== */
.statusbar{flex:0 0 auto;display:flex;align-items:center;gap:0;background:var(--surface);border-top:1px solid var(--grid);overflow-x:auto}
.stat{padding:8px 16px;border-right:1px solid var(--grid);font-size:11.5px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.stat b{font-family:"JetBrains Mono",monospace;color:var(--ink);font-size:12.5px;font-weight:700}

/* ===== abas de planos (sheet tabs) ===== */
.tabs{flex:0 0 auto;display:flex;align-items:stretch;background:var(--head-bg);border-top:1px solid var(--grid);overflow-x:auto}
.tab{display:flex;align-items:center;gap:7px;padding:8px 10px 8px 14px;border-right:1px solid var(--grid);font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;background:transparent;position:relative}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 2px 0 var(--brand)}
.tab:hover{background:var(--surface)}
.tab input{border:0;background:transparent;font:inherit;font-weight:700;color:inherit;width:auto;min-width:20px}
.tab input:focus{outline:0}
.tabx{border:0;background:transparent;color:var(--faint);width:18px;height:18px;border-radius:5px;font-size:13px;line-height:1;flex:0 0 auto}
.tabx:hover{background:var(--danger-bg);color:var(--danger)}
.addtab{border:0;background:transparent;color:var(--brand);font-weight:800;font-size:16px;padding:8px 14px;flex:0 0 auto}
.addtab:hover{background:var(--brand-soft)}

/* ===== painel de análise (slide-over) ===== */
.panelback{position:fixed;inset:0;background:rgba(20,22,35,.4);display:none;z-index:70}
.panelback.open{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--surface);box-shadow:var(--sh-pop);z-index:71;transform:translateX(100%);transition:.22s ease;display:flex;flex-direction:column}
.panel.open{transform:none}
.panel header{padding:16px 18px;border-bottom:1px solid var(--grid);display:flex;justify-content:space-between;align-items:center;flex:0 0 auto}
.panel header h3{margin:0;font-family:"Manrope";font-size:16px;font-weight:800}
.panel .x{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:19px}
.panel .x:hover{background:var(--surface-2)}
.panelbody{padding:16px 18px;overflow:auto;flex:1}
.panelbody h4{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 0 9px}
.panelbody h4:first-child{margin-top:0}
.barlist{display:flex;flex-direction:column;gap:9px}
.barrow .bl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.bl b{font-weight:700}
.bl span{color:var(--muted)}
.bartrack{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bartrack > i{display:block;height:100%;border-radius:99px}
.stack{height:20px;border-radius:99px;overflow:hidden;display:flex;background:var(--surface-2)}
.stack span{height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--ink-soft)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.tlrow{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;padding:5px 0}
.tlname{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tltrack{position:relative;height:16px;background:var(--surface-2);border-radius:99px}
.tlbar{position:absolute;top:2px;bottom:2px;border-radius:99px}
.hint{font-size:12px;color:var(--muted);line-height:1.5}

/* ===== modal glossário ===== */
.backdrop{position:fixed;inset:0;background:rgba(20,22,35,.45);display:none;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:80;overflow:auto}
.backdrop.open{display:flex}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:640px;box-shadow:var(--sh-pop)}
.modal header{padding:16px 20px 2px;display:flex;justify-content:space-between;align-items:center}
.modal header h3{margin:0;font-family:"Manrope";font-size:17px;font-weight:800}
.modal .x{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:20px;line-height:1}
.modal .x:hover{background:var(--surface-2)}
.gsearch{padding:12px 20px 0}
.gsearch input{width:100%;border:1px solid var(--grid-strong);border-radius:9px;padding:9px 12px;font-size:13.5px;background:var(--surface-2);color:var(--ink)}
.glossary{max-height:60vh;overflow:auto;padding:4px 20px 20px}
.gitem{padding:10px 0;border-bottom:1px solid var(--grid)}
.gitem:last-child{border-bottom:0}
.gitem b{font-family:"Manrope";font-size:13.5px}
.gitem p{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.5}

.toast{position:fixed;left:50%;bottom:70px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--sh-pop);z-index:90;opacity:0;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{margin:40px auto;max-width:420px;text-align:center;color:var(--muted)}
.empty .em{font-family:"Manrope";color:var(--ink);font-weight:800;font-size:18px;margin-bottom:6px}
.empty button{margin-top:14px;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:9px 16px;font-weight:700;font-size:13.5px}

#printReport{display:none}
@media print{
  .app,.backdrop,.panelback,.panel{display:none!important}
  #printReport{display:block}
  body{background:#fff;color:#111}
}
.pr-page{max-width:800px;margin:0 auto;font-family:"Inter",sans-serif;color:#111;padding:0 8px}

// soma a população das praças declaradas no briefing (nacional, regiões e/ou estados específicos).
// Selecionar "Nacional" junto de outras praças é redundante (o nacional já as inclui) — o aluno decide.
function populacaoDasPracas(c){
  if(!c.pracas||!c.pracas.length) return 0;
  let total=0;
  c.pracas.forEach(pr=>{
    const [tipo,key]=pr.split(":");
    if(tipo==="nacional") total+=POPULACAO_BR.nacional;
    else if(tipo==="regiao") total+=POPULACAO_BR.regioes[key]||0;
    else if(tipo==="estado") total+=POPULACAO_BR.estados[key]||0;
  });
  return total;
}
// combina a penetração de múltiplos targets (primário/secundário/...) por independência estatística
// (mesma lógica do modelo de alcance/frequência) — soma sem duplicar além de 100%.
function combinedTargetPct(c){
  if(!c.targets||!c.targets.length) return 0;
  const complement=c.targets.reduce((prod,t)=>{ const tp=TARGET_PROFILES[t.key]; return prod*(1-(tp?tp.pct:0)); },1);
  return 1-complement;
}
function publicoEstimado(c){
  const pop=populacaoDasPracas(c); const pct=combinedTargetPct(c);
  if(!pop||!pct) return 0;
  return Math.round(pop*pct);
}

function programaRef(catKey, nome){
  const table=PROGRAMAS_REF[catKey]; if(!table||!nome) return null;
  const key=Object.keys(table).find(k=>k.toLowerCase()===String(nome).trim().toLowerCase());
  return key?table[key]:null;

// preenche horário, audiência, audiência no target e valor exato do programa a partir da rede+praça já
// escolhidas na linha — chamado tanto pelo botão quanto automaticamente quando praça/programa mudam.
function autoFillPrograma(line, catKey, criteria){
  if(!line.extra||!line.extra.programa) return false;
  const ref=programaRef(catKey, line.extra.programa); if(!ref) return false;
  line.extra.audienciaPct=ref.rating;
  if(!line.extra.horario) line.extra.horario=ref.horario;
  const pracaInfo=MERCADOS_TV[line.extra.praca];
  if(!pracaInfo) return true;
  const targetPct=combinedTargetPct(criteria);
  if(targetPct) line.extra.audienciaTarget=Math.round(pracaInfo.pop*targetPct*ref.rating/100);
  const valorExato=valorProgramaNaPraca(catKey, ref, line.extra.praca);
  if(valorExato!==null) line.custo=valorExato;
  if(line.extra.insercoes) line.verba=Math.round(line.custo*parseFloat(line.extra.insercoes)*100)/100;
  return true;
}
// valor exato do programa numa praça: escala o preço-base (calibrado pelo rating × multiplicador da rede,
// numa referência de São Paulo Capital) pela população relativa da praça — mesma lógica de tabelas reais,
// onde praças maiores custam proporcionalmente mais.
function valorProgramaNaPraca(catKey, ref, pracaKey){
  const mult = catKey==="tv" ? REDE_MULT_TV[ref.rede] : REDE_MULT_RADIO[ref.rede];
  if(!mult) return null;
  const valorBaseSP1 = ref.rating*mult;
  return escalaPorPraca(valorBaseSP1, pracaKey);
}
// escala qualquer valor de referência (calibrado em São Paulo Capital) pela população relativa da praça —
// a mesma lógica usada em tabelas reais de preço por mercado (praças maiores custam proporcionalmente mais).
function escalaPorPraca(valorBaseSP1, pracaKey){
  const praca=MERCADOS_TV[pracaKey]; const sp1=MERCADOS_TV.SP1;
  if(!praca||!sp1) return valorBaseSP1;
  return Math.round(valorBaseSP1*(praca.pop/sp1.pop)*100)/100;
}

  const veh=vehicle(line.veiculo); if(!veh) return false;
  const pen=PENETRACAO_VEICULO[veh.k]; if(pen===undefined) return false;
  if(!line.custo && BENCHNUM[veh.k]) line.custo=Math.round(((BENCHNUM[veh.k][0]+BENCHNUM[veh.k][1])/2)*100)/100;
  const pracaKey=line.extra&&line.extra.praca; if(!pracaKey) return true;
  const pop=REGIOES[pracaKey]!==undefined ? (pracaKey==="nacional"?POPULACAO_BR.nacional:POPULACAO_BR.regioes[pracaKey]) : null;
  if(!pop) return true;
  const targetPct=combinedTargetPct(criteria);
  if(targetPct) line.extra.audienciaTarget=Math.round(pop*targetPct*pen);
  return true;
}

function ensurePlanShape(p){
  if(!p.criteria) p.criteria=defaultCriteria();
  const dc=defaultCriteria();
  Object.keys(dc).forEach(k=>{ if(p.criteria[k]===undefined) p.criteria[k]=dc[k]; });
  if(typeof p.criteria.kpi==="string") p.criteria.kpi={topo:[],meio:[],fundo:[p.criteria.kpi],retencao:[]};
  Object.keys(FUNIL).forEach(stage=>{
    const v=p.criteria.kpi[stage];
    if(typeof v==="string") p.criteria.kpi[stage]=v?[v]:[];
    else if(!Array.isArray(v)) p.criteria.kpi[stage]=[];
  });
  if(!Array.isArray(p.criteria.picos)) p.criteria.picos=[];
  if(!Array.isArray(p.personas)) p.personas=[];
  if(!Array.isArray(p.criteria.targets)){
    p.criteria.targets = p.criteria.targetPrincipal ? [{id:uid(),papel:"primario",key:p.criteria.targetPrincipal}] : [];
  }
  if(!Array.isArray(p.criteria.pracas)) p.criteria.pracas=[];
  p.criteria.pracas = p.criteria.pracas.map(pr=>pr.includes(":")?pr:`regiao:${pr}`); // migra formato antigo (só chave de região)
  delete p.criteria.postura; delete p.criteria.competitiva; delete p.criteria.picoInicio; delete p.criteria.picoFim;
  delete p.criteria.targetPrincipal; delete p.criteria.recorte; delete p.criteria.estado;
  if(!p.justificativas) p.justificativas={};
  (p.lines||[]).forEach(l=>{
    if(!l.papel) l.papel=PAPEL_POR_FUNIL[l.funil]||"alcance";
    if(l.titulo===undefined) l.titulo="";
    if(!l.extra) l.extra={};
    if(!l.insercoesPorDia) l.insercoesPorDia={};
    if(!Array.isArray(l.targetIds)) l.targetIds=[];
    else l.targetIds=l.targetIds.filter(tid=>p.criteria.targets.some(t=>t.id===tid));
  });
  return p;
}

// GRP = audiência (rating % do universo da praça) × nº de inserções.
// TRP = audiência no target (em % da praça, calculada a partir da audiência no target já preenchida) × inserções —
// é o rating "de verdade" dentro do público-alvo, não uma normalização genérica.
function grpTrp(l){
  if(!(l.extra&&l.extra.audienciaPct&&l.extra.insercoes)) return null;
  const grp=parseFloat(l.extra.audienciaPct)*parseFloat(l.extra.insercoes);
  const pracaPop=(MERCADOS_TV[l.extra.praca]&&MERCADOS_TV[l.extra.praca].pop)||0;
  let trp=null;
  if(pracaPop && l.extra.audienciaTarget){
    const ratingNoTarget=parseFloat(l.extra.audienciaTarget)/pracaPop*100;
    trp=ratingNoTarget*parseFloat(l.extra.insercoes);
  }
  return {grp,trp};
}
function lineResult(l){
  const custo=parseFloat(l.custo)||0, verba=parseFloat(l.verba)||0;
  if(!custo || l.modelo==="FIXO") return {qty:null,label:RESLABEL[l.modelo]||""};
  const qty = l.modelo==="CPM" ? verba/custo*1000 : verba/custo;
  return {qty, label:RESLABEL[l.modelo]||""};
}
function planTotals(p){
  const totalVerba=p.lines.reduce((s,l)=>s+(parseFloat(l.verba)||0),0);
  const byCat={}, byFunil={}, byClass={off:0,dig:0}, byRegiao={};
  let impressoes=0, cliques=0, views=0, conversoes=0;
  p.lines.forEach(l=>{
    const v=vehicle(l.veiculo); if(!v) return;
    const c=catInfo(v.cat);
    const verba=parseFloat(l.verba)||0;
    byCat[v.cat]=(byCat[v.cat]||0)+verba;
    byFunil[l.funil]=(byFunil[l.funil]||0)+verba;
    byClass[c.cls]=(byClass[c.cls]||0)+verba;
    if(l.extra&&l.extra.praca) byRegiao[l.extra.praca]=(byRegiao[l.extra.praca]||0)+verba;
    const r=lineResult(l);
    if(r.qty){
      if(l.modelo==="CPM") impressoes+=r.qty;
      else if(l.modelo==="CPC") cliques+=r.qty;
      else if(l.modelo==="CPV") views+=r.qty;
      else if(["CPA","CPL","CPI"].includes(l.modelo)) conversoes+=r.qty;
    }
  });
  return {totalVerba,byCat,byFunil,byClass,byRegiao,impressoes,cliques,views,conversoes};
}

// lista, em português, exatamente o que falta preencher nos critérios — usado tanto para travar a aba de
// Coerência quanto para mostrar ao aluno o que falta (em vez de um "complete os critérios" genérico).
function criteriaMissing(p){
  const c=p.criteria||{};
  const missing=[];
  const sum=Object.values(c.funil||{}).reduce((s,v)=>s+(parseFloat(v)||0),0);
  if(Math.abs(sum-100)>=0.5) missing.push(`a distribuição por funil precisa somar 100% (está em ${sum}%)`);
  if(!c.publico||!c.publico.length) missing.push("marque ao menos uma categoria em \"onde o público consome mídia\"");
  if(!c.pracas||!c.pracas.length) missing.push("adicione ao menos uma praça no briefing (etapa 0)");
  if(!c.targets||!c.targets.length||!c.targets.some(t=>t.papel==="primario"&&t.key)) missing.push("adicione ao menos um target primário (etapa 2)");
  else if(c.targets.some(t=>!t.key)) missing.push("selecione o target em todas as linhas de \"targets do plano\" que você adicionou");
  if(!(parseFloat(c.publicoTamanho)>0)) missing.push("praças e target precisam gerar uma população estimada maior que zero");
  if(!(parseFloat(c.coberturaAlvo)>0)) missing.push("informe a cobertura desejada (%)");
  if(!(parseFloat(c.freqMin)>0)) missing.push("informe a frequência efetiva mínima");
  if(!(parseFloat(c.freqMax)>0)) missing.push("informe a frequência efetiva máxima");
  if(!c.metaNumerica||!(parseFloat(c.metaNumerica.valor)>0)||!c.metaNumerica.unidade) missing.push("defina a meta numérica ligada ao objetivo, com valor e unidade (etapa 0)");
  if(!c.custoPostura) missing.push("declare a postura de custo do plano (etapa 0)");
  if(!c.kpi||!Object.values(c.kpi).every(v=>Array.isArray(v)&&v.length)) missing.push("escolha ao menos um KPI de sucesso para cada uma das 4 etapas do funil");
  if(c.timing!=="continuo"){
    if(!c.picos||!c.picos.length) missing.push("adicione ao menos um período de pico (você escolheu timing pulsado/concentrado)");
    else if(!c.picos.every(pc=>pc.inicio&&pc.fim)) missing.push("preencha início e fim de todos os períodos de pico adicionados");
  }
  return missing;
}
function criteriaComplete(p){ return criteriaMissing(p).length===0; }

// modelo simplificado de alcance/frequência para fins didáticos: assume distribuição de exposição
// tipo Poisson por linha (reach = 1 - e^-impressões/população) e combina canais por independência estatística.
// Não substitui pesquisa de audiência real — é uma aproximação para discutir o conceito em sala.
function reachFreq(p){
  const pop=parseFloat(p.criteria.publicoTamanho)||0;
  if(!pop) return null;
  let complement=1, totalImpEquiv=0;
  p.lines.forEach(l=>{
    let impEquiv=0;
    if(l.modelo==="CPM"){ const r=lineResult(l); if(r.qty) impEquiv=r.qty; }
    else if(l.modelo==="CPP"){ const r=lineResult(l); if(r.qty) impEquiv=r.qty/100*pop; }
    if(impEquiv>0){ totalImpEquiv+=impEquiv; complement*=(1-Math.min(1,1-Math.exp(-impEquiv/pop))); }
  });
  const reachPct=(1-complement)*100;
  const reachPeople=pop*(1-complement);
  const avgFreq=reachPeople>0? totalImpEquiv/reachPeople : 0;
  return {reachPct,reachPeople,avgFreq,totalImpEquiv,pop};
}
function computeChecks(p){
  const t=planTotals(p); const c=p.criteria||{};
  const checks=[];

  // 1) funil declarado x alocado
  if(t.totalVerba<=0 || !c.funil) checks.push({id:"funil",status:"na",title:"Distribuição por funil",detail:"Aloque verba nas linhas para comparar com o funil declarado."});
  else{
    const offenders=[];
    Object.keys(FUNIL).forEach(k=>{
      const declarado=parseFloat(c.funil[k])||0;
      const real=Math.round((t.byFunil[k]||0)/t.totalVerba*100);
      if(Math.abs(declarado-real)>15) offenders.push(`${FUNIL[k]}: declarou ${declarado}%, alocou ${real}%`);
    });
    checks.push(offenders.length
      ? {id:"funil",status:"warn",title:"Distribuição por funil",detail:"Divergência acima de 15 pontos percentuais entre o declarado e o alocado — "+offenders.join("; ")+"."}
      : {id:"funil",status:"ok",title:"Distribuição por funil",detail:"A alocação por etapa do funil está coerente com o que você planejou."});
  }

  // 2) canais aderentes ao público
  if(!c.publico||!c.publico.length || t.totalVerba<=0) checks.push({id:"publico",status:"na",title:"Aderência ao público",detail:"Selecione os canais de consumo do público e aloque verba para checar."});
  else{
    let foraVerba=0; const foraCats=new Set();
    p.lines.forEach(l=>{ const v=vehicle(l.veiculo); if(!v) return; if(!c.publico.includes(v.cat)){ foraVerba+=parseFloat(l.verba)||0; foraCats.add(catInfo(v.cat).label); } });
    const pctFora=Math.round(foraVerba/t.totalVerba*100);
    checks.push(pctFora>30
      ? {id:"publico",status:"warn",title:"Aderência ao público",detail:`${pctFora}% da verba está em categorias que você não marcou como consumidas pelo público (${[...foraCats].join(", ")}).`}
      : {id:"publico",status:"ok",title:"Aderência ao público",detail:"A maior parte da verba está nos canais que você indicou como consumidos pelo público-alvo."});
  }

  // 3) timing / flighting — agora aceita múltiplos picos
  if(c.timing==="continuo") checks.push({id:"timing",status:"ok",title:"Timing de veiculação",detail:"Veiculação contínua não exige concentração de verba em períodos específicos."});
  else if(!c.picos||!c.picos.length||c.picos.some(pc=>!pc.inicio||!pc.fim)) checks.push({id:"timing",status:"warn",title:"Timing de veiculação",detail:"Você escolheu um cronograma pulsado/concentrado, mas não definiu todos os períodos de pico."});
  else{
    const matched=new Set();
    p.lines.forEach(l=>{
      if(!l.inicio||!l.fim) return;
      const li=new Date(l.inicio+"T00:00:00"), lf=new Date(l.fim+"T00:00:00");
      const emAlgumPico=c.picos.some(pc=>{ const pi=new Date(pc.inicio+"T00:00:00"), pf=new Date(pc.fim+"T00:00:00"); return li<=pf && lf>=pi; });
      if(emAlgumPico) matched.add(l.id);
    });
    const dentro=p.lines.filter(l=>matched.has(l.id)).reduce((s,l)=>s+(parseFloat(l.verba)||0),0);
    const pct = t.totalVerba? Math.round(dentro/t.totalVerba*100):0;
    const periodos=c.picos.map(pc=>`${fmtd(pc.inicio)}–${fmtd(pc.fim)}`).join(", ");
    checks.push(pct<45
      ? {id:"timing",status:"warn",title:"Timing de veiculação",detail:`Só ${pct}% da verba está concentrada nos ${c.picos.length} período(s) de pico definidos (${periodos}).`}
      : {id:"timing",status:"ok",title:"Timing de veiculação",detail:`${pct}% da verba está concentrada nos período(s) de pico declarados (${periodos}).`});
  }

  // 4) kpi de sucesso por etapa do funil x modelo de compra dominante na etapa
  if(!c.kpi || t.totalVerba<=0) checks.push({id:"kpi",status:"na",title:"KPI de sucesso por etapa",detail:"Defina o KPI de cada etapa do funil e aloque verba para checar."});
  else{
    const offenders=[];
    Object.keys(FUNIL).forEach(stage=>{
      const stageLines=p.lines.filter(l=>l.funil===stage);
      const stageVerba=stageLines.reduce((s,l)=>s+(parseFloat(l.verba)||0),0);
      const kpisStage=c.kpi[stage]||[];
      if(stageVerba<=0 || !kpisStage.length) return;
      const byModelo={};
      stageLines.forEach(l=>{ byModelo[l.modelo]=(byModelo[l.modelo]||0)+(parseFloat(l.verba)||0); });
      const dominante=Object.entries(byModelo).sort((a,b)=>b[1]-a[1])[0];
      const esperado=[...new Set(kpisStage.flatMap(k=>KPI_OPTS[k].modelos))];
      const labels=kpisStage.map(k=>KPI_OPTS[k].label).join(" + ");
      if(dominante && !esperado.includes(dominante[0])) offenders.push(`${FUNIL[stage]}: KPIs "${labels}" mas modelo dominante é ${MODELO[dominante[0]]}`);
    });
    checks.push(offenders.length
      ? {id:"kpi",status:"warn",title:"KPI de sucesso por etapa",detail:"Divergência entre KPI e modelo de compra: "+offenders.join("; ")+"."}
      : {id:"kpi",status:"ok",title:"KPI de sucesso por etapa",detail:"O modelo de compra dominante de cada etapa é coerente com o KPI escolhido para ela."});
  }

  // 7) cobertura do target
  const rf=reachFreq(p);
  if(!rf || t.totalVerba<=0 || !c.coberturaAlvo) checks.push({id:"cobertura",status:"na",title:"Cobertura do target",detail:"Informe o tamanho do público-alvo e a cobertura desejada, e aloque verba em linhas de CPM/CPP para estimar."});
  else{
    const declarado=parseFloat(c.coberturaAlvo);
    const diff=rf.reachPct-declarado;
    checks.push(Math.abs(diff)>10
      ? {id:"cobertura",status:"warn",title:"Cobertura do target",detail:`Cobertura estimada de ${rf.reachPct.toFixed(1)}% do público (${num(rf.reachPeople)} pessoas), contra os ${declarado}% desejados — estimativa simplificada por sobreposição estatística entre canais de CPM/CPP.`}
      : {id:"cobertura",status:"ok",title:"Cobertura do target",detail:`Cobertura estimada de ${rf.reachPct.toFixed(1)}% do público, próxima da meta de ${declarado}%.`});
  }

  // 8) frequência média efetiva
  if(!rf || t.totalVerba<=0 || !c.freqMin || !c.freqMax) checks.push({id:"frequencia",status:"na",title:"Frequência efetiva média",detail:"Informe a faixa de frequência desejada e aloque verba em linhas de CPM/CPP para estimar."});
  else{
    const min=parseFloat(c.freqMin), max=parseFloat(c.freqMax);
    checks.push(rf.avgFreq<min*0.8 || rf.avgFreq>max*1.2
      ? {id:"frequencia",status:"warn",title:"Frequência efetiva média",detail:`Frequência média estimada de ${rf.avgFreq.toFixed(1)}x, fora da faixa desejada de ${min}x–${max}x. Muito abaixo pode não gerar lembrança; muito acima costuma indicar saturação/desperdício de verba.`}
      : {id:"frequencia",status:"ok",title:"Frequência efetiva média",detail:`Frequência média estimada de ${rf.avgFreq.toFixed(1)}x, dentro da faixa desejada de ${min}x–${max}x.`});
  }

  // 9b) orçamento: alocado x verba total do plano
  if(!(parseFloat(p.verba)>0)) checks.push({id:"orcamento",status:"na",title:"Uso do orçamento",detail:"Informe a verba total do plano (infostrip) para checar quanto já foi alocado."});
  else{
    const pctAlocado=t.totalVerba/parseFloat(p.verba)*100;
    if(pctAlocado<90) checks.push({id:"orcamento",status:"warn",title:"Uso do orçamento",detail:`Só ${pctAlocado.toFixed(0)}% da verba total foi alocada em linhas — ${money(parseFloat(p.verba)-t.totalVerba)} ainda sem destino.`});
    else if(pctAlocado>102) checks.push({id:"orcamento",status:"warn",title:"Uso do orçamento",detail:`O plano estourou o orçamento: ${pctAlocado.toFixed(0)}% da verba total, ${money(t.totalVerba-parseFloat(p.verba))} acima do previsto.`});
    else checks.push({id:"orcamento",status:"ok",title:"Uso do orçamento",detail:`${pctAlocado.toFixed(0)}% da verba total está alocada em linhas.`});
  }

  // 9c) postura de custo declarada x preço efetivamente pago frente ao benchmark de mercado
  if(!c.custoPostura) checks.push({id:"custo",status:"na",title:"Postura de custo",detail:"Declare a postura de custo do plano (etapa 0 dos critérios) para checar."});
  else{
    let somaPos=0, somaVerba=0;
    p.lines.forEach(l=>{
      const v=vehicle(l.veiculo); if(!v||!BENCHNUM[v.k]) return;
      const custo=parseFloat(l.custo), verba=parseFloat(l.verba)||0;
      if(!(custo>0)||!verba) return;
      const [min,max]=BENCHNUM[v.k]; if(max<=min) return;
      const pos=Math.max(0,Math.min(1,(custo-min)/(max-min)));
      somaPos+=pos*verba; somaVerba+=verba;
    });
    if(!somaVerba) checks.push({id:"custo",status:"na",title:"Postura de custo",detail:"Nenhuma linha com custo e faixa de benchmark de mercado preenchidos ainda."});
    else{
      const posMedia=somaPos/somaVerba;
      const label={eficiencia:"Eficiência",premium:"Premium",misto:"Misto"}[c.custoPostura];
      if(c.custoPostura==="eficiencia"&&posMedia>0.65) checks.push({id:"custo",status:"warn",title:"Postura de custo",detail:`Você declarou postura "${label}", mas o custo médio ponderado está no ${(posMedia*100).toFixed(0)}º percentil da faixa de mercado — pagando na faixa alta apesar de buscar eficiência.`});
      else if(c.custoPostura==="premium"&&posMedia<0.35) checks.push({id:"custo",status:"warn",title:"Postura de custo",detail:`Você declarou postura "${label}", mas o custo médio ponderado está no ${(posMedia*100).toFixed(0)}º percentil da faixa de mercado — próximo do piso de preço, o que pode não sustentar um posicionamento premium.`});
      else checks.push({id:"custo",status:"ok",title:"Postura de custo",detail:`Custo médio ponderado no ${(posMedia*100).toFixed(0)}º percentil da faixa de mercado, coerente com a postura "${label}" declarada.`});
    }
  }

  // 9d) share of voice frente à concorrência (opcional — depende de dado que o aluno/professor precisa levantar)
  if(!(parseFloat(c.sovAlvo)>0)||!(parseFloat(c.verbaConcorrencia)>0)) checks.push({id:"sov",status:"na",title:"Share of voice",detail:"Informe o SOV desejado e a verba estimada da concorrência (etapa 0) para checar — dado opcional, depende de pesquisa externa."});
  else{
    const sovReal=t.totalVerba/(t.totalVerba+parseFloat(c.verbaConcorrencia))*100;
    const alvo=parseFloat(c.sovAlvo);
    checks.push(Math.abs(sovReal-alvo)>10
      ? {id:"sov",status:"warn",title:"Share of voice",detail:`SOV estimado de ${sovReal.toFixed(1)}% frente à concorrência, contra os ${alvo}% desejados.`}
      : {id:"sov",status:"ok",title:"Share of voice",detail:`SOV estimado de ${sovReal.toFixed(1)}%, próximo da meta de ${alvo}%.`});
  }

  // 9e) meta numérica ligada ao objetivo — só valida automaticamente quando a unidade é conversão/lead direto
  const meta=c.metaNumerica;
  if(!meta||!(parseFloat(meta.valor)>0)||!meta.unidade) checks.push({id:"meta",status:"na",title:"Meta numérica do objetivo",detail:"Defina a meta numérica do objetivo (etapa 0 dos critérios) para acompanhar."});
  else{
    const unidadeLc=meta.unidade.toLowerCase();
    const ehConversaoDireta=/venda|lead|convers/.test(unidadeLc);
    const stageLines=p.lines.filter(l=>l.funil===meta.etapa&&(l.modelo==="CPA"||l.modelo==="CPL"));
    if(!ehConversaoDireta||!stageLines.length){
      checks.push({id:"meta",status:"na",title:"Meta numérica do objetivo",detail:`Meta declarada: ${num(meta.valor)} ${esc(meta.unidade)} em ${FUNIL[meta.etapa]}. Como a unidade não é uma conversão direta calculável pelo sistema (ou não há linhas de CPA/CPL nessa etapa), essa meta precisa ser avaliada qualitativamente por você e pelo professor — o sistema não estima isso sozinho.`});
    }else{
      const totalEstimado=stageLines.reduce((s,l)=>s+(lineResult(l).qty||0),0);
      const metaValor=parseFloat(meta.valor);
      checks.push(totalEstimado<metaValor*0.7
        ? {id:"meta",status:"warn",title:"Meta numérica do objetivo",detail:`As linhas de conversão direta em ${FUNIL[meta.etapa]} estimam ${num(totalEstimado)} ${esc(meta.unidade)}, abaixo da meta de ${num(metaValor)}.`}
        : totalEstimado>metaValor*1.5
        ? {id:"meta",status:"warn",title:"Meta numérica do objetivo",detail:`As linhas de conversão direta em ${FUNIL[meta.etapa]} estimam ${num(totalEstimado)} ${esc(meta.unidade)}, bem acima da meta de ${num(metaValor)} — vale reconferir se a meta ou a estimativa fazem sentido.`}
        : {id:"meta",status:"ok",title:"Meta numérica do objetivo",detail:`As linhas de conversão direta em ${FUNIL[meta.etapa]} estimam ${num(totalEstimado)} ${esc(meta.unidade)}, compatível com a meta de ${num(metaValor)}.`});
    }
  }

  // 9) papel dos veículos x etapa do funil — gaps de jornada
  if(t.totalVerba<=0) checks.push({id:"jornada",status:"na",title:"Jornada e papel dos veículos",detail:"Adicione linhas para checar se a jornada do público está coberta ponta a ponta."});
  else{
    const semConversao = (t.byFunil.fundo||0)>0 && !p.lines.some(l=>l.funil==="fundo" && l.papel==="conversao");
    const semAlcance = (t.byFunil.topo||0)>0 && !p.lines.some(l=>l.funil==="topo" && l.papel==="alcance");
    const gaps=[];
    if(semConversao) gaps.push("há verba no fundo de funil mas nenhuma linha com papel de Conversão/Resposta direta");
    if(semAlcance) gaps.push("há verba no topo de funil mas nenhuma linha com papel de Alcance/Cobertura");
    checks.push(gaps.length
      ? {id:"jornada",status:"warn",title:"Jornada e papel dos veículos",detail:"A jornada do público tem lacunas: "+gaps.join("; ")+"."}
      : {id:"jornada",status:"ok",title:"Jornada e papel dos veículos",detail:"Cada etapa do funil com verba alocada tem ao menos um veículo cumprindo o papel tático esperado."});
  }

  return checks;
}

/* ===================== render ===================== */
function render(){
  const p=curPlan();
  document.getElementById("planNameInput").value=p.nome;
  renderStepbar(p);
  document.getElementById("infostrip").style.display = viewMode==="alocacao" ? "grid" : "none";
  document.getElementById("gridwrap").style.display = viewMode==="alocacao" ? "block" : "none";
  document.getElementById("statusbar").style.display = viewMode==="alocacao" ? "flex" : "none";
  const sv=document.getElementById("stepview");
  if(viewMode==="alocacao"){
    sv.classList.remove("show");
    renderInfostrip(p); renderGrid(p); renderStatusbar(p);
  }else{
    sv.classList.add("show");
    if(viewMode==="criterios") renderCriterios(p);
    else if(viewMode==="persona") renderPersonas(p);
    else if(viewMode==="jornada") renderJornada(p);
    else renderCoerencia(p);
  }
  renderTabs();
}

function renderStepbar(p){
  const complete=criteriaComplete(p);
  const warnCount = complete ? computeChecks(p).filter(c=>c.status==="warn").length : null;
  const steps=[
    {k:"criterios",n:"1",label:"Critérios de planejamento",extra: complete?`<span class="okcheck">✓</span>`:""},
    {k:"persona",n:"2",label:"Persona"},
    {k:"alocacao",n:"3",label:"Alocação de verba"},
    {k:"jornada",n:"4",label:"Jornada e multicanalidade"},
    {k:"coerencia",n:"5",label:"Coerência do plano",extra: warnCount?`<span class="warncount">${warnCount}</span>`:(complete?`<span class="okcheck">✓</span>`:"")},
  ];
  document.getElementById("stepbar").innerHTML=steps.map(s=>`
    <button class="step ${viewMode===s.k?"on":""}" data-act="set-view" data-view="${s.k}"><span class="n">${s.n}</span>${s.label}${s.extra||""}</button>
  `).join("");
}

function renderInfostrip(p){
  document.getElementById("infostrip").innerHTML=`
    <div class="icell"><label>Cliente / Marca</label><input data-field="cliente" value="${esc(p.cliente)}" placeholder="—"></div>
    <div class="icell"><label>Objetivo</label><input data-field="objetivo" value="${esc(p.objetivo)}" placeholder="—"></div>
    <div class="icell"><label>Público-alvo</label><input data-field="publico" value="${esc(p.publico)}" placeholder="—"></div>
    <div class="icell"><label>Início</label><input type="date" data-field="inicio" value="${p.inicio||""}"></div>
    <div class="icell"><label>Fim</label><input type="date" data-field="fim" value="${p.fim||""}"></div>
    <div class="icell money"><label>Verba total (R$)</label><input type="number" min="0" step="100" data-field="verba" value="${p.verba||0}"></div>
    <div class="icell"><label>Cronograma</label><div id="tlmini" style="padding-top:2px"></div></div>
  `;
  document.querySelectorAll("[data-field]").forEach(el=>{
    el.addEventListener("change",()=>{
      let v=el.value; if(el.dataset.field==="verba") v=parseFloat(v)||0;
      p[el.dataset.field]=v; save(); render();
    });
  });
  renderMiniTimeline(p);
}
function renderMiniTimeline(p){
  const el=document.getElementById("tlmini"); if(!el) return;
  const dated=p.lines.filter(l=>l.inicio&&l.fim);
  if(!dated.length){ el.innerHTML=`<span style="font-size:11px;color:var(--faint)">sem datas nas linhas</span>`; return; }
  el.innerHTML=`<button class="tbtn" style="padding:3px 9px;font-size:11px" data-act="analytics">Ver cronograma →</button>`;
}

function renderCriterios(p){
  const c=p.criteria;
  const sum=Object.values(c.funil).reduce((s,v)=>s+(parseFloat(v)||0),0);
  const FUNCAO_FUNIL={topo:"Conhecimento de marca",meio:"Consideração / Engajamento",fundo:"Conversão / Venda",retencao:"Fidelização / Recompra"};
  const el=document.getElementById("stepview");
  el.innerHTML=`<div class="wrap">
    ${blockedMsg?`<div class="critcard" style="border-color:var(--warn,#D98A2B);background:rgba(217,138,43,.08)"><b>⚠ ${esc(blockedMsg)}</b></div>`:""}
    <div class="critcard">
      <h3>0. Briefing da campanha</h3>
      <div class="desc">As informações que vão nortear todo o plano — preencha antes de qualquer alocação.</div>
      <div class="critrow2">
        <div class="f"><label>Cliente / Marca</label><input data-field="cliente" value="${esc(p.cliente)}" placeholder="Ex.: Marca Exemplo"></div>
        <div class="f"><label>Objetivo da campanha</label><input data-field="objetivo" value="${esc(p.objetivo)}" placeholder="Ex.: gerar awareness de lançamento e conversão em e-commerce"></div>
      </div>
      <div class="f"><label>Persona / observações do público</label><input data-field="publico" value="${esc(p.publico)}" placeholder="Ex.: mulheres 18-35, classe ABC, interesse em moda"></div>
      <div class="f"><label>Praças da campanha</label>
        <div class="desc" style="margin-top:0">Adicione quantas praças forem necessárias — regiões e/ou estados específicos. A população de todas as praças somadas alimenta a estimativa de público (etapa 2).</div>
        <div class="chiprow" style="margin-bottom:9px">${c.pracas.map(pr=>{
          const [tipo,key]=pr.split(":");
          const label = tipo==="nacional"?"Nacional (Brasil todo)":tipo==="regiao"?REGIOES[key]:`${ESTADOS[key]} (${key})`;
          return `<button class="chip on" data-act="del-praca" data-key="${pr}">${esc(label)} ×</button>`;
        }).join("")||`<span class="hint">Nenhuma praça adicionada ainda.</span>`}</div>
        <div style="display:flex;gap:8px">
          <select class="critselect" id="pracaAddSelect">
            <option value="nacional:BR">Nacional (Brasil todo)</option>
            <optgroup label="Regiões">${Object.entries(REGIOES).filter(([k])=>k!=="nacional").map(([k,v])=>`<option value="regiao:${k}">${esc(v)}</option>`).join("")}</optgroup>
            <optgroup label="Estados">${Object.entries(ESTADOS).map(([k,v])=>`<option value="estado:${k}">${esc(v)} (${k})</option>`).join("")}</optgroup>
          </select>
          <button class="tbtn pri" data-act="add-praca">+ Adicionar</button>
        </div>
      </div>
      <div class="critrow2" style="margin-top:14px">
        <div class="f"><label>Meta numérica ligada ao objetivo</label><input type="number" min="0" step="any" data-meta="valor" value="${esc(c.metaNumerica.valor)}" placeholder="Ex.: 5000"></div>
        <div class="f"><label>Unidade da meta</label><input data-meta="unidade" value="${esc(c.metaNumerica.unidade)}" placeholder="Ex.: vendas, leads, % de lembrança de marca"></div>
      </div>
      <div class="f"><label>Essa meta pertence a qual etapa do funil?</label>
        <select class="critselect" data-meta="etapa">${Object.entries(FUNIL).map(([k,label])=>`<option value="${k}" ${c.metaNumerica.etapa===k?"selected":""}>${label}</option>`).join("")}</select>
      </div>
      <div class="desc" style="margin-top:2px">Todo plano parte de um número concreto, não só de uma intenção. Se o objetivo é "gerar awareness", quantas pessoas devem lembrar da marca? Se é "vender", quantas vendas? Sem esse número, não dá pra saber depois se o plano funcionou.</div>
      <div class="critrow2" style="margin-top:14px">
        <div class="f"><label>Postura de custo do plano</label>
          <select class="critselect" data-crit="custoPostura">
            <option value="">Selecione...</option>
            <option value="eficiencia" ${c.custoPostura==="eficiencia"?"selected":""}>Eficiência — priorizar o menor custo por resultado</option>
            <option value="premium" ${c.custoPostura==="premium"?"selected":""}>Premium — aceitar pagar mais por contexto/qualidade</option>
            <option value="misto" ${c.custoPostura==="misto"?"selected":""}>Misto — parte eficiência, parte premium</option>
          </select>
        </div>
        <div></div>
      </div>
      <div class="critrow2">
        <div class="f"><label>Share of voice desejado (%) — opcional</label><input type="number" min="0" max="100" class="critdate" data-crit="sovAlvo" value="${c.sovAlvo||""}" placeholder="ex.: 20"></div>
        <div class="f"><label>Verba estimada da concorrência no período (R$) — opcional</label><input type="number" min="0" step="1000" class="critdate" data-crit="verbaConcorrencia" value="${c.verbaConcorrencia||""}" placeholder="ex.: 400000"></div>
      </div>
      <div class="desc" style="margin-top:2px">Se você tiver uma estimativa (pesquisada ou dada em sala) do investimento da concorrência, o sistema calcula seu share of voice real e compara com o desejado — mídia não existe no vácuo, existe frente a quem disputa a mesma atenção.</div>
    </div>

    <div class="critcard">
      <h3>1. Distribuição por etapa do funil</h3>
      <div class="desc">Antes de escolher qualquer veículo, decida quanto da verba faz sentido em cada etapa para o objetivo do plano. Os quatro campos devem somar 100%.</div>
      <div class="funilrow">
        ${Object.entries(FUNILFULL).map(([k,label])=>`
          <div class="funilfield"><label>${label.split(" (")[0]} <small style="display:block;font-weight:500;text-transform:none;color:var(--faint)">${FUNCAO_FUNIL[k]}</small></label><input type="number" min="0" max="100" data-crit="funil.${k}" value="${c.funil[k]}"></div>
        `).join("")}
      </div>
      <div class="funilsum ${Math.abs(sum-100)<0.5?"ok":"bad"}">Soma atual: ${sum}% ${Math.abs(sum-100)<0.5?"✓":"— precisa somar 100%"}</div>
    </div>

    <div class="critcard">
      <h3>2. Target, cobertura e frequência</h3>
      <div class="desc">Adicione um ou mais targets no formato clássico de mídia (ex.: AS AB 25+) — primário, secundário etc. O sistema soma a população das praças (etapa 0) e combina a penetração de todos os targets para estimar o público. Cobertura e frequência desejadas ficam por sua conta.</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px">
        ${c.targets.map((t,i)=>`<div class="critrow2" style="align-items:end">
          <div class="f"><label>Papel</label><select class="critselect" data-target="${i}.papel"><option value="primario" ${t.papel==="primario"?"selected":""}>Primário</option><option value="secundario" ${t.papel==="secundario"?"selected":""}>Secundário</option><option value="terciario" ${t.papel==="terciario"?"selected":""}>Terciário</option></select></div>
          <div class="f" style="display:flex;gap:8px;align-items:end"><div style="flex:1"><label>Target</label><select class="critselect" data-target="${i}.key"><option value="">Selecione...</option>${Object.entries(TARGET_PROFILES).map(([k,v])=>`<option value="${k}" ${t.key===k?"selected":""}>${esc(v.label)}</option>`).join("")}</select></div><button class="ib" data-act="del-target" data-idx="${i}" title="Remover target" style="margin-bottom:1px">×</button></div>
        </div>`).join("")}
        <button class="tbtn" data-act="add-target" style="align-self:flex-start">+ Adicionar target</button>
      </div>
      <div class="hint" style="margin:8px 0">${publicoEstimado(c)>0 ? `População estimada no target: <b style="color:var(--ink)">${num(publicoEstimado(c))} pessoas</b> (${num(populacaoDasPracas(c))} pessoas nas praças declaradas × ${(combinedTargetPct(c)*100).toFixed(1)}% de penetração combinada — estimativa didática)` : "Declare praças (etapa 0) e ao menos um target para estimar o público."}</div>
      <div class="critrow2">
        <div class="f"><label>Cobertura desejada (%)</label><input type="number" min="0" max="100" class="critdate" data-crit="coberturaAlvo" value="${c.coberturaAlvo||""}" placeholder="ex.: 55"></div>
        <div></div>
      </div>
      <div class="critrow2">
        <div class="f"><label>Frequência efetiva mínima</label><input type="number" min="0" step="0.5" class="critdate" data-crit="freqMin" value="${c.freqMin||""}" placeholder="ex.: 3"></div>
        <div class="f"><label>Frequência efetiva máxima</label><input type="number" min="0" step="0.5" class="critdate" data-crit="freqMax" value="${c.freqMax||""}" placeholder="ex.: 8"></div>
      </div>
    </div>

    <div class="critcard">
      <h3>3. Onde esse público realmente consome mídia</h3>
      <div class="desc">Marque as categorias de veículo que fazem sentido para o target escolhido. A etiqueta mostra a aderência estimada de cada categoria ao target (estimativa didática, não pesquisa real).</div>
      <div class="chiprow">${(()=>{
        const primario=(c.targets.find(t=>t.papel==="primario")||{}).key;
        return CATS.map(cat=>{
        const aff=affinityFor(cat.key, primario);
        const affLbl=aff?{alta:"● alta",media:"● média",baixa:"● baixa"}[aff]:"";
        const affColor=aff?{alta:"var(--dig)",media:"var(--ret)",baixa:"var(--faint)"}[aff]:"";
        return `<button class="chip ${c.publico.includes(cat.key)?"on":""}" data-act="toggle-cat" data-key="${cat.key}">${esc(cat.label)}${aff?` <small style="color:${affColor}">${affLbl}</small>`:""}</button>`;
        }).join("");
      })()}</div>
    </div>

function monthlyMap(p){
  const dated=p.lines.filter(l=>l.inicio&&l.fim);
  if(!dated.length) return null;
  let min=null,max=null;
  dated.forEach(l=>{ const di=new Date(l.inicio+"T00:00:00"), df=new Date(l.fim+"T00:00:00"); if(!min||di<min) min=di; if(!max||df>max) max=df; });
  const months=[];
  let cur=new Date(min.getFullYear(),min.getMonth(),1);
  const last=new Date(max.getFullYear(),max.getMonth(),1);
  while(cur<=last){
    const start=new Date(cur), end=new Date(cur.getFullYear(),cur.getMonth()+1,0);
    months.push({key:cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0"), label:cur.toLocaleDateString("pt-BR",{month:"short",year:"2-digit"}), start, end});
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  const rows=dated.slice().sort((a,b)=>{ const va=vehicle(a.veiculo), vb=vehicle(b.veiculo); return (va?va.cat:"").localeCompare(vb?vb.cat:""); }).map(l=>{
    const li=new Date(l.inicio+"T00:00:00"), lf=new Date(l.fim+"T00:00:00");
    const verba=parseFloat(l.verba)||0;
    const values={};
    const diasMap=l.insercoesPorDia||{};
    const totalInsercoesDia=Object.values(diasMap).reduce((s,n)=>s+n,0);
    if(totalInsercoesDia>0){
      // usa a grade real de inserções por dia (preenchida pelo aluno) em vez de prorateio linear
      months.forEach(m=>{ values[m.key]=0; });
      Object.entries(diasMap).forEach(([dayKey,n])=>{
        const d=new Date(dayKey+"T00:00:00");
        const mk=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
        if(values[mk]===undefined) values[mk]=0;
        values[mk]+=verba*(n/totalInsercoesDia);
      });
    }else{
      const totalLineDays=Math.max(1,Math.round((lf-li)/86400000)+1);
      months.forEach(m=>{
        const overlapStart=li>m.start?li:m.start;
        const overlapEnd=lf<m.end?lf:m.end;
        const overlapDays=Math.max(0,Math.round((overlapEnd-overlapStart)/86400000)+1);
        values[m.key]=verba*(overlapDays/totalLineDays);
      });
    }
    return {line:l, values};
  });
  const totals={}; months.forEach(m=>{ totals[m.key]=rows.reduce((s,r)=>s+r.values[m.key],0); });
  return {months,rows,totals};
}

function syncPersonas(p){
  if(!Array.isArray(p.personas)) p.personas=[];
  const ids=p.criteria.targets.map(t=>t.id);
  p.personas=p.personas.filter(per=>ids.includes(per.targetId));
  p.criteria.targets.forEach(t=>{
    if(!p.personas.some(per=>per.targetId===t.id)) p.personas.push(blankPersona(t.id));
    else{ const per=p.personas.find(x=>x.targetId===t.id); const blank=blankPersona(t.id); Object.keys(blank).forEach(k=>{ if(per[k]===undefined) per[k]=blank[k]; }); }
  });
}

      </table></div>` : `<div class="hint">Defina início e fim nas linhas (aba Alocação) para gerar o mapa mensal.</div>`}
    </div>

    <div class="critcard">
      <h3>Flowchart de veiculação</h3>
      <div class="desc">Visão semana a semana de quando cada ação está no ar — o formato clássico de flowchart de plano de mídia. Leia como multicanalidade real: o público deveria ser tocado por papéis diferentes em momentos diferentes, não pelo mesmo canal repetido.</div>
      ${tlHtml}
    </div>
  </div>`;
}

function renderGrid(p){

  }
  const optionsAllByCat=CATS.map(c=>{

  const groupHtml=groups.map(g=>{

        }else if(f.list){
          // datalist com os nomes de referência (programas filtrados por rede/emissora quando aplicável)
          let nomes=[];
          if(f.list==="tv"||f.list==="radio"){
            const rede=l.extra&&l.extra.emissora;
            nomes=Object.entries(PROGRAMAS_REF[f.list]||{}).filter(([,v])=>!rede||v.rede===rede).map(([n])=>n);
          }else if(f.list==="impresso") nomes=Object.keys(PUBLICACOES_REF);
          else if(f.list==="cinema") nomes=Object.keys(CINEMA_REF);
          else if(f.list==="ooh") nomes=Object.keys(OOH_REF);
          const dlId=`dl_${f.list}_${l.id}`;
          inp=`<input class="cellinput left" type="text" data-line="${l.id}" data-k="extra.${f.k}" value="${val}" placeholder="${esc(f.ph||"")}" list="${dlId}">
            <datalist id="${dlId}">${nomes.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>`;
        }else{
          inp=`<input class="cellinput left" type="${f.type||"text"}" ${f.step?`step="${f.step}"`:""} data-line="${l.id}" data-k="extra.${f.k}" value="${val}" placeholder="${esc(f.ph||"")}">`;
        }
        let btn="";
        if(f.list==="tv"||f.list==="radio"||f.list==="impresso"||f.list==="cinema"||f.list==="ooh"){
          const nome=l.extra&&l.extra[f.k];
          const ref = f.list==="tv"||f.list==="radio" ? programaRef(f.list,nome)
            : f.list==="impresso" ? publicacaoRef(nome)
            : f.list==="cinema" ? cinemaRef(nome)
            : oohRef(nome);
          const caption = f.list==="tv"||f.list==="radio" ? `preencher tudo (rating ${ref&&ref.rating}%)` : "preencher tudo automaticamente";
          if(ref){
            btn=`<button class="benchbtn" data-act="usar-audiencia-ref" data-id="${l.id}" title="Preencher audiência, valor e verba automaticamente">${caption}</button>`;
            if(!MERCADOS_TV[l.extra.praca]) btn+=`<div class="hint" style="font-size:10.5px;color:var(--danger)">selecione a praça para calcular audiência/valor</div>`;
          }else if(nome){
            btn=`<div class="hint" style="font-size:10.5px;color:var(--danger)">sem dado de referência p/ este nome — confira a grafia ou preencha os campos manualmente</div>`;
          }

        return `<td>${inp}${btn}</td>`;
      }).join("");
      return `<tr data-id="${l.id}">
        <td class="rownum">${idx}</td>
        <td class="catcell"><select class="cellsel" data-line="${l.id}" data-k="veiculo">${optionsAllByCat}</select></td>
        <td><input class="cellinput left" type="text" data-line="${l.id}" data-k="titulo" value="${esc(l.titulo||"")}" placeholder="Título da peça/ação"></td>
        <td>${p.criteria.targets.length?p.criteria.targets.map(t=>{
          const per=(p.personas||[]).find(x=>x.targetId===t.id);
          const nomeCurto=(per&&per.nome)?per.nome.split(" ")[0]:(t.papel==="primario"?"Primário":t.papel==="secundario"?"Secundário":"Terciário");
          return `<button class="chip ${((l.targetIds||[]).includes(t.id))?"on":""}" style="padding:3px 8px;font-size:10.5px;margin:1px" data-act="toggle-line-target" data-id="${l.id}" data-target="${t.id}" title="Persona alvo desta linha">${esc(nomeCurto)}</button>`;

        ${extraCells}
        <td><select class="cellsel" data-line="${l.id}" data-k="funil">${Object.entries(FUNIL).map(([k,v2])=>`<option value="${k}" ${l.funil===k?"selected":""}>${v2}</option>`).join("")}</select></td>
        <td><select class="cellsel" data-line="${l.id}" data-k="papel">${Object.entries(PAPEL).map(([k,v2])=>`<option value="${k}" ${l.papel===k?"selected":""}>${v2.split(" / ")[0]}</option>`).join("")}</select></td>

        <td class="benchcell">${BENCHNUM[v.k]?`<button class="benchbtn" data-act="usar-bench" data-id="${l.id}" title="Preencher com a média da faixa de mercado">${money(BENCHNUM[v.k][0])}–${money(BENCHNUM[v.k][1])}</button>`:`<span class="hint" style="font-size:11px">${esc(v.bench)}</span>`}</td>
        <td>
          <input class="cellinput" type="number" min="0" step="10" data-line="${l.id}" data-k="verba" value="${l.verba||""}" placeholder="0">
          ${(l.extra&&l.extra.insercoes&&l.custo)?`<button class="benchbtn" data-act="usar-insercoes" data-id="${l.id}" title="Verba = custo unitário × nº de inserções">= ${l.extra.insercoes}× ${money(l.custo)}</button>`:""}
        </td>
        <td class="result">${r.qty?num(r.qty)+" "+r.label:(l.modelo==="FIXO"?"pacote fechado":"—")}${(l.extra&&l.extra.audienciaTarget&&l.custo)?`<div class="hint" style="font-size:10.5px;margin-top:2px">CPM real: ${money(l.custo/l.extra.audienciaTarget*1000)}</div>`:""}${(()=>{ const gt=grpTrp(l); return gt?`<div class="hint" style="font-size:10.5px;margin-top:2px">GRP ${gt.grp.toFixed(1)}${gt.trp!==null?` · TRP ${gt.trp.toFixed(1)}`:""}</div>`:""; })()}</td>
        <td><input class="cellinput left" type="date" data-line="${l.id}" data-k="inicio" value="${l.inicio||""}"></td>
        <td><input class="cellinput left" type="date" data-line="${l.id}" data-k="fim" value="${l.fim||""}"></td>

          <button class="rmbtn" data-act="grade-dias" data-id="${l.id}" title="Grade de inserções por dia" ${(!l.inicio||!l.fim)?"disabled":""}>📅</button>

        </td>
      </tr>`;
    }).join("");
    const totalCols=14+extraFields.length; // rownum,veiculo,titulo,personas,extras...,funil,papel,modelo,custo,ref,verba,resultado,inicio,fim,ações
    return `<div class="sheetgroup">
      <div class="sheetgrouphead"><span class="badge ${g.cat.cls}">${esc(g.cat.label)}</span><span>${g.lines.length} ${g.lines.length===1?"linha":"linhas"}</span><span class="sp"></span><b>${money(subtotal)}</b></div>
      <table class="sheet">
        <thead><tr>
          <th class="rownum">#</th><th>Veículo</th><th>Título da ação</th><th>Persona(s)</th>${extraFields.map(f=>`<th>${esc(f.label)}</th>`).join("")}
          <th>Funil</th><th>Papel</th><th>Modelo</th>
          <th class="num">Custo unit.</th><th>Ref. mercado</th><th class="num">Verba</th><th class="num">Resultado est.</th>
          <th>Início</th><th>Fim</th><th></th>

        <tbody>${rows}</tbody>
        <tbody><tr class="addrow"><td colspan="${totalCols}"><button class="addrowbtn" data-act="add-line" data-veiculo="${VEHICLES.find(v=>v.cat===g.cat.key).k}">+ Adicionar linha em ${esc(g.cat.label)}</button></td></tr></tbody>
      </table>

  const t=planTotals(p);
  el.innerHTML=`<div class="sheetsummary">Total do plano: <b>${money(t.totalVerba)}</b> em ${p.lines.length} ${p.lines.length===1?"linha":"linhas"} · ${num(t.impressoes)} impressões est. · ${num(t.cliques)} cliques est.</div>

    <div class="addcatrow"><label>Adicionar linha em outra categoria:</label>
      <select id="addCatSelect">${optionsAllByCat}</select>
      <button class="tbtn pri" data-act="add-line-select">+ Adicionar</button>

  // select vehicle values (can't set selected in template safely with dynamic optgroups) + bind
  p.lines.forEach(l=>{
    el.querySelectorAll(`select[data-line="${l.id}"][data-k="veiculo"]`).forEach(sel=>sel.value=l.veiculo);
  });
  el.querySelectorAll("[data-line]").forEach(input=>{
    const evt = "change";
    input.addEventListener(evt,()=>{
      const line=p.lines.find(x=>x.id===input.dataset.line);
      if(!line) return;
      const k=input.dataset.k;
      let v=input.value;
      if(k==="custo"||k==="verba") v=parseFloat(v)||0;
      if(k.startsWith("extra.")){
        if(!line.extra) line.extra={};
        line.extra[k.split(".")[1]]=v;
      }else{
        line[k]=v;
      }
      if(k==="veiculo"){
        const veh=vehicle(v); const oldVeh=vehicle(line.veiculo);
        if(veh){
          const oldCat=oldVeh?oldVeh.cat:null;
          line.funil=veh.funil; line.modelo=veh.modelo; line.papel=PAPEL_POR_FUNIL[veh.funil];
          if(oldCat!==veh.cat) line.extra={};
        }
      }
      if(k==="funil" && !line._papelManual){ line.papel=PAPEL_POR_FUNIL[v]; }
      if(k==="papel"){ line._papelManual=true; }
      // dispara o preenchimento automático (cada categoria com sua própria lógica) sempre que o campo que
      // identifica o inventário mudar: veículo, praça, ou o campo-referência específico da categoria
      // (programa/emissora p/ TV e rádio, publicação p/ impresso, rede p/ cinema, formato p/ OOH).
      const gatilhos=["veiculo","extra.praca","extra.programa","extra.emissora","extra.publicacao","extra.rede","extra.formatoOOH","extra.insercoes"];
      if(gatilhos.includes(k)){
        const veh=vehicle(line.veiculo);
        if(veh) autoFillRef(line, veh.cat, p.criteria);
      }
      // assim que custo e nº de inserções estiverem definidos, a verba se preenche sozinha — sem precisar
      // clicar em nada ou "estimar" à parte, valendo pra qualquer categoria.
      if((k==="extra.insercoes"||k==="custo") && line.extra&&line.extra.insercoes&&line.custo){
        line.verba=Math.round(parseFloat(line.custo)*parseFloat(line.extra.insercoes)*100)/100;
      }
      save();
      render();
    });
  });
  const addSel=document.getElementById("addCatSelect");
  const addBtn=el.querySelector('[data-act="add-line-select"]');
  if(addBtn) addBtn.addEventListener("click",()=>{
    const p2=curPlan(); const veh=vehicle(addSel.value);
    p2.lines.push({id:uid(),veiculo:veh.k,funil:veh.funil,papel:PAPEL_POR_FUNIL[veh.funil],titulo:"",modelo:veh.modelo,custo:"",verba:"",inicio:"",fim:"",extra:{}});
    save(); render();
  });
}

/* ===================== painel de análises ===================== */
function catColor(catKey){
  const palette={tv:"#3F6BF0",radio:"#2F6FB2",ooh:"#B96A22",cinema:"#9A57A8",impresso:"#7A7D93",audio:"#B0496B",busca:"#D33B3B",social:"#0E8C7F",display:"#4C9A51",video:"#0E8C7F",retail:"#C2410C",influ:"#B9820C",afiliados:"#5759D1",crm:"#159069",app:"#2F6FB2",gaming:"#B0496B"};
  return palette[catKey]||"#3F6BF0";
}
function funilColor(k){return {topo:"var(--topo)",meio:"var(--meio)",fundo:"var(--fundo)",retencao:"var(--ret)"}[k]||"var(--brand)";}
function barList(byKey, labels, total, colorFn){
  const rows=Object.entries(byKey).sort((a,b)=>b[1]-a[1]);
  if(!rows.length) return `<div class="hint">Sem verba alocada ainda.</div>`;
  return `<div class="barlist">${rows.map(([k,v])=>{
    const pct=total? Math.round(v/total*100):0;
    return `<div class="barrow"><div class="bl"><b>${esc(labels[k]||k)}</b><span>${money(v)} · ${pct}%</span></div>
      <div class="bartrack"><i style="width:${pct}%;background:${colorFn(k)}"></i></div></div>`;
  }).join("")}</div>`;
}
function stackBar(byKey, labels, total, colorFn){
  const keys=Object.keys(labels).filter(k=>byKey[k]);
  if(!keys.length) return `<div class="hint">Sem verba alocada ainda.</div>`;
  const stack=`<div class="stack">${keys.map(k=>{
    const pct=total? (byKey[k]/total*100):0;
    return `<span style="width:${pct}%;background:${colorFn(k)}"></span>`;
  }).join("")}</div>`;
  const legend=`<div class="legend">${keys.map(k=>{
    const pct=total? Math.round(byKey[k]/total*100):0;
    return `<span><i style="background:${colorFn(k)}"></i>${esc(labels[k])} — ${pct}%</span>`;
  }).join("")}</div>`;
  return stack+legend;
}
function timelineHTML(p){
  const dated=p.lines.filter(l=>l.inicio&&l.fim);
  if(!dated.length) return `<div class="hint">Defina início e fim nas linhas para ver o cronograma.</div>`;
  let min=null,max=null;
  dated.forEach(l=>{
    const di=new Date(l.inicio+"T00:00:00"), df=new Date(l.fim+"T00:00:00");
    if(!min||di<min) min=di; if(!max||df>max) max=df;
  });
  const totalDays=Math.max(1, Math.round((max-min)/86400000)+1);
  const rows=dated.map(l=>{
    const v=vehicle(l.veiculo);
    const di=new Date(l.inicio+"T00:00:00"), df=new Date(l.fim+"T00:00:00");
    const startPct=Math.max(0,(di-min)/86400000)/totalDays*100;
    const widthPct=Math.max(2,(df-di)/86400000+1)/totalDays*100;
    return `<div class="tlrow"><div class="tlname">${esc(v?v.label:l.veiculo)}</div>
      <div class="tltrack"><div class="tlbar" style="left:${startPct}%;width:${widthPct}%;background:${catColor(v?v.cat:"")}"></div></div></div>`;
  }).join("");
  return rows;
}
function openAnalytics(){
  const p=curPlan(); const t=planTotals(p);
  document.getElementById("panel").innerHTML=`
    <header><h3>Análises do plano</h3><button class="x" data-act="close-panel">×</button></header>
    <div class="panelbody">
      <h4>Verba por veículo</h4>
      ${barList(t.byCat, CATS.reduce((o,c)=>{o[c.key]=c.label;return o;},{}), t.totalVerba, catColor)}
      <h4>Verba por etapa do funil</h4>
      ${stackBar(t.byFunil, FUNILFULL, t.totalVerba, funilColor)}
      <h4>Offline × Digital</h4>
      ${stackBar(t.byClass, {off:"Offline",dig:"Digital"}, t.totalVerba, c=>c==="off"?"var(--off)":"var(--dig)")}
      <h4>Verba por praça</h4>
      ${barList(t.byRegiao, Object.keys(t.byRegiao).reduce((o,k)=>{o[k]=pracaLabelAny(k);return o;},{}), t.totalVerba, ()=>"var(--brand)")}
      <h4>Cronograma de veiculação</h4>
      ${timelineHTML(p)}
    </div>`;
  document.getElementById("panel").classList.add("open");
  document.getElementById("panelback").classList.add("open");
}
function closeAnalytics(){
  document.getElementById("panel").classList.remove("open");
  document.getElementById("panelback").classList.remove("open");

function openGradeDias(lineId){
  const p=curPlan(); const l=p.lines.find(x=>x.id===lineId); if(!l||!l.inicio||!l.fim) return;
  const v=vehicle(l.veiculo);
  const start=new Date(l.inicio+"T00:00:00"), end=new Date(l.fim+"T00:00:00");
  const days=[]; for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)) days.push(new Date(d));
  const byMonth={};
  days.forEach(d=>{ const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); (byMonth[key]=byMonth[key]||[]).push(d); });
  const dias=l.insercoesPorDia||{};
  document.getElementById("modal").innerHTML=`
    <header><h3>Grade de inserções — ${esc(v?v.label:l.veiculo)}</h3><button class="x" data-act="close-modal">×</button></header>
    <div class="form" style="max-height:60vh;overflow:auto">
      <div class="hint" style="margin-bottom:10px">Preencha o nº de inserções em cada dia — igual às planilhas tradicionais de mapa de mídia. O total substitui o campo "Nº inserções" e passa a valer no mapa mensal.</div>
      ${Object.entries(byMonth).map(([mk,ds])=>`
        <div style="margin-bottom:14px">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:6px">${ds[0].toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px">
            ${ds.map(d=>{
              const key=ymd_(d);
              return `<div style="border:1px solid var(--grid-strong);border-radius:8px;padding:5px 7px;background:var(--surface-2)">
                <div style="font-size:10px;color:var(--muted);font-weight:700">${d.toLocaleDateString("pt-BR",{day:"2-digit",weekday:"short"})}</div>
                <input type="number" min="0" step="1" data-day="${key}" value="${dias[key]||""}" style="width:100%;border:0;background:transparent;font-size:14px;font-weight:700;padding:2px 0;font-family:'JetBrains Mono',monospace">
              </div>`;
            }).join("")}
          </div>
        </div>
      `).join("")}
      <button class="save" data-act="save-grade-dias" data-id="${l.id}">Salvar grade</button>
    </div>`;
  document.getElementById("backdrop").classList.add("open");
}
function ymd_(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function saveGradeDias(lineId){
  const p=curPlan(); const l=p.lines.find(x=>x.id===lineId); if(!l) return;
  const novo={}; let total=0;
  document.querySelectorAll("[data-day]").forEach(inp=>{
    const n=parseFloat(inp.value)||0;
    if(n>0){ novo[inp.dataset.day]=n; total+=n; }
  });
  l.insercoesPorDia=novo;
  if(!l.extra) l.extra={};
  if(total>0) l.extra.insercoes=total;
  save(); closeModal(); render();
}

// monta um registro formatado do plano (capa, briefing, estratégia, linhas por veículo, mapa mensal,
// personas) só pra impressão/"salvar como PDF" — não aparece na tela, só no @media print.
function renderPrintReport(p){ document.getElementById("printReport").innerHTML=buildPrintReportHTML(p); }
// mapa de inserções no formato tradicional (linhas = veiculação, colunas = semanas do período do plano,
// célula = nº de inserções naquela semana) — usa a grade de dias real quando o aluno preencheu; senão
// marca "•" nas semanas em que a linha está ativa, sem quantidade exata.
function buildMapaInsercoesHTML(p){
  const dated=p.lines.filter(l=>l.inicio&&l.fim);
  if(!dated.length) return null;
  let min=null,max=null;
  dated.forEach(l=>{ const di=new Date(l.inicio+"T00:00:00"), df=new Date(l.fim+"T00:00:00"); if(!min||di<min) min=di; if(!max||df>max) max=df; });
  const totalDays=Math.max(1, Math.round((max-min)/86400000)+1);
  const nWeeks=Math.max(1, Math.ceil(totalDays/7));
  const rows=dated.map(l=>{
    const v=vehicle(l.veiculo);
    const li=new Date(l.inicio+"T00:00:00"), lf=new Date(l.fim+"T00:00:00");
    const semanas=Array(nWeeks).fill(null);
    const diasMap=l.insercoesPorDia||{};
    if(Object.keys(diasMap).length){
      semanas.fill(0);
      Object.entries(diasMap).forEach(([dayKey,n])=>{
        const d=new Date(dayKey+"T00:00:00");
        const idx=Math.floor((d-min)/(7*86400000));
        if(idx>=0&&idx<nWeeks) semanas[idx]+=n;
      });
    }else{
      for(let w=0; w<nWeeks; w++){
        const wStart=new Date(min.getTime()+w*7*86400000), wEnd=new Date(min.getTime()+(w+1)*7*86400000-1);
        if(li<=wEnd && lf>=wStart) semanas[w]="•";
      }
    }
    return {label:(l.titulo||(v?v.label:l.veiculo)), semanas};
  });
  const totalsPorSemana=Array(nWeeks).fill(0);
  rows.forEach(r=>r.semanas.forEach((val,i)=>{ if(typeof val==="number") totalsPorSemana[i]+=val; }));
  const header=`<tr><th>Veículo / Ação</th>${Array.from({length:nWeeks},(_,i)=>`<th class="num">S${i+1}</th>`).join("")}</tr>`;
  const body=rows.map(r=>`<tr><td>${esc(r.label)}</td>${r.semanas.map(v=>`<td class="num">${v===null?"—":v}</td>`).join("")}</tr>`).join("");
  const foot=`<tr class="pr-totalrow"><td>Total de inserções/semana</td>${totalsPorSemana.map(v=>`<td class="num">${v||"—"}</td>`).join("")}</tr>`;
  return `<div style="overflow-x:auto"><table class="pr-table" style="font-size:10px"><thead>${header}</thead><tbody>${body}${foot}</tbody></table></div>
    <div class="hint" style="font-size:10px;color:#7A7D93;margin-top:2px">Semanas contadas a partir de ${min.toLocaleDateString("pt-BR")}. "•" indica linha ativa na semana sem grade de dias preenchida; números vêm da grade de inserções por dia (📅 na Alocação).</div>`;
}
function buildPrintReportHTML(p){
  const t=planTotals(p); const c=p.criteria; const rf=reachFreq(p);

  const groups=CATS.map(cat=>({cat, lines:p.lines.filter(l=>{ const v=vehicle(l.veiculo); return v&&v.cat===cat.key; })})).filter(g=>g.lines.length);
