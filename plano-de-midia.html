          return `<tr><td>${esc(v?v.label:l.veiculo)}</td><td>${esc(l.titulo||"—")}</td><td>${FUNIL[l.funil]||""}</td><td>${MODELO[l.modelo]||""}</td>
            <td class="num">${l.modelo==="FIXO"?"—":money(l.custo)}</td><td class="num">${money(l.verba)}</td><td>${r.qty?num(r.qty)+" "+r.label:(l.modelo==="FIXO"?"pacote":"—")}</td></tr>`;
        }).join("")}
      </tbody></table>
    </div>`;
  }).join("")||`<p style="font-size:13px;color:#7A7D93">Nenhuma linha de veiculação cadastrada.</p>`;

  const mm=monthlyMap(p);
  const mapaHtml = mm ? `<table class="pr-table"><thead><tr><th>Veículo</th>${mm.months.map(m=>`<th class="num">${m.label}</th>`).join("")}<th class="num">Total</th></tr></thead>
    <tbody>${mm.rows.map(r=>{ const v=vehicle(r.line.veiculo); const total=Object.values(r.values).reduce((s,x)=>s+x,0);
      return `<tr><td>${esc(v?v.label:r.line.veiculo)}</td>${mm.months.map(m=>`<td class="num">${money(r.values[m.key])}</td>`).join("")}<td class="num">${money(total)}</td></tr>`;
    }).join("")}
    <tr class="pr-totalrow"><td>Total do mês</td>${mm.months.map(m=>`<td class="num">${money(mm.totals[m.key])}</td>`).join("")}<td class="num">${money(Object.values(mm.totals).reduce((s,x)=>s+x,0))}</td></tr>
    </tbody></table>` : `<p style="font-size:13px;color:#7A7D93">Defina início e fim nas linhas para gerar o mapa mensal.</p>`;

  const personasComNome=(p.personas||[]).filter(per=>per.nome);
  const personasHtml = personasComNome.length ? personasComNome.map(per=>{
    const tg=c.targets.find(x=>x.id===per.targetId); const target=tg&&TARGET_PROFILES[tg.key];
    return `<div class="pr-persona"><div class="pr-av">${esc(per.avatar||"🧑")}</div><div>
      <b>${esc(per.nome)}</b>${per.idade?", "+esc(per.idade):""}${per.cidade?" — "+esc(per.cidade):""}<br>
      ${per.ocupacao?`<span style="color:#454764">${esc(per.ocupacao)}</span><br>`:""}
      ${per.citacao?`<i>"${esc(per.citacao)}"</i><br>`:""}
      ${target?`<span style="font-size:11px;color:#7A7D93">Target: ${esc(target.label)}</span>`:""}
    </div></div>`;
  }).join("") : "";

  const estrategiaPorPersonaHtml = c.targets.length ? c.targets.map(tg=>{
    const per=(p.personas||[]).find(x=>x.targetId===tg.id);
    const target=TARGET_PROFILES[tg.key];
    const linhasDaPersona=p.lines.filter(l=>(l.targetIds||[]).includes(tg.id));
    const subtotal=linhasDaPersona.reduce((s,l)=>s+(parseFloat(l.verba)||0),0);
    const papelLbl=tg.papel==="primario"?"Primário":tg.papel==="secundario"?"Secundário":"Terciário";
    const nomePersona=(per&&per.nome)?per.nome:(target?target.label:"—");
    if(!linhasDaPersona.length){
      return `<div class="pr-cat"><h3>${papelLbl}: ${esc(nomePersona)} — sem linhas atribuídas</h3></div>`;
    }
    return `<div class="pr-cat">
      <h3>${papelLbl}: ${esc(nomePersona)} — ${money(subtotal)} (${((subtotal/(t.totalVerba||1))*100).toFixed(0)}% do plano)</h3>
      <table class="pr-table"><thead><tr><th>Veículo</th><th>Título</th><th>Funil</th><th class="num">Verba</th></tr></thead><tbody>
        ${linhasDaPersona.map(l=>{ const v=vehicle(l.veiculo);
          return `<tr><td>${esc(v?v.label:l.veiculo)}</td><td>${esc(l.titulo||"—")}</td><td>${FUNIL[l.funil]||""}</td><td class="num">${money(l.verba)}</td></tr>`;

  </tbody></table>` : `<p style="font-size:13px;color:#7A7D93">Critérios de planejamento incompletos — a checagem de coerência não pôde ser calculada.</p>`;

  return `<div class="pr-page">
    <div class="pr-cover">
      <div class="pr-eyebrow">Plano de Mídia</div>
      <h1>${esc(p.nome)}</h1>
      <div class="pr-meta">
        <span><b>Cliente:</b> ${esc(p.cliente||"—")}</span>
        <span><b>Período:</b> ${p.inicio?fmtd(p.inicio):"—"} – ${p.fim?fmtd(p.fim):"—"}</span>
        <span><b>Verba total:</b> ${money(p.verba)}</span>

    <div class="pr-section"><h2>Briefing</h2>
      <div class="pr-grid2">

        <div class="pr-kv"><b>Praças</b><span>${esc(pracasLbl)}</span></div>
        <div class="pr-kv"><b>Target(s)</b><span>${esc(targetsLbl)}</span></div>
      </div>
    </div>

    <div class="pr-section"><h2>Estratégia</h2>
      <div class="pr-grid2">
        <div class="pr-kv"><b>Meta numérica do objetivo</b><span>${(c.metaNumerica&&c.metaNumerica.valor)?`${num(c.metaNumerica.valor)} ${esc(c.metaNumerica.unidade)} em ${FUNIL[c.metaNumerica.etapa]}`:"—"}</span></div>
        <div class="pr-kv"><b>Postura de custo</b><span>${({eficiencia:"Eficiência",premium:"Premium",misto:"Misto"})[c.custoPostura]||"—"}</span></div>
        <div class="pr-kv"><b>Distribuição por funil</b><span>${Object.entries(c.funil).map(([k,v])=>`${FUNIL[k]} ${v}%`).join(" · ")}</span></div>
        <div class="pr-kv"><b>KPI por etapa</b><span>${Object.entries(c.kpi).map(([k,arr])=>`${FUNIL[k]}: ${arr.map(kk=>KPI_OPTS[kk]?KPI_OPTS[kk].label:kk).join(", ")||"—"}`).join(" · ")}</span></div>
        <div class="pr-kv"><b>População estimada no target</b><span>${num(publicoEstimado(c))} pessoas</span></div>
        <div class="pr-kv"><b>Cobertura / Frequência desejadas</b><span>${c.coberturaAlvo||"—"}% · ${c.freqMin||"—"}x–${c.freqMax||"—"}x</span></div>
        ${rf?`<div class="pr-kv"><b>Cobertura estimada</b><span>${rf.reachPct.toFixed(1)}%</span></div>
        <div class="pr-kv"><b>Frequência média estimada</b><span>${rf.avgFreq.toFixed(1)}x</span></div>`:""}
      </div>
    </div>

    ${personasHtml?`<div class="pr-section"><h2>Personas</h2>${personasHtml}</div>`:""}

    <div class="pr-section"><h2>Linhas de veiculação</h2>${linhasHtml}
      <table class="pr-table"><tr class="pr-totalrow"><td>Total do plano</td><td class="num">${money(t.totalVerba)}</td></tr></table>

    ${estrategiaPorPersonaHtml?`<div class="pr-section"><h2>Estratégia por persona</h2>${estrategiaPorPersonaHtml}</div>`:""}

// dentro do artefato publicado, window.print() roda numa aba isolada (iframe) e o navegador costuma
// bloquear silenciosamente a impressão vinda de lá — por isso, em vez de depender disso, baixamos um
// arquivo HTML pronto: o aluno abre e usa Ctrl/Cmd+P > Salvar como PDF na própria aba do navegador.
async function exportPDF(){
  const p=curPlan();
  const reportBody=buildPrintReportHTML(p);
  const fullHtml=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(p.nome)} — Plano de Mídia</title><style>${PRINT_CSS}</style></head><body>${reportBody}</body></html>`;
  const filename=`plano-de-midia-${p.nome.replace(/[^\w\-]+/g,"_")}.html`;
  try{
    const downloads=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(downloads){
      const blob=new Blob([fullHtml],{type:"text/html"});
      await downloads.save({filename,data:blob});
      toast("Baixado! Abra o arquivo e use Ctrl/Cmd+P → Salvar como PDF.");
      return;
    }
  }catch(e){}
  // fora do artefato (GitHub Pages, arquivo local): a impressão direta funciona normalmente
  renderPrintReport(p);
  window.print();
}

async function exportExcel(){
  if(typeof XLSX==="undefined"){ toast("Biblioteca de Excel não carregou — tente novamente."); return; }
  const p=curPlan(); const t=planTotals(p); const rf=reachFreq(p); const c=p.criteria;
  const wb=XLSX.utils.book_new();

  // Resumo
  const resumo=[
    ["Plano de Mídia — "+p.nome],
    [],
    ["Cliente", p.cliente||""], ["Objetivo", p.objetivo||""], ["Persona/público", p.publico||""],
    ["Praças", c.pracas.map(pr=>{ const [tipo,key]=pr.split(":"); return tipo==="nacional"?"Nacional":tipo==="regiao"?REGIOES[key]:ESTADOS[key]; }).join(", ")],
    ["Targets", c.targets.map(t2=>`${t2.papel}: ${TARGET_PROFILES[t2.key]?TARGET_PROFILES[t2.key].label:"—"}`).join(" | ")],
    ["População estimada no target", num(publicoEstimado(c))],
    ["Cobertura desejada", (c.coberturaAlvo||"—")+"%"], ["Frequência desejada", `${c.freqMin||"—"}x – ${c.freqMax||"—"}x`],
    [],
    ["Verba total do plano", p.verba||0], ["Verba alocada", t.totalVerba],
    ["Impressões estimadas", Math.round(t.impressoes)], ["Cliques estimados", Math.round(t.cliques)],
    ["Views estimados", Math.round(t.views)], ["Conversões estimadas", Math.round(t.conversoes)],
    rf?["Cobertura estimada (%)", rf.reachPct.toFixed(1)]:["Cobertura estimada (%)","—"],
    rf?["Frequência média estimada", rf.avgFreq.toFixed(1)]:["Frequência média estimada","—"],
    [],
    ["Verba por veículo"],
    ...Object.entries(t.byCat).map(([k,v])=>[catInfo(k)?catInfo(k).label:k, v]),
    [],
    ["Verba por etapa do funil"],
    ...Object.entries(t.byFunil).map(([k,v])=>[FUNILFULL[k]||k, v]),
  ];
  const wsResumo=XLSX.utils.aoa_to_sheet(resumo);
  XLSX.utils.book_append_sheet(wb, wsResumo, "Resumo");

  // Linhas de veiculação
  const allExtraKeys=[...new Set(p.lines.flatMap(l=>Object.keys(l.extra||{})))];
  const header=["#","Categoria","Veículo","Título","Funil","Papel","Modelo","Custo unitário","Verba","Resultado estimado","Início","Fim",...allExtraKeys];
  const linhas=[header, ...p.lines.map((l,i)=>{
    const v=vehicle(l.veiculo); const cat=v?catInfo(v.cat):null; const r=lineResult(l);
    return [i+1, cat?cat.label:"", v?v.label:l.veiculo, l.titulo||"", FUNIL[l.funil]||"", PAPEL[l.papel]||"", MODELO[l.modelo]||"",
      l.custo||0, l.verba||0, r.qty?`${Math.round(r.qty)} ${r.label}`:(l.modelo==="FIXO"?"pacote fechado":""),
      l.inicio||"", l.fim||"", ...allExtraKeys.map(k=>(l.extra&&l.extra[k])||"")];
  })];
  const wsLinhas=XLSX.utils.aoa_to_sheet(linhas);
  XLSX.utils.book_append_sheet(wb, wsLinhas, "Linhas de veiculação");

  // Mapa mensal
  const mm=monthlyMap(p);
  if(mm){
    const mmHeader=["Veículo", ...mm.months.map(m=>m.label), "Total"];
    const mmRows=mm.rows.map(r=>{
      const v=vehicle(r.line.veiculo);
      const totalLinha=Object.values(r.values).reduce((s,x)=>s+x,0);
      return [v?v.label:r.line.veiculo, ...mm.months.map(m=>Math.round(r.values[m.key])), Math.round(totalLinha)];
    });
    const mmTotais=["Total do mês", ...mm.months.map(m=>Math.round(mm.totals[m.key])), Math.round(Object.values(mm.totals).reduce((s,x)=>s+x,0))];
    const wsMM=XLSX.utils.aoa_to_sheet([mmHeader, ...mmRows, mmTotais]);
    XLSX.utils.book_append_sheet(wb, wsMM, "Mapa mensal");
  }

  const filename=`plano-de-midia-${p.nome.replace(/[^\w\-]+/g,"_")}.xlsx`;
  try{
    const downloads=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(downloads){
      const arr=XLSX.write(wb,{bookType:"xlsx",type:"array"});
      const blob=new Blob([arr],{type:"application/octet-stream"});
      await downloads.save({filename,data:blob});
      return;
    }
  }catch(e){}
  XLSX.writeFile(wb, filename);
}

async function exportJSON(){
  const filename="plano-de-midia-backup-"+new Date().toISOString().slice(0,10)+".json";
  const json=JSON.stringify(data,null,2);
  try{
    const downloads=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(downloads){ await downloads.save({filename,data:json}); return; }
  }catch(e){}
  const blob=new Blob([json],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
}
function importJSON(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const incoming=JSON.parse(reader.result);
      if(incoming&&Array.isArray(incoming.plans)){
        incoming.plans.forEach(p=>{ if(!p.id) p.id=uid(); });
        data.plans=data.plans.concat(incoming.plans);
        activePlanId=incoming.plans.length?incoming.plans[incoming.plans.length-1].id:activePlanId;
        save(); render(); toast("Planos importados com sucesso.");
      }else toast("Arquivo inválido.");
    }catch(e){ toast("Erro ao ler o arquivo."); }
  };
  reader.readAsText(file);
}
function toast(msg){
  let t=document.querySelector(".toast");
  if(!t){ t=document.createElement("div"); t.className="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600);
}

/* ===================== eventos globais ===================== */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==="new-plan") newPlan();
  else if(act==="select-plan"){ activePlanId=id; viewMode=criteriaComplete(curPlan())?"alocacao":"criterios"; render(); }
  else if(act==="set-view"){
    const p=curPlan();
    const gated=["alocacao","jornada","coerencia"];
    if(gated.includes(b.dataset.view) && !criteriaComplete(p)){
      viewMode="criterios"; blockedMsg=`Complete os critérios de planejamento antes de ir para "${{alocacao:"Alocação de verba",jornada:"Jornada e multicanalidade",coerencia:"Coerência do plano"}[b.dataset.view]}". É essa etapa que obriga você a decidir o racional do plano antes de escolher veículos.`;
    }else{ viewMode=b.dataset.view; blockedMsg=null; }
    render();
  }
  else if(act==="toggle-line-target"){
    const p=curPlan(); const line=p.lines.find(x=>x.id===id); const targetId=b.dataset.target;
    if(line){
      if(!line.targetIds) line.targetIds=[];
      const i=line.targetIds.indexOf(targetId);
      if(i>=0) line.targetIds.splice(i,1); else line.targetIds.push(targetId);
      save(); render();
    }
  }
  else if(act==="toggle-cat"){
    const p=curPlan(); const key=b.dataset.key; const i=p.criteria.publico.indexOf(key);
    if(i>=0) p.criteria.publico.splice(i,1); else p.criteria.publico.push(key);
    save(); render();
  }
  else if(act==="add-praca"){
    const p=curPlan(); const sel=document.getElementById("pracaAddSelect"); if(!sel||!sel.value) return;
    if(!p.criteria.pracas.includes(sel.value)) p.criteria.pracas.push(sel.value);
    p.criteria.publicoTamanho=publicoEstimado(p.criteria);
    save(); render();
  }
  else if(act==="del-praca"){
    const p=curPlan(); const i=p.criteria.pracas.indexOf(b.dataset.key);
    if(i>=0) p.criteria.pracas.splice(i,1);
    p.criteria.publicoTamanho=publicoEstimado(p.criteria);
    save(); render();
  }
  else if(act==="add-target"){
    const p=curPlan();
    const papel = p.criteria.targets.some(t=>t.papel==="primario") ? "secundario" : "primario";
    p.criteria.targets.push({id:uid(),papel,key:""}); save(); render();
  }
  else if(act==="del-target"){
    const p=curPlan(); p.criteria.targets.splice(+b.dataset.idx,1);
    p.criteria.publicoTamanho=publicoEstimado(p.criteria);
    save(); render();
  }
  else if(act==="add-pico"){
    const p=curPlan(); p.criteria.picos.push({inicio:"",fim:""}); save(); render();
  }
  else if(act==="del-pico"){
    const p=curPlan(); p.criteria.picos.splice(+b.dataset.idx,1); save(); render();
  }
  else if(act==="del-plan"){ e.stopPropagation(); if(confirm("Excluir este plano de mídia?")) delPlan(id); }
  else if(act==="add-line"){
    const p=curPlan();
    const veh = b.dataset.veiculo ? vehicle(b.dataset.veiculo) : VEHICLES[0];
    p.lines.push({id:uid(),veiculo:veh.k,funil:veh.funil,papel:PAPEL_POR_FUNIL[veh.funil],titulo:"",modelo:veh.modelo,custo:"",verba:"",inicio:"",fim:"",extra:{}});
    save(); render();
  }
  else if(act==="del-line"){ const p=curPlan(); p.lines=p.lines.filter(x=>x.id!==id); save(); render(); }
  else if(act==="usar-bench"){
    const p=curPlan(); const line=p.lines.find(x=>x.id===id); const v=line&&vehicle(line.veiculo); const range=v&&BENCHNUM[v.k];
    if(line&&range){ line.custo=Math.round(((range[0]+range[1])/2)*100)/100; save(); render(); }
  }
  else if(act==="grade-dias") openGradeDias(id);
  else if(act==="save-grade-dias") saveGradeDias(id);
  else if(act==="usar-audiencia-ref"){
    const p=curPlan(); const line=p.lines.find(x=>x.id===id); const v=line&&vehicle(line.veiculo);
    if(line&&v){
      const ok=autoFillRef(line, v.cat, p.criteria);
      if(ok && !MERCADOS_TV[line.extra.praca]) toast("Selecione a praça/mercado desta linha para calcular audiência no target e valor exato.");
      else if(ok && !combinedTargetPct(p.criteria)) toast("Declare ao menos um target nos Critérios (etapa 2) para calcular a audiência no target.");
      save(); render();
    }
  }
  else if(act==="usar-insercoes"){
    const p=curPlan(); const line=p.lines.find(x=>x.id===id);
    if(line&&line.extra&&line.extra.insercoes&&line.custo){ line.verba=Math.round(parseFloat(line.custo)*parseFloat(line.extra.insercoes)*100)/100; save(); render(); }
  }
  else if(act==="glossary") openGlossary();
  else if(act==="close-modal") closeModal();
  else if(act==="analytics") openAnalytics();
  else if(act==="close-panel") closeAnalytics();
  else if(act==="print") exportPDF();
  else if(act==="export") exportJSON();
  else if(act==="export-excel") exportExcel();
  else if(act==="reset-plan"){ if(confirm("Apagar todos os dados deste plano e começar do zero? Essa ação não pode ser desfeita.")) resetPlan(curPlan().id); }
  else if(act==="midiakits") openMidiaKits();
  else if(act==="import") document.getElementById("importFile").click();
});
document.getElementById("backdrop").addEventListener("click",e=>{ if(e.target.id==="backdrop") closeModal(); });
document.getElementById("panelback").addEventListener("click",closeAnalytics);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeModal(); closeAnalytics(); } });
document.getElementById("importFile").addEventListener("change",e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=""; });
document.getElementById("planNameInput").addEventListener("change",e=>{ const p=curPlan(); p.nome=e.target.value||"Sem nome"; save(); renderTabs(); });

/* ===================== boot ===================== */
(async function(){ await load(); viewMode=criteriaComplete(curPlan())?"alocacao":"criterios"; render(); })();
